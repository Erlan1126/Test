# Builds the iPhone app in the cloud and sends it to TestFlight, so no Mac is needed.
# Setup steps are in IPHONE-APP.md ("Option B").
workflows:
  ios-testflight:
    name: iPhone app → TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: App Store Connect key
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.erlan1126.todo
      node: 22
      xcode: latest
    scripts:
      - name: Install packages
        script: npm ci
      - name: Copy the app into the iPhone project
        script: npm run sync
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Give each build a new number
        script: |
          cd ios/App
          agvtool new-version -all $(($(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID") + 1))
      - name: Build the app
        script: xcode-project build-ipa --project "ios/App/App.xcodeproj" --scheme "App"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
