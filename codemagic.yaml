# Cloud builds on Codemagic (codemagic.io), as an alternative to GitHub's Mac machines.
# The free plan includes 500 build minutes a month on Macs. Setup is in STORES.md.
workflows:
  ios-testflight:
    name: Skyrise iPhone app → TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    # Builds start by themselves whenever the Skyrise app branch (skyrise-app) gets new work.
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: skyrise-app
          include: true
      cancel_previous_builds: true
    integrations:
      app_store_connect: App Store Connect key
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.erlanstudios.skyrise
      node: 22
      xcode: latest
      cocoapods: default
    scripts:
      - name: Build the game and copy it into the iPhone project
        script: |
          npm ci
          npm test
          npm run build
          npx cap sync ios
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Give each build a new number
        script: |
          cd ios/App
          agvtool new-version -all $BUILD_NUMBER
      - name: Build the app
        script: |
          # If it fails, print Xcode's own error lines so the reason shows in this log.
          xcode-project build-ipa --workspace "ios/App/App.xcworkspace" --scheme "App" || {
            echo "===== Xcode errors ====="
            grep -hE "error:|requires a provisioning profile|doesn't (include|support)|entitlement" /tmp/xcodebuild_logs/*.log | sort -u | head -40
            exit 1
          }
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        # Uploaded builds go straight to internal TestFlight testers; sending them to
        # external testers needs Beta App Review details, done by hand when wanted.
        submit_to_testflight: false
