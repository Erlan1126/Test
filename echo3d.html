<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Echo in 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500&family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* One dark, lantern-lit world, the game's own look, so this page is single-theme on purpose.
     Layout: the 3D street fills the screen; a thin HUD on top, the Sing button bottom right. */
  :root {
    color-scheme: dark;
    --night: #03050b;
    --ink: #eef6ff;
    --dim: #8ea3c8;
    --lamp: #ffcf7a;
    --panel: rgba(8, 12, 28, 0.72);
    --line: rgba(160, 220, 255, 0.2);
    --display: "Cinzel", Georgia, serif;
    --body: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--night); color: var(--ink); font-family: var(--body); overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; }
  canvas#view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .vignette { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 55%, transparent 45%, rgba(2, 3, 8, 0.75) 100%); }
  .hud { position: fixed; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
    padding-top: calc(12px + env(safe-area-inset-top, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); pointer-events: none; }
  .brand { font-family: var(--display); letter-spacing: 0.32em; font-size: 15px; text-shadow: 0 0 14px rgba(126, 232, 255, 0.7); }
  .brand small { display: block; font-family: var(--body); letter-spacing: 0.12em; text-transform: uppercase; font-size: 10px; color: var(--dim); margin-top: 4px; }
  .pill { background: var(--panel); border: 1px solid var(--line); border-radius: 99px; padding: 7px 13px; font-size: 14px; white-space: nowrap; backdrop-filter: blur(6px); }
  .pill b { color: var(--lamp); font-weight: 600; }
  #hint { position: fixed; left: 50%; bottom: calc(28px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); max-width: calc(100% - 150px);
    background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 10px 16px; font-size: 15px; text-align: center; pointer-events: none; transition: opacity 0.5s; backdrop-filter: blur(6px); }
  #sing { position: fixed; right: calc(20px + env(safe-area-inset-right, 0px)); bottom: calc(22px + env(safe-area-inset-bottom, 0px)); width: 76px; height: 76px; border-radius: 50%;
    border: 0; font-size: 34px; color: #0b1020; background: radial-gradient(circle at 40% 35%, #ffffff, #c8f2ff 60%, #7ee8ff); box-shadow: 0 0 34px rgba(126, 232, 255, 0.65); cursor: pointer; }
  #sing:active { transform: scale(0.94); }
  #sing:focus-visible { outline: 3px solid var(--lamp); outline-offset: 3px; }
  #flash { position: fixed; inset: 0; background: radial-gradient(circle, transparent 40%, rgba(255, 90, 160, 0.45)); opacity: 0; pointer-events: none; transition: opacity 0.5s; }
  #done { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(3, 5, 11, 0.55); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  #done .card { background: var(--panel); border: 1px solid var(--line); border-radius: 24px; padding: 26px 22px; max-width: 340px; text-align: center; display: grid; gap: 12px; backdrop-filter: blur(8px); }
  #done h2 { margin: 0; font-family: var(--display); font-weight: 500; letter-spacing: 0.05em; text-wrap: balance; }
  #done p { margin: 0; color: var(--dim); line-height: 1.45; }
  #again { border: 0; border-radius: 16px; padding: 12px; font: 600 16px var(--body); background: var(--ink); color: #0b1020; cursor: pointer; }
  #err { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--dim); }
</style>

<canvas id="view" aria-label="A street of the lost city in 3D. Drag to swim, tap the note button to sing."></canvas>
<div class="vignette"></div>
<div class="hud">
  <div class="brand">ECHO<small>3D test · the lost city</small></div>
  <div class="pill">Street lamps <b id="lamps">0/5</b></div>
</div>
<div id="hint">Drag anywhere to swim. Tap ♪ to sing.</div>
<button id="sing" aria-label="Sing">♪</button>
<div id="flash"></div>
<div id="done" hidden><div class="card"><h2>The street remembers</h2><p>Every lamp burns again and the portal is open. This is what Echo could look like in 3D.</p><button id="again">Play again</button></div></div>
<div id="err" hidden>This test needs WebGL, which this browser doesn't offer.</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script>
"use strict";
(() => {
  if (!window.THREE) { document.getElementById("err").hidden = false; return; }
  const $ = id => document.getElementById(id);
  const canvas = $("view");
  let renderer;
  try { renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: "high-performance" }); } catch (e) { $("err").hidden = false; return; }
  const DPR = Math.min(devicePixelRatio || 1, 2);
  renderer.setPixelRatio(DPR);
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 0.9;
  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x070a16, 0.065);
  const camera = new THREE.PerspectiveCamera(55, 1, 0.1, 140);
  scene.add(new THREE.HemisphereLight(0x3a4c8c, 0x08090f, 0.32));
  const moon = new THREE.DirectionalLight(0x6f8cff, 0.22); moon.position.set(-4, 10, 6); scene.add(moon);
  const R = (a, b) => a + Math.random() * (b - a);

  // ---------- Painted textures ----------
  const canvasTex = (w, h, draw, rx = 1, ry = 1, srgb = true) => {
    const c = document.createElement("canvas"); c.width = w; c.height = h;
    draw(c.getContext("2d"), w, h);
    const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx, ry);
    if (srgb) t.encoding = THREE.sRGBEncoding;
    t.anisotropy = 4;
    return t;
  };
  // Brick: colour and a matching height map so the mortar sinks and the bricks catch light.
  const brickCols = [], brickBump = [];
  const BR = 16, BC = 6;
  const drawBricks = (g, w, h, tint, bump) => {
    g.fillStyle = bump ? "#000" : "#1a1c24"; g.fillRect(0, 0, w, h);
    const bh = h / BR, bw = w / BC;
    for (let y = 0; y < BR; y++) for (let x = -1; x < BC; x++) {
      const ox = (y % 2) * bw / 2, v = R(0.75, 1.15);
      if (bump) { const b = Math.round(R(150, 230)); g.fillStyle = `rgb(${b},${b},${b})`; }
      else g.fillStyle = `rgb(${Math.round(tint[0] * v)},${Math.round(tint[1] * v)},${Math.round(tint[2] * v)})`;
      g.fillRect(x * bw + ox + 2, y * bh + 2, bw - 4, bh - 4);
      if (!bump && Math.random() < 0.15) { g.fillStyle = "rgba(0,0,0,0.25)"; g.fillRect(x * bw + ox + 2, y * bh + bh * 0.6, bw - 4, bh * 0.3); }
    }
  };
  const TINTS = [[70, 74, 94], [82, 70, 74], [62, 72, 84], [86, 78, 66]];
  for (const t of TINTS) {
    brickCols.push(canvasTex(512, 512, (g, w, h) => drawBricks(g, w, h, t, false)));
    brickBump.push(canvasTex(512, 512, (g, w, h) => drawBricks(g, w, h, t, true), 1, 1, false));
  }
  // Cobbles: irregular, flat-topped stones of different sizes in uneven rows, dark joints between.
  const cobbleDraw = bump => (g, w, h) => {
    g.fillStyle = bump ? "#202020" : "#0b0d13"; g.fillRect(0, 0, w, h);
    const rows = 16, rh = h / rows;
    for (let y = 0; y < rows; y++) {
      let x = -R(0, 20);
      while (x < w) {
        const sw = R(rh * 0.9, rh * 1.7), cx = x + sw / 2, cy = y * rh + rh / 2;
        const v = R(34, 58), tone = bump ? Math.round(R(170, 215)) : 0;
        g.fillStyle = bump ? `rgb(${tone},${tone},${tone})` : `rgb(${v + 8},${v + 11},${v + 20})`;
        g.beginPath(); g.roundRect ? g.roundRect(cx - sw / 2 + 2, cy - rh / 2 + 2, sw - 4, rh - 4, rh * 0.3) : g.rect(cx - sw / 2 + 2, cy - rh / 2 + 2, sw - 4, rh - 4); g.fill();
        if (!bump) { g.fillStyle = "rgba(255,255,255,0.05)"; g.fillRect(cx - sw / 2 + 5, cy - rh / 2 + 4, sw - 12, rh * 0.22); }
        x += sw;
      }
    }
  };
  const cobble = canvasTex(512, 512, cobbleDraw(false), 2.5, 14), cobbleBump = canvasTex(512, 512, cobbleDraw(true), 2.5, 14, false);
  // Windows: mullioned glass, warm with a lamp inside or dark with a cold glint.
  const windowTex = lit => canvasTex(128, 192, (g, w, h) => {
    const gr = g.createLinearGradient(0, 0, 0, h);
    if (lit) { gr.addColorStop(0, "#ffe2a8"); gr.addColorStop(0.6, "#ffae4a"); gr.addColorStop(1, "#c86a20"); }
    else { gr.addColorStop(0, "#1a2440"); gr.addColorStop(1, "#06080f"); }
    g.fillStyle = gr; g.beginPath(); g.moveTo(0, h); g.lineTo(0, w / 2); g.arc(w / 2, w / 2, w / 2, Math.PI, 0); g.lineTo(w, h); g.fill();
    if (!lit) { g.fillStyle = "rgba(160,190,255,0.12)"; g.beginPath(); g.moveTo(w * 0.15, h * 0.3); g.lineTo(w * 0.4, h * 0.25); g.lineTo(w * 0.2, h * 0.8); g.fill(); }
    g.strokeStyle = "#141018"; g.lineWidth = 7;
    g.beginPath(); g.moveTo(w / 2, 0); g.lineTo(w / 2, h); g.moveTo(0, h * 0.55); g.lineTo(w, h * 0.55); g.stroke();
    if (lit) { g.fillStyle = "rgba(60,30,10,0.55)"; g.fillRect(w * 0.08, h * 0.62, w * 0.36, h * 0.3); }
  });
  const WIN_LIT = windowTex(true), WIN_DARK = windowTex(false);
  const doorTex = canvasTex(128, 224, (g, w, h) => {
    g.fillStyle = "#3a2414"; g.beginPath(); g.moveTo(0, h); g.lineTo(0, w / 2); g.arc(w / 2, w / 2, w / 2, Math.PI, 0); g.lineTo(w, h); g.fill();
    g.strokeStyle = "#1c0f07"; g.lineWidth = 5; for (let k = 1; k < 4; k++) { g.beginPath(); g.moveTo(w * k / 4, w * 0.3); g.lineTo(w * k / 4, h); g.stroke(); }
    g.fillStyle = "#c9a46a"; g.beginPath(); g.arc(w * 0.78, h * 0.6, 6, 0, Math.PI * 2); g.fill();
  });
  const glowTex = canvasTex(128, 128, (g, w) => {
    const gr = g.createRadialGradient(w / 2, w / 2, 0, w / 2, w / 2, w / 2);
    gr.addColorStop(0, "rgba(255,255,255,1)"); gr.addColorStop(0.2, "rgba(255,255,255,0.5)"); gr.addColorStop(1, "rgba(255,255,255,0)");
    g.fillStyle = gr; g.fillRect(0, 0, w, w);
  });
  const glow = (color, size, opacity = 1) => {
    const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color, transparent: true, opacity, depthWrite: false, blending: THREE.AdditiveBlending, fog: false }));
    s.scale.set(size, size, 1); return s;
  };

  // ---------- The street ----------
  const STREET = 3.4, LEN = 48;
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(STREET * 2 + 1, LEN + 14),
    new THREE.MeshStandardMaterial({ map: cobble, bumpMap: cobbleBump, bumpScale: 0.01, roughness: 0.7, metalness: 0, color: 0x8e8c96 }));
  ground.rotation.x = -Math.PI / 2; ground.position.z = -LEN / 2 + 4; scene.add(ground);

  const winGeo = new THREE.PlaneGeometry(0.8, 1.2), doorGeo = new THREE.PlaneGeometry(1.0, 1.75);
  const stoneMat = new THREE.MeshStandardMaterial({ color: 0x5c6378, roughness: 0.8 });
  const darkStone = new THREE.MeshStandardMaterial({ color: 0x3a3f52, roughness: 0.9 });
  const roofMat = new THREE.MeshStandardMaterial({ color: 0x2a2f44, roughness: 0.7 });
  const winLitMat = new THREE.MeshBasicMaterial({ map: WIN_LIT, transparent: true, toneMapped: false });
  const winDarkMat = new THREE.MeshStandardMaterial({ map: WIN_DARK, transparent: true, roughness: 0.15, metalness: 0.6 });
  const doorMat = new THREE.MeshStandardMaterial({ map: doorTex, transparent: true, roughness: 0.8 });
  const box = (w, h, d, mat, x, y, z, parent) => { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat); m.position.set(x, y, z); parent.add(m); return m; };
  const archGeo = new THREE.TorusGeometry(0.46, 0.06, 6, 18, Math.PI);
  function house(side, z0, w, h) {
    const g = new THREE.Group(), d = 4, k = Math.floor(Math.random() * TINTS.length), lights = [];
    const tex = brickCols[k].clone(), bmp = brickBump[k].clone(); tex.needsUpdate = bmp.needsUpdate = true;
    tex.repeat.set(w / 2.4, h / 2.4); bmp.repeat.copy(tex.repeat);
    const wall = new THREE.Mesh(new THREE.BoxGeometry(d, h, w), new THREE.MeshStandardMaterial({ map: tex, bumpMap: bmp, bumpScale: 0.04, roughness: 0.85 }));
    wall.position.set(0, h / 2, 0); g.add(wall);
    const fx = -d / 2 - 0.01;  // the street face, in the house's own frame
    box(0.3, 0.55, w + 0.1, darkStone, fx + 0.1, 0.27, 0, g);                 // plinth
    box(0.45, 0.28, w + 0.35, stoneMat, fx + 0.1, h + 0.1, 0, g);            // cornice
    for (const s of [-1, 1]) box(0.25, h, 0.3, stoneMat, fx + 0.08, h / 2, s * (w / 2 - 0.12), g);  // corner pilasters
    // Roof: a pitched gable or a parapet with crenels.
    if (Math.random() < 0.55) {
      const roof = new THREE.Mesh(new THREE.CylinderGeometry(0.01, w * 0.62, 1.6, 4, 1, false, Math.PI / 4), roofMat);
      roof.scale.set(d / (w * 0.88), 1, 1); roof.position.set(0, h + 0.95, 0); g.add(roof);
    } else for (let q = -w / 2 + 0.3; q < w / 2; q += 0.7) box(0.4, 0.35, 0.35, stoneMat, fx + 0.1, h + 0.4, q, g);
    // Floors of windows: arched frames, sills, a ledge between floors, a few still lit.
    for (let fy = 2.3; fy < h - 1; fy += 2.1) {
      box(0.18, 0.1, w, stoneMat, fx + 0.05, fy - 0.95, 0, g);
      for (let fz = -w / 2 + 0.95; fz <= w / 2 - 0.8; fz += 1.45) {
        const lit = Math.random() < 0.22;
        const pane = new THREE.Mesh(winGeo, lit ? winLitMat : winDarkMat);
        pane.position.set(fx - 0.005, fy, fz); pane.rotation.y = -Math.PI / 2; g.add(pane);
        const frame = new THREE.Mesh(archGeo, stoneMat); frame.position.set(fx - 0.02, fy + 0.13, fz); frame.rotation.y = -Math.PI / 2; g.add(frame);
        box(0.16, 0.08, 1.0, stoneMat, fx - 0.04, fy - 0.62, fz, g);
        if (lit) lights.push([fx - 0.4, fy, fz]);
        if (Math.random() < 0.12) { box(0.7, 0.08, 1.2, darkStone, fx - 0.35, fy - 0.66, fz, g); for (let r = -0.5; r <= 0.5; r += 0.25) box(0.03, 0.4, 0.03, darkStone, fx - 0.68, fy - 0.45, fz + r, g); }
      }
    }
    if (Math.random() < 0.7) {
      const dz = R(-w / 4, w / 4), door = new THREE.Mesh(doorGeo, doorMat);
      door.position.set(fx - 0.005, 0.88, dz); door.rotation.y = -Math.PI / 2; g.add(door);
      box(0.5, 0.12, 1.3, darkStone, fx - 0.25, 0.06, dz, g); box(0.25, 0.12, 1.3, darkStone, fx - 0.12, 0.18, dz, g);
    }
    // The street face points at the street: right-hand houses as built, left-hand ones turned round.
    g.position.set(side * (STREET + d / 2), 0, z0 - w / 2);
    if (side < 0) g.rotation.y = Math.PI;
    scene.add(g);
    g.updateMatrixWorld(true);
    for (const l of lights) { const s = glow(0xffa040, 1.3, 0.22); s.material.fog = true; s.position.copy(new THREE.Vector3(...l).applyMatrix4(g.matrixWorld)); scene.add(s); }
  }
  for (const side of [-1, 1]) {
    let z = 5;
    while (z > -LEN - 4) { const w = R(3.2, 5.2); house(side, z, w, R(5, 10.5)); z -= w + 0.05; }
  }
  // Stone arches over the street.
  for (let z = -7; z > -LEN; z -= 12) {
    const a = new THREE.Mesh(new THREE.TorusGeometry(STREET, 0.32, 10, 32, Math.PI), stoneMat); a.position.set(0, 4.6, z); scene.add(a);
    for (const s of [-1, 1]) box(0.6, 4.6, 0.7, stoneMat, s * STREET, 2.3, z, scene);
    box(0.5, 0.7, 0.75, stoneMat, 0, 4.6 + STREET + 0.1, z, scene);
  }
  // Far city: layers of tower silhouettes with a few lit windows, fading into the fog.
  const skyline = color => canvasTex(1024, 256, (g, w, hh) => {
    let x = 0;
    while (x < w) {
      const bw = R(30, 80), bh = R(hh * 0.3, hh * 0.95);
      g.fillStyle = color; g.fillRect(x, hh - bh, bw, bh);
      if (Math.random() < 0.4) { g.beginPath(); g.moveTo(x, hh - bh); g.lineTo(x + bw / 2, hh - bh - R(10, 40)); g.lineTo(x + bw, hh - bh); g.fill(); }
      for (let k = 0; k < 6; k++) if (Math.random() < 0.3) { g.fillStyle = "rgba(255,190,110,0.85)"; g.fillRect(x + R(4, bw - 8), hh - bh + R(10, bh - 10), 4, 6); g.fillStyle = color; }
      x += bw + R(2, 14);
    }
  }, 1, 1);
  for (const [z, col, op] of [[-LEN - 10, "#161c34", 1], [-LEN - 22, "#10142a", 0.8]]) {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(60, 16), new THREE.MeshBasicMaterial({ map: skyline(col), transparent: true, opacity: op }));
    m.position.set(0, 7, z); scene.add(m);
  }
  // The cave roof far above, with hanging rock lost in the haze.
  const ceilMat = new THREE.MeshStandardMaterial({ color: 0x0c1020, roughness: 1 });
  for (let k = 0; k < 40; k++) { const c = new THREE.Mesh(new THREE.ConeGeometry(R(0.4, 1.4), R(2, 6), 6), ceilMat); c.rotation.x = Math.PI; c.position.set(R(-14, 14), R(15, 18), R(-LEN - 10, 8)); scene.add(c); }

  // The portal at the far end.
  const portal = new THREE.Group();
  const ring = new THREE.Mesh(new THREE.TorusGeometry(1.25, 0.1, 16, 64), new THREE.MeshBasicMaterial({ color: 0xc9a8ff, toneMapped: false }));
  portal.add(ring);
  const inner = new THREE.Mesh(new THREE.CircleGeometry(1.15, 48), new THREE.MeshBasicMaterial({ color: 0x5a3ab0, transparent: true, opacity: 0.35, toneMapped: false, depthWrite: false }));
  portal.add(inner);
  const pGlow = glow(0xb48cff, 6, 0.5); portal.add(pGlow);
  const portalLight = new THREE.PointLight(0xb48cff, 0.8, 9, 1.5); portal.add(portalLight);
  portal.position.set(0, 1.7, -LEN + 2); scene.add(portal);

  // ---------- Street lamps to relight ----------
  const lamps = [];
  const iron = new THREE.MeshStandardMaterial({ color: 0x15181f, roughness: 0.45, metalness: 0.7 });
  const coneGeo = new THREE.ConeGeometry(1.6, 3.2, 24, 1, true);
  for (let k = 0; k < 5; k++) {
    const z = -4 - k * 8.6, side = k % 2 ? 1 : -1, x = side * (STREET - 0.55);
    const g = new THREE.Group();
    const base = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.22, 0.35, 10), iron); base.position.y = 0.17; g.add(base);
    const post = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.08, 3.1, 10), iron); post.position.y = 1.85; g.add(post);
    const arm = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.05, 0.05), iron); arm.position.set(-side * 0.3, 3.38, 0); g.add(arm);
    const lantern = new THREE.Group(); lantern.position.set(-side * 0.56, 3.1, 0); g.add(lantern);
    const glassMat = new THREE.MeshStandardMaterial({ color: 0x3a4456, emissive: 0x000000, roughness: 0.2, metalness: 0.2 });
    const glass = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.12, 0.42, 6), glassMat); lantern.add(glass);
    const cap = new THREE.Mesh(new THREE.ConeGeometry(0.22, 0.2, 6), iron); cap.position.y = 0.3; lantern.add(cap);
    const halo = glow(0xffc46a, 3.4, 0); lantern.add(halo);
    const beam = new THREE.Mesh(coneGeo, new THREE.MeshBasicMaterial({ color: 0xffb860, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide, fog: false }));
    beam.position.y = -1.55; lantern.add(beam);
    const pool = new THREE.Mesh(new THREE.CircleGeometry(1.8, 32), new THREE.MeshBasicMaterial({ map: glowTex, color: 0xffa850, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false }));
    pool.rotation.x = -Math.PI / 2; pool.position.set(-side * 0.56, 0.02, 0); g.add(pool);
    const light = new THREE.PointLight(0xff9238, 0, 10, 1.5); lantern.add(light);
    g.position.set(x, 0, z); scene.add(g);
    lamps.push({ glassMat, halo, beam, pool, light, on: 0, x: x - side * 0.56, z });
  }

  // ---------- Lumi and the Hushlings: the game's own drawings, standing in the 3D street ----------
  const drawn = (w, h, draw) => { const t = canvasTex(w, h, draw); t.wrapS = t.wrapT = THREE.ClampToEdgeWrapping; return t; };
  const lumiTex = drawn(256, 256, (g, w) => {
    const c = w / 2;
    const gr = g.createRadialGradient(c - 18, c - 14, 6, c, c + 8, 70);
    gr.addColorStop(0, "#ffffff"); gr.addColorStop(0.55, "#d6f6ff"); gr.addColorStop(1, "#7fd8f5");
    g.fillStyle = gr; g.beginPath(); g.arc(c, c + 18, 62, 0, Math.PI * 2); g.fill();
    g.strokeStyle = "#bfefff"; g.lineWidth = 6; g.lineCap = "round"; g.beginPath(); g.moveTo(c, c - 40); g.quadraticCurveTo(c + 6, c - 70, c + 2, c - 92); g.stroke();
    g.fillStyle = "#ffffff"; g.beginPath(); g.arc(c + 2, c - 96, 11, 0, Math.PI * 2); g.fill();
    g.fillStyle = "#123049"; for (const s of [-1, 1]) { g.beginPath(); g.ellipse(c + s * 22, c + 12, 7, 10, 0, 0, Math.PI * 2); g.fill(); }
    g.fillStyle = "rgba(255,150,190,0.45)"; for (const s of [-1, 1]) { g.beginPath(); g.ellipse(c + s * 38, c + 30, 10, 6, 0, 0, Math.PI * 2); g.fill(); }
    g.strokeStyle = "#123049"; g.lineWidth = 5; g.beginPath(); g.arc(c, c + 30, 13, 0.2 * Math.PI, 0.8 * Math.PI); g.stroke();
  });
  const hushTex = hunting => drawn(256, 320, (g, w, h) => {
    const c = w / 2, top = 70;
    for (let k = 0; k < 4; k++) { g.fillStyle = `rgba(14,8,26,${0.55 - k * 0.1})`; g.beginPath(); g.moveTo(c - 70 + k * 12, 190); g.quadraticCurveTo(c - 30 + k * 18, 270, c - 10 + k * 22, 312); g.quadraticCurveTo(c + 10 + k * 8, 260, c + 70 - k * 12, 190); g.fill(); }
    const body = g.createRadialGradient(c - 20, top + 40, 10, c, top + 80, 110);
    body.addColorStop(0, hunting ? "#3c1c52" : "#2a1840"); body.addColorStop(0.7, "#140a22"); body.addColorStop(1, "#06030c");
    g.fillStyle = body;
    g.beginPath(); g.moveTo(c - 82, 200); g.bezierCurveTo(c - 92, 120, c - 70, top + 20, c - 50, top + 14); g.lineTo(c - 72, top - 40); g.lineTo(c - 22, top + 2);
    g.quadraticCurveTo(c, top - 4, c + 22, top + 2); g.lineTo(c + 72, top - 40); g.lineTo(c + 50, top + 14); g.bezierCurveTo(c + 70, top + 20, c + 92, 120, c + 82, 200); g.quadraticCurveTo(c, 236, c - 82, 200); g.fill();
    g.strokeStyle = "rgba(170,120,255,0.45)"; g.lineWidth = 4; g.stroke();
    const eye = hunting ? "#ff9ad0" : "#c9a8ff";
    for (const s of [-1, 1]) {
      g.save(); g.translate(c + s * 30, top + 70); g.rotate(hunting ? s * 0.35 : 0);
      g.shadowColor = eye; g.shadowBlur = 24; g.fillStyle = eye; g.beginPath(); g.ellipse(0, 0, 18, hunting ? 8 : 13, 0, 0, Math.PI * 2); g.fill();
      g.shadowBlur = 0; g.fillStyle = "#fff"; g.beginPath(); g.ellipse(2, 0, 5, hunting ? 4 : 7, 0, 0, Math.PI * 2); g.fill(); g.restore();
    }
    if (hunting) { g.strokeStyle = "#ff9ad0"; g.lineWidth = 4; g.beginPath(); for (let q = 0; q <= 6; q++) g.lineTo(c - 34 + q * 11.3, top + 110 + (q % 2) * 10); g.stroke(); }
  });
  const HUSH_CALM = hushTex(false), HUSH_HUNT = hushTex(true);
  const sprite = (map, w, h) => { const s = new THREE.Sprite(new THREE.SpriteMaterial({ map, transparent: true, fog: false, toneMapped: false })); s.scale.set(w, h, 1); return s; };

  const lumi = new THREE.Group();
  // The glow sits behind Lumi so its face stays clear.
  const lumiBody = sprite(lumiTex, 1.05, 1.05); lumiBody.material.color.setHex(0xc4e2ee); lumiBody.renderOrder = 3; lumi.add(lumiBody);
  const lumiGlow = glow(0x7ee8ff, 2.2, 0.4); lumiGlow.renderOrder = 1; lumiGlow.position.z = -0.2; lumi.add(lumiGlow);
  const lumiLight = new THREE.PointLight(0x8feaff, 2, 9, 1.6); lumi.add(lumiLight);
  scene.add(lumi);
  const trail = [];
  for (let k = 0; k < 14; k++) { const t = glow(0x9fefff, 0.3 - k * 0.016, 0.3 - k * 0.02); scene.add(t); trail.push(t); }
  const songLight = new THREE.PointLight(0xa8f0ff, 0, 1, 1.1); scene.add(songLight);
  const ringMesh = new THREE.Mesh(new THREE.RingGeometry(0.97, 1, 128), new THREE.MeshBasicMaterial({ color: 0xa8f0ff, transparent: true, opacity: 0, side: THREE.DoubleSide, blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false }));
  ringMesh.rotation.x = -Math.PI / 2; scene.add(ringMesh);

  const hush = [];
  for (const [x, z] of [[1.9, -12], [-2.1, -20.5], [1.6, -29], [-1.5, -37]]) {
    const g = new THREE.Group();
    const s = sprite(HUSH_CALM, 1.5, 1.88); g.add(s);
    const eg = glow(0xb48cff, 1.6, 0.35); eg.position.y = 0.05; g.add(eg);
    g.position.set(x, 1.1, z); scene.add(g);
    hush.push({ g, s, eg, hx: x, hz: z, hunt: 0, ph: Math.random() * 6, calm: 0 });
  }

  // Dust and embers drifting in the light.
  const dustGeo = new THREE.BufferGeometry(), N = 700, pos = new Float32Array(N * 3);
  for (let k = 0; k < N; k++) { pos[k * 3] = R(-STREET, STREET); pos[k * 3 + 1] = R(0.2, 8); pos[k * 3 + 2] = R(-LEN - 4, 7); }
  dustGeo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
  const dust = new THREE.Points(dustGeo, new THREE.PointsMaterial({ map: glowTex, color: 0xaecbff, size: 0.09, transparent: true, opacity: 0.8, depthWrite: false, blending: THREE.AdditiveBlending }));
  scene.add(dust);

  // ---------- Bloom ----------
  let composer = null, bloom = null;
  if (THREE.EffectComposer && THREE.UnrealBloomPass) {
    composer = new THREE.EffectComposer(renderer);
    composer.addPass(new THREE.RenderPass(scene, camera));
    bloom = new THREE.UnrealBloomPass(new THREE.Vector2(256, 256), 0.7, 0.4, 0.86);
    composer.addPass(bloom);
  }

  // ---------- Sound ----------
  let AC = null;
  const note = (f, at = 0, dur = 1.4, vol = 0.12, type = "triangle") => {
    if (!AC) return;
    const t = AC.currentTime + at, o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.value = f; g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.02); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g).connect(AC.destination); o.start(t); o.stop(t + dur + 0.05);
  };
  const wakeAudio = () => { if (!AC) try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} };

  // ---------- Play ----------
  const state = { x: 0, z: 3, vx: 0, vz: 0, songT: 9, hurt: 0, done: false, lit: 0 };
  const hint = (t, sec = 3) => { const h = $("hint"); h.textContent = t; h.style.opacity = 1; clearTimeout(hint.t); if (sec) hint.t = setTimeout(() => (h.style.opacity = 0), sec * 1000); };
  function sing() {
    wakeAudio();
    if (state.songT < 0.45 || state.done) return;
    state.songT = 0;
    [0, 4, 7].forEach((d, i) => note(523.25 * Math.pow(2, d / 12), i * 0.05));
    for (const lp of lamps) if (!lp.on && Math.hypot(lp.x - state.x, lp.z - state.z) < 3.6) {
      lp.on = 0.001; state.lit++;
      note(659.25, 0.15, 1.8, 0.1); note(987.77, 0.3, 1.8, 0.07);
      $("lamps").textContent = `${state.lit}/${lamps.length}`;
      hint(state.lit === lamps.length ? "Every lamp burns again. The portal is open!" : `A lamp burns again. ${lamps.length - state.lit} still dark`, 3);
    }
    for (const h of hush) if (h.calm <= 0 && Math.hypot(h.g.position.x - state.x, h.g.position.z - state.z) < 7) { if (h.hunt <= 0) note(110, 0, 1, 0.08, "sawtooth"); h.hunt = 3.5; }
  }
  let drag = null;
  canvas.addEventListener("pointerdown", e => { wakeAudio(); drag = { id: e.pointerId, x0: e.clientX, y0: e.clientY, x: e.clientX, y: e.clientY, t: performance.now(), moved: false }; try { canvas.setPointerCapture(e.pointerId); } catch (err) {} });
  canvas.addEventListener("pointermove", e => { if (!drag || drag.id !== e.pointerId) return; drag.x = e.clientX; drag.y = e.clientY; if (Math.hypot(drag.x - drag.x0, drag.y - drag.y0) > 10) drag.moved = true; });
  const end = e => { if (!drag || drag.id !== e.pointerId) return; if (!drag.moved && performance.now() - drag.t < 300) sing(); drag = null; };
  canvas.addEventListener("pointerup", end); canvas.addEventListener("pointercancel", end);
  $("sing").addEventListener("pointerdown", e => { e.stopPropagation(); sing(); });
  const keys = {};
  addEventListener("keydown", e => { keys[e.key.toLowerCase()] = true; if (e.key === " ") { e.preventDefault(); sing(); } });
  addEventListener("keyup", e => { keys[e.key.toLowerCase()] = false; });
  $("again").addEventListener("click", () => location.reload());

  function resize() {
    const w = innerWidth, h = innerHeight;
    renderer.setSize(w, h, false); camera.aspect = w / h; camera.fov = w < h ? 60 : 50; camera.updateProjectionMatrix();
    if (composer) { if (composer.setPixelRatio) composer.setPixelRatio(DPR); composer.setSize(w, h); }
  }
  addEventListener("resize", resize); resize();

  let last = performance.now(), clock = 0;
  const camPos = new THREE.Vector3(0, 4, 9), look = new THREE.Vector3(0, 1.3, 0);
  function frame(now) {
    const dt = Math.min(1 / 30, (now - last) / 1000); last = now; clock += dt;
    let ix = 0, iz = 0;
    if (drag && drag.moved) { const dx = drag.x - drag.x0, dy = drag.y - drag.y0, d = Math.hypot(dx, dy) || 1, k = Math.min(1, d / 50); ix = dx / d * k; iz = dy / d * k; }
    if (keys.arrowleft || keys.a) ix -= 1; if (keys.arrowright || keys.d) ix += 1; if (keys.arrowup || keys.w) iz -= 1; if (keys.arrowdown || keys.s) iz += 1;
    const SPEED = 4.2;
    state.vx += (ix * SPEED - state.vx) * Math.min(1, dt * 8); state.vz += (iz * SPEED - state.vz) * Math.min(1, dt * 8);
    if (!state.done) { state.x += state.vx * dt; state.z += state.vz * dt; }
    state.x = Math.max(-STREET + 0.5, Math.min(STREET - 0.5, state.x)); state.z = Math.max(-LEN + 1.5, Math.min(6, state.z));
    const bob = Math.sin(clock * 2.2) * 0.1;
    lumi.position.set(state.x, 1.15 + bob, state.z);
    lumiBody.material.rotation = -state.vx * 0.04;
    for (let k = trail.length - 1; k > 0; k--) trail[k].position.lerp(trail[k - 1].position, 0.5);
    trail[0].position.copy(lumi.position);
    // Camera: behind, a little above, easing after Lumi: the 2.5D view.
    camPos.lerp(new THREE.Vector3(state.x * 0.55, 3.9, state.z + 6.6), Math.min(1, dt * 3));
    camera.position.copy(camPos);
    look.lerp(new THREE.Vector3(state.x * 0.75, 1.3, state.z - 3), Math.min(1, dt * 4));
    camera.lookAt(look);

    state.songT += dt;
    const sp = Math.min(1, state.songT / 1.4);
    songLight.position.set(state.x, 1.3, state.z);
    songLight.intensity = state.songT < 1.4 ? 3.2 * (1 - sp) : 0; songLight.distance = 2 + sp * 18;
    ringMesh.position.set(state.x, 0.04, state.z); ringMesh.scale.setScalar(0.4 + sp * 13); ringMesh.material.opacity = state.songT < 1.4 ? 0.9 * (1 - sp) : 0;
    lumiGlow.material.opacity = 0.4 + (state.songT < 0.4 ? 0.3 : 0); lumiLight.intensity = 2 + (state.songT < 0.4 ? 1.2 : 0);

    for (const lp of lamps) if (lp.on) {
      lp.on = Math.min(1, lp.on + dt * 1.4);
      const fl = lp.on * (0.94 + Math.sin(clock * 9 + lp.z) * 0.04 + Math.sin(clock * 23 + lp.x) * 0.02);
      lp.light.intensity = 3 * fl; lp.halo.material.opacity = 0.9 * fl; lp.beam.material.opacity = 0.07 * fl; lp.pool.material.opacity = 0.55 * fl;
      lp.glassMat.emissive.setHex(0xffc070); lp.glassMat.emissiveIntensity = 2.2 * fl;
    }
    const open = state.lit === lamps.length;
    ring.rotation.z += dt * (open ? 1.6 : 0.3); inner.material.opacity = open ? 0.6 + Math.sin(clock * 3) * 0.1 : 0.25;
    portalLight.intensity = open ? 2.4 : 0.6; pGlow.material.opacity = open ? 0.9 : 0.35;
    if (open && !state.done && Math.hypot(state.x - portal.position.x, state.z - portal.position.z) < 1.5) {
      state.done = true; [0, 4, 7, 12].forEach((d, i) => note(523.25 * Math.pow(2, d / 12), i * 0.12, 2)); $("done").hidden = false;
    }

    for (const h of hush) {
      h.ph += dt; h.calm = Math.max(0, h.calm - dt); h.hunt = Math.max(0, h.hunt - dt);
      const p = h.g.position, d = Math.hypot(p.x - state.x, p.z - state.z);
      if (h.calm <= 0 && d < 2.2) h.hunt = Math.max(h.hunt, 1.5);
      let tx = h.hx + Math.sin(h.ph * 0.7) * 0.6, tz = h.hz + Math.cos(h.ph * 0.5) * 0.6, spd = 0.6;
      if (h.hunt > 0 && !state.done) { tx = state.x; tz = state.z; spd = 2.2; }
      for (const lp of lamps) if (lp.on > 0.5 && Math.hypot(p.x - lp.x, p.z - lp.z) < 3.4) { tx = p.x + (p.x - lp.x); tz = p.z + (p.z - lp.z); spd = 2.6; h.hunt = 0; }
      const dx = tx - p.x, dz = tz - p.z, dd = Math.hypot(dx, dz);
      if (dd > 0.01) { const m = Math.min(dd, spd * dt) / dd; p.x += dx * m; p.z += dz * m; }
      p.y = 1.1 + Math.sin(h.ph * 1.6) * 0.14;
      const hunting = h.hunt > 0;
      if (h.s.material.map !== (hunting ? HUSH_HUNT : HUSH_CALM)) { h.s.material.map = hunting ? HUSH_HUNT : HUSH_CALM; h.s.material.needsUpdate = true; }
      h.s.material.rotation = Math.sin(h.ph * 1.3) * 0.05;
      h.eg.material.color.setHex(hunting ? 0xff7ac0 : 0x9a6cff); h.eg.material.opacity = hunting ? 0.7 : 0.3;
      if (d < 0.8 && state.hurt <= 0 && !state.done) {
        state.hurt = 1.5; h.calm = 5; h.hunt = 0; p.x = h.hx; p.z = h.hz;
        state.vx = (state.x - p.x) * 2; state.vz = (state.z - p.z) * 2;
        note(220, 0, 0.4, 0.1, "square"); $("flash").style.opacity = 1; setTimeout(() => ($("flash").style.opacity = 0), 220);
        hint("A Hushling caught you! Sing near a lamp: they hate the light", 3);
      }
    }
    state.hurt = Math.max(0, state.hurt - dt);
    const pa = dust.geometry.attributes.position.array;
    for (let k = 0; k < N; k++) { pa[k * 3 + 1] += Math.sin(clock + k) * 0.002; if (pa[k * 3 + 1] > 8) pa[k * 3 + 1] = 0.2; }
    dust.geometry.attributes.position.needsUpdate = true;
    if (composer) composer.render(); else renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  window.__echo3d = { state, lamps, sing };  // for automated checks
  hint("Drag anywhere to swim. Sing near the dark street lamps to light them again.", 6);
  requestAnimationFrame(frame);
})();
</script>
