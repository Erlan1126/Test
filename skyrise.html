<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Skyrise</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Lilita+One&family=Figtree:wght@500;600;700;800&display=swap">
<style>
  :root {
    color-scheme: dark;
    --ink: #0d1230;
    --panel: rgba(12, 16, 44, 0.62);
    --line: rgba(255, 255, 255, 0.16);
    --text: #ffffff;
    --muted: rgba(255, 255, 255, 0.74);
    --gold: #ffd23f;
    --gold-deep: #f5a524;
    --gold-ink: #3a2700;
    --mint: #8ce99a;
    --display: "Bungee", Impact, "Arial Black", sans-serif;
    --num: "Lilita One", "Arial Black", sans-serif;
    --ui: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    background: var(--ink);
    color: var(--text);
    font-family: var(--ui);
  }
  canvas { display: block; width: 100%; height: 100%; }
  button { font-family: var(--ui); cursor: pointer; color: inherit; }
  button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  [hidden] { display: none !important; }

  /* ---------- In-game HUD ---------- */
  #hud {
    position: fixed;
    top: calc(10px + env(safe-area-inset-top, 0px));
    left: 0;
    right: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    pointer-events: none;
  }
  #people {
    font: 400 clamp(48px, 14vw, 72px)/1 var(--num);
    letter-spacing: 0.01em;
    text-shadow: 0 3px 0 rgba(0, 0, 0, 0.22), 0 8px 24px rgba(0, 0, 0, 0.3);
  }
  #people.bump { animation: bump 0.25s ease-out; }
  @keyframes bump { 40% { transform: scale(1.12); } }
  .people-label {
    margin-top: -6px;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    text-shadow: 0 1px 6px rgba(0, 0, 0, 0.35);
  }
  .alt {
    width: min(300px, calc(100vw - 120px));
    padding: 8px 12px 10px;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: var(--panel);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
  }
  .alt-row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font-size: 13px; font-weight: 700; }
  .alt-row b { font: 400 17px var(--num); letter-spacing: 0.02em; }
  .alt-row span { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar { height: 6px; margin-top: 7px; border-radius: 3px; background: rgba(255, 255, 255, 0.16); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; border-radius: 3px; background: linear-gradient(90deg, var(--mint), var(--gold)); transition: width 0.35s ease-out; }
  #wind {
    padding: 4px 10px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.18);
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  #banner {
    position: fixed;
    left: 50%;
    top: calc(176px + env(safe-area-inset-top, 0px));
    max-width: calc(100vw - 32px);
    padding: 10px 20px 12px;
    border-radius: 16px;
    background: linear-gradient(180deg, var(--gold), var(--gold-deep));
    color: var(--gold-ink);
    text-align: center;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    transform: translateX(-50%);
    pointer-events: none;
  }
  #banner.show { animation: banner 2.6s ease-in-out forwards; }
  @keyframes banner {
    0% { opacity: 0; transform: translate(-50%, -16px) scale(0.9); }
    10%, 82% { opacity: 1; transform: translate(-50%, 0) scale(1); }
    100% { opacity: 0; transform: translate(-50%, -8px) scale(0.98); }
  }
  #banner small { display: block; font-size: 11px; font-weight: 800; letter-spacing: 0.16em; text-transform: uppercase; opacity: 0.75; }
  #banner strong { display: block; font: 400 clamp(16px, 5vw, 22px)/1.2 var(--display); }

  /* ---------- Shared pieces ---------- */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    min-height: 54px;
    padding: 0 26px;
    border: 0;
    border-radius: 16px;
    font-size: 17px;
    font-weight: 800;
    white-space: nowrap;
    transition: transform 0.1s;
  }
  .btn:active { transform: translateY(2px); }
  .btn-primary {
    background: linear-gradient(180deg, #ffe066, var(--gold-deep));
    color: var(--gold-ink);
    box-shadow: 0 4px 0 #b9741a, 0 10px 24px rgba(0, 0, 0, 0.3);
  }
  .btn-primary:active { box-shadow: 0 2px 0 #b9741a, 0 6px 16px rgba(0, 0, 0, 0.3); }
  .btn-secondary { background: rgba(255, 255, 255, 0.14); border: 1px solid var(--line); }
  .picker {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 5px;
    border: 1px solid var(--line);
    border-radius: 16px;
    background: var(--panel);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
  }
  .picker button {
    width: 40px;
    height: 40px;
    flex: none;
    border: 0;
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.12);
    font-size: 22px;
    line-height: 1;
  }
  .picker-info { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; gap: 10px; }
  .swatch { display: flex; flex: none; }
  .swatch i { width: 14px; height: 14px; border-radius: 50%; border: 2px solid rgba(12, 16, 44, 0.9); margin-left: -5px; }
  .swatch i:first-child { margin-left: 0; }
  .picker-text { min-width: 0; text-align: left; }
  .picker-name { font-size: 15px; font-weight: 800; white-space: nowrap; }
  .picker-sub { font-size: 11px; font-weight: 600; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .locked .swatch { filter: grayscale(1) brightness(0.6); }

  /* ---------- Title screen ---------- */
  #menu {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    padding: calc(28px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
    pointer-events: none;
    text-align: center;
  }
  #menu > * { pointer-events: auto; }
  .logo {
    margin: 0;
    font: 400 clamp(54px, 17vw, 104px)/0.95 var(--display);
    letter-spacing: 0.01em;
    color: #fff;
    text-shadow: 0 2px 0 #c9d6ff, 0 4px 0 #8fa3e8, 0 6px 0 #5a6fc4, 0 14px 28px rgba(10, 16, 60, 0.45);
  }
  .tagline { margin: 12px 0 0; font-size: clamp(15px, 4.4vw, 19px); font-weight: 800; text-shadow: 0 1px 8px rgba(0, 0, 0, 0.3); }
  .rules { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 16px; }
  .rules span {
    padding: 7px 12px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--panel);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    font-size: 13px;
    font-weight: 700;
  }
  .rules b { color: var(--gold); }
  .menu-bottom { width: min(360px, 100%); display: flex; flex-direction: column; gap: 12px; }
  .best-chip { align-self: center; padding: 6px 14px; border-radius: 999px; background: var(--panel); font-size: 13px; font-weight: 700; }
  .best-chip b { color: var(--gold); }
  .menu-bottom .btn { width: 100%; font-size: 19px; }

  /* ---------- Game over card ---------- */
  #over {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    display: flex;
    justify-content: center;
    padding: 0 max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  }
  .card {
    width: min(440px, 100%);
    padding: 18px 18px 16px;
    border: 1px solid var(--line);
    border-radius: 24px;
    background: rgba(12, 16, 44, 0.72);
    -webkit-backdrop-filter: blur(16px);
    backdrop-filter: blur(16px);
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
    animation: rise 0.45s cubic-bezier(0.2, 0.9, 0.3, 1.2);
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(40px); } }
  /* Wide screens: card on the right, tower on the left */
  @media (min-aspect-ratio: 5/4) and (min-width: 760px) {
    #over { top: 0; left: auto; width: 50%; align-items: center; padding-top: 16px; }
  }
  .card-head { text-align: center; }
  .eyebrow { font-size: 11px; font-weight: 800; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); }
  .eyebrow.best { color: var(--gold); }
  .big { font: 400 clamp(46px, 14vw, 64px)/1.05 var(--num); }
  .sub { font-size: 15px; font-weight: 700; }
  .landmark { margin-top: 2px; font-size: 13px; font-weight: 700; color: var(--gold); }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .stat { padding: 8px 6px; border-radius: 12px; background: rgba(255, 255, 255, 0.08); text-align: center; }
  .stat b { display: block; font: 400 24px var(--num); font-variant-numeric: tabular-nums; }
  .stat span { font-size: 11px; font-weight: 700; color: var(--muted); }
  .unlock {
    padding: 8px 12px;
    border-radius: 12px;
    background: rgba(140, 233, 154, 0.16);
    color: var(--mint);
    font-size: 14px;
    font-weight: 800;
    text-align: center;
  }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .actions .btn { padding: 0 12px; }

  #mute {
    position: fixed;
    top: calc(12px + env(safe-area-inset-top, 0px));
    right: calc(12px + env(safe-area-inset-right, 0px));
    width: 44px;
    height: 44px;
    display: grid;
    place-items: center;
    padding: 0;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: var(--panel);
  }
  #mute svg { width: 22px; height: 22px; }
  #toast {
    position: fixed;
    left: 50%;
    top: 42%;
    transform: translateX(-50%);
    max-width: calc(100vw - 48px);
    padding: 12px 16px;
    border-radius: 14px;
    background: rgba(12, 16, 44, 0.88);
    font-size: 14px;
    font-weight: 700;
    text-align: center;
  }
  @media (prefers-reduced-motion: reduce) {
    #banner.show, .card, #people.bump { animation-duration: 0.01s; }
  }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud" hidden>
  <div id="people">0</div>
  <div class="people-label">people live here</div>
  <div class="alt">
    <div class="alt-row"><b id="height">0 m</b><span id="next"></span></div>
    <div class="bar"><i id="bar"></i></div>
  </div>
  <div id="wind" hidden>Wind gusts</div>
</div>
<div id="banner" hidden><small id="banner-eyebrow"></small><strong id="banner-title"></strong></div>

<div id="menu">
  <div>
    <h1 class="logo">SKYRISE</h1>
    <p class="tagline">Build the tallest skyscraper in the world</p>
    <div class="rules">
      <span>Tap to drop a floor</span>
      <span>Wider floors fit more people</span>
      <span><b>Gold</b> penthouses pay 5x</span>
    </div>
  </div>
  <div class="menu-bottom">
    <div class="best-chip" id="menu-best" hidden></div>
    <div class="picker"></div>
    <button class="btn btn-primary" id="play">Start building</button>
  </div>
</div>

<div id="over" hidden>
  <div class="card">
    <div class="card-head">
      <div class="eyebrow" id="over-eyebrow">Tower complete</div>
      <div class="big" id="over-people">0</div>
      <div class="sub" id="over-sub"></div>
      <div class="landmark" id="over-landmark"></div>
    </div>
    <div class="stats">
      <div class="stat"><b id="stat-floors">0</b><span>floors</span></div>
      <div class="stat"><b id="stat-perfect">0</b><span>perfect drops</span></div>
      <div class="stat"><b id="stat-streak">0</b><span>best streak</span></div>
    </div>
    <div class="unlock" id="over-unlock" hidden></div>
    <div class="picker"></div>
    <div class="actions">
      <button class="btn btn-secondary" id="share">Challenge a friend</button>
      <button class="btn btn-primary" id="again">Build again</button>
    </div>
  </div>
</div>

<button id="mute" aria-label="Mute sound"></button>
<div id="toast" hidden></div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const canvas = $("game");
  const ctx = canvas.getContext("2d");
  const ui = {
    hud: $("hud"), people: $("people"), height: $("height"), next: $("next"), bar: $("bar"), wind: $("wind"),
    banner: $("banner"), bannerEyebrow: $("banner-eyebrow"), bannerTitle: $("banner-title"),
    menu: $("menu"), menuBest: $("menu-best"), play: $("play"),
    over: $("over"), overEyebrow: $("over-eyebrow"), overPeople: $("over-people"), overSub: $("over-sub"),
    overLandmark: $("over-landmark"), overUnlock: $("over-unlock"),
    statFloors: $("stat-floors"), statPerfect: $("stat-perfect"), statStreak: $("stat-streak"),
    share: $("share"), again: $("again"), mute: $("mute"), toast: $("toast"),
    pickers: document.querySelectorAll(".picker"),
  };

  // Link included in shared scores. Empty means "use this page's address".
  const SHARE_URL = "";

  // Gameplay is measured in world units, not pixels, so it plays the same on every screen.
  const BLOCK_SIZE = 10;       // starting width and depth of a floor
  const RANGE = 13;            // how far the sliding floor travels from the tower's center
  const PERFECT = 0.35;        // forgiveness for a perfect drop
  const GROW = 0.6;            // how much a floor grows back during a perfect streak
  const METERS_PER_FLOOR = 5;
  const PEOPLE_PER_AREA = 0.2; // a full 10 x 10 floor holds 20 people
  const WIND_START = 25;       // floor where gusts begin
  const ISLAND = 17;           // half-size of the floating island
  const ISO_X = Math.cos(Math.PI / 6), ISO_Y = 0.5;
  const DISPLAY = '"Bungee", Impact, "Arial Black", sans-serif';
  const NUMFONT = '"Lilita One", "Arial Black", sans-serif';
  const UIFONT = '"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif';

  const MILESTONES = [
    { m: 15, name: "a house" },
    { m: 51, name: "Niagara Falls" },
    { m: 93, name: "the Statue of Liberty" },
    { m: 139, name: "the Great Pyramid" },
    { m: 184, name: "the Space Needle" },
    { m: 227, name: "the Golden Gate Bridge" },
    { m: 330, name: "the Eiffel Tower" },
    { m: 443, name: "the Empire State Building" },
    { m: 828, name: "the Burj Khalifa" },
  ];
  const shortName = n => { const t = n.replace(/^(the|a) /, ""); return t[0].toUpperCase() + t.slice(1); };

  // Building styles. Each unlocks once your best tower passes a landmark.
  //  ribbon:  continuous glass bands with mullions (modern office tower)
  //  punched: individual framed windows
  const STYLES = [
    { name: "Glass Tower", unlock: -1, kind: "ribbon",
      floors: ["#3f7fe0", "#2f9fd6", "#4a6ee0", "#25aec4", "#5b8ff0"],
      glass: "#7fc2f0", frame: "#eef6ff", slab: "#dfe9f7", slabH: 0.1, lit: ["#ffe7a1", "#fff3cf"] },
    { name: "Brick Block", unlock: 0, kind: "punched",
      floors: ["#b8543f", "#c4624a", "#ad4b3a", "#bf5c45"],
      glass: "#35507a", frame: "#f4efe6", slab: "#e9dfd0", slabH: 0.12, lit: ["#ffd8a0", "#ffe9b8"] },
    { name: "Candy Tower", unlock: 2, kind: "punched",
      floors: ["#ff9ec7", "#8fe3c0", "#ffc29e", "#b5b0ff", "#9fd8ff"],
      glass: "#ffffff", frame: "#ffffff", slab: "#ffffff", slabH: 0.18, lit: ["#fff1a8", "#ffd6ec"] },
    { name: "Neon Nights", unlock: 6, kind: "ribbon", neon: true,
      floors: ["#241d48", "#2b2256", "#1e1940"],
      glass: "#151231", frame: "#3a3170", slab: "#120f28", slabH: 0.08,
      lit: ["#ff4fd8", "#3bf0ff", "#b6ff3b", "#ffb13b"], alwaysLit: true, swatch: ["#ff4fd8", "#3bf0ff", "#b6ff3b"] },
  ];
  const NEIGHBOR = { kind: "punched", glass: "#7f9cc4", frame: "#ffffff", slab: "#d9d3c7", slabH: 0.1, lit: ["#ffe7a1"] };
  const GOLD = "#ffd23f"; // reserved for penthouse floors

  // Sky colors (top, bottom) by tower height in floors: day, sunset, dusk, night.
  const SKY = [
    { at: 0, top: "#3d9be0", bottom: "#bfe8fb" },
    { at: 22, top: "#4f7fd6", bottom: "#ffe0b0" },
    { at: 42, top: "#5a3f93", bottom: "#ff9468" },
    { at: 62, top: "#22195a", bottom: "#8a3f78" },
    { at: 90, top: "#060a1e", bottom: "#1b1f50" },
  ];

  // ---------- Helpers ----------
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const hexRgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  const mixRgb = (a, b, t) => a.map((v, i) => lerp(v, b[i], t));
  const rgb = (c, f = 1, a = 1) => `rgba(${c.map(v => clamp(Math.round(v * f), 0, 255)).join(",")},${a})`;
  const hash = (a, b, c) => { const v = Math.sin(a * 12.9898 + b * 78.233 + c * 37.719) * 43758.5453; return v - Math.floor(v); };
  const fmt = n => n.toLocaleString("en-US");
  const rand = (a, b) => a + Math.random() * (b - a);

  function load(key) {
    try { return localStorage.getItem(key); } catch { return null; }
  }
  function save(key, value) {
    try { localStorage.setItem(key, String(value)); } catch {}
  }

  // ---------- Sound (synthesized, no files needed) ----------
  const sound = (() => {
    let ac = null;
    let muted = load("skyriseMuted") === "1";
    const SCALE = [0, 2, 4, 7, 9];

    function ensure() {
      if (!ac) {
        try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch { return; }
      }
      if (ac.state === "suspended") ac.resume();
    }
    function tone(freq, dur, type = "sine", vol = 0.2, delay = 0, slideTo = 0) {
      if (muted || !ac) return;
      const t = ac.currentTime + delay;
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type;
      o.frequency.setValueAtTime(freq, t);
      if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g).connect(ac.destination);
      o.start(t);
      o.stop(t + dur + 0.05);
    }
    // Notes climb a pentatonic scale, so a perfect streak plays a rising tune.
    const note = i => 261.63 * Math.pow(2, (SCALE[i % 5] + 12 * Math.floor(i / 5)) / 12);

    return {
      ensure,
      get muted() { return muted; },
      toggle() { muted = !muted; save("skyriseMuted", muted ? "1" : "0"); },
      click() { tone(900, 0.05, "triangle", 0.08); },
      cut() { tone(200, 0.1, "triangle", 0.3, 0, 80); tone(1800, 0.12, "square", 0.02, 0.01, 900); },
      perfect(combo) {
        const f = note(Math.min(combo - 1, 11) + 3);
        tone(f, 0.3, "triangle", 0.22);
        tone(f * 2, 0.2, "sine", 0.06, 0.02);
      },
      golden() { [0, 4, 7, 12, 16].forEach((s, i) => tone(784 * Math.pow(2, s / 12), 0.2, "triangle", 0.12, i * 0.045)); },
      milestone() { [0, 4, 7, 12].forEach((s, i) => tone(523 * Math.pow(2, s / 12), 0.35, "triangle", 0.14, i * 0.09)); },
      unlock() { [0, 7, 12, 16, 19].forEach((s, i) => tone(392 * Math.pow(2, s / 12), 0.4, "triangle", 0.12, 0.4 + i * 0.07)); },
      wind() { tone(140, 1.2, "sawtooth", 0.025, 0, 320); },
      fail() { tone(260, 0.6, "sawtooth", 0.06, 0, 60); tone(130, 0.5, "triangle", 0.2, 0.05, 50); },
    };
  })();

  const ICON_ON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z" fill="currentColor"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
  const ICON_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z" fill="currentColor"/><path d="m16 9 6 6"/><path d="m22 9-6 6"/></svg>';
  function renderMute() {
    ui.mute.innerHTML = sound.muted ? ICON_OFF : ICON_ON;
    ui.mute.setAttribute("aria-label", sound.muted ? "Turn sound on" : "Mute sound");
  }
  ui.mute.addEventListener("click", () => { sound.toggle(); sound.ensure(); renderMute(); ui.mute.blur(); });
  renderMute();

  // ---------- Building styles ----------
  let bestMeters = Number(load("skyriseBestMeters")) || 0;
  let styleIndex = clamp(Number(load("skyriseStyle")) || 0, 0, STYLES.length - 1);
  const isUnlocked = st => st.unlock < 0 || bestMeters > MILESTONES[st.unlock].m;
  if (!isUnlocked(STYLES[styleIndex])) styleIndex = 0;
  let style = STYLES[styleIndex];

  ui.pickers.forEach(p => {
    p.innerHTML = `
      <button type="button" data-dir="-1" aria-label="Previous building style">‹</button>
      <div class="picker-info" aria-live="polite">
        <div class="swatch"></div>
        <div class="picker-text"><div class="picker-name"></div><div class="picker-sub"></div></div>
      </div>
      <button type="button" data-dir="1" aria-label="Next building style">›</button>`;
    p.querySelectorAll("button").forEach(b => b.addEventListener("click", () => changeStyle(Number(b.dataset.dir))));
  });

  function renderStyle() {
    const st = STYLES[styleIndex], open = isUnlocked(st);
    ui.pickers.forEach(p => {
      p.classList.toggle("locked", !open);
      p.querySelector(".swatch").innerHTML = (st.swatch || st.floors).slice(0, 3).map(c => `<i style="background:${c}"></i>`).join("");
      p.querySelector(".picker-name").textContent = open ? st.name : `${st.name} (locked)`;
      p.querySelector(".picker-sub").textContent = open
        ? `Style ${styleIndex + 1} of ${STYLES.length}`
        : `Build taller than ${MILESTONES[st.unlock].name}`;
    });
    if (open) {
      style = st;
      save("skyriseStyle", styleIndex);
      // Repaint the tower on screen in the chosen style.
      if (stack && state !== "playing") stack.forEach(b => { if (!b.golden) b.color = colorAt(b.y); });
    }
  }
  function changeStyle(d) {
    sound.ensure();
    sound.click();
    styleIndex = (styleIndex + d + STYLES.length) % STYLES.length;
    renderStyle();
  }

  // ---------- Screen and camera ----------
  let W = 0, H = 0, s = 1, th = 1;
  const view = { zoom: 0.72, level: 0, originY: 0, cx: 0 };
  const wide = () => W / H >= 1.25 && W >= 760;

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = canvas.clientWidth;
    H = canvas.clientHeight;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    // A full floor is about 17.3 units wide on screen; size it to the smaller screen dimension.
    s = Math.min(W * 0.56, H * 0.36) / (BLOCK_SIZE * 2 * ISO_X);
    th = s * 1.3;
    if (!view.originY) view.originY = H * 0.56;
    if (!view.cx) view.cx = W / 2;
    skyKey = "";
    paintVignette();
  }
  window.addEventListener("resize", resize);

  function project(x, y, z) {
    return [
      view.cx + (x - z) * ISO_X * s * view.zoom,
      view.originY + ((x + z) * ISO_Y * s - (y - view.level) * th) * view.zoom,
    ];
  }

  // ---------- Game state ----------
  let state = "menu"; // menu | playing | over
  let stack, mover, debris, particles, popups;
  let score, combo, best = Number(load("skyriseBest")) || 0, time = 0;
  let bounce, flash, shake, overAt, overReady, newBest, lastMilestone, shareBlob, unlockedNow, windWarned;
  let perfects, bestStreak;

  const level = () => stack.length - 1;
  const meters = () => level() * METERS_PER_FLOOR;
  const windAt = n => clamp((n - WIND_START) / 30, 0, 1);
  const people = b => Math.round((b.x1 - b.x0) * (b.z1 - b.z0) * PEOPLE_PER_AREA);

  function colorAt(n) {
    const f = style.floors, i = Math.floor(n / 5), t = (n % 5) / 5;
    return mixRgb(hexRgb(f[i % f.length]), hexRgb(f[(i + 1) % f.length]), t);
  }

  function reset() {
    const h = BLOCK_SIZE / 2;
    stack = [{ x0: -h, x1: h, z0: -h, z1: h, y: 0, color: colorAt(0), lobby: true }];
    debris = []; particles = []; popups = [];
    score = 0; combo = 0; bounce = 0; flash = 0; shake = 0;
    perfects = 0; bestStreak = 0;
    overReady = false; newBest = false; lastMilestone = -1; shareBlob = null;
    unlockedNow = null; windWarned = false;
    newMover();
  }

  function newMover() {
    const top = stack[stack.length - 1];
    const n = stack.length;
    const axis = n % 2 ? "x" : "z";
    const golden = n >= 6 && !top.golden && Math.random() < 0.14;
    mover = {
      x0: top.x0, x1: top.x1, z0: top.z0, z1: top.z1, y: n,
      axis, dir: 1, golden,
      speed: Math.min(20, 8 + n * 0.28) * (golden ? 1.35 : 1),
      gustPhase: Math.random() * Math.PI * 2,
      color: golden ? hexRgb(GOLD) : colorAt(n),
    };
    mover[axis + "0"] -= RANGE;
    mover[axis + "1"] -= RANGE;
    if (!windWarned && windAt(n) > 0) {
      windWarned = true;
      showBanner("Altitude warning", "Wind gusts up here!");
      sound.wind();
    }
  }

  function drop() {
    const top = stack[stack.length - 1];
    const m = mover;
    const a0 = m.axis + "0", a1 = m.axis + "1";
    const lo = Math.max(m[a0], top[a0]);
    const hi = Math.min(m[a1], top[a1]);

    if (hi <= lo) {
      debris.push({ ...m, vy: 0, vside: m[a0] < top[a0] ? -3 : 3, life: 1.4, back: m[a0] < top[a0] });
      mover = null;
      gameOver();
      return;
    }

    const placed = { x0: m.x0, x1: m.x1, z0: m.z0, z1: m.z1, y: m.y, color: m.color, golden: m.golden };
    let points;

    if (Math.abs(m[a0] - top[a0]) <= PERFECT) {
      combo++;
      perfects++;
      bestStreak = Math.max(bestStreak, combo);
      placed[a0] = top[a0];
      placed[a1] = top[a1];
      if (combo >= 3) {
        const grow = Math.min(GROW, BLOCK_SIZE - (top[a1] - top[a0]));
        placed[a0] -= grow / 2;
        placed[a1] += grow / 2;
      }
      // Perfect floors attract more people; penthouses even more.
      points = Math.round(people(placed) * (m.golden ? 5 : 1.5));
      flash = 1;
      sparkle(placed, m.golden ? 46 : 22, m.golden ? GOLD : "#ffffff");
      popups.push({
        text: m.golden ? `PENTHOUSE +${points}` : combo > 1 ? `PERFECT x${combo}` : "PERFECT",
        sub: m.golden ? "" : `+${points}`, y: m.y + 1, life: 1.1, color: m.golden ? GOLD : "#ffffff",
      });
      if (m.golden) sound.golden(); else sound.perfect(combo);
      vibrate(m.golden ? [20, 30, 20] : 20);
    } else {
      combo = 0;
      placed[a0] = lo;
      placed[a1] = hi;
      points = people(placed);
      popups.push({ text: `+${points}`, sub: "", y: m.y + 1, life: 0.8, color: "#ffffff" });
      // The part hanging over the edge breaks off and falls.
      const piece = { ...m, vy: 0, life: 1.2 };
      if (m[a0] < top[a0]) { piece[a1] = top[a0]; piece.back = true; piece.vside = -2.5; }
      else { piece[a0] = top[a1]; piece.back = false; piece.vside = 2.5; }
      debris.push(piece);
      shatter(piece);
      shake = Math.max(shake, 0.25);
      sound.cut();
      vibrate(8);
    }

    dust(placed);
    stack.push(placed);
    score += points;
    bounce = 1;
    updateHud(true);
    checkMilestone();
    newMover();
  }

  function checkMilestone() {
    let reached = -1;
    MILESTONES.forEach((ms, i) => { if (meters() > ms.m) reached = i; });
    if (reached > lastMilestone) {
      lastMilestone = reached;
      showBanner("Landmark passed", `Taller than ${MILESTONES[reached].name}!`);
      setTimeout(() => sound.milestone(), 120);
    }
  }

  // ---------- Particles ----------
  function sparkle(b, n, color) {
    for (let i = 0; i < n; i++) {
      const edge = Math.random(), onX = Math.random() < 0.5;
      const x = onX ? lerp(b.x0, b.x1, edge) : (Math.random() < 0.5 ? b.x0 : b.x1);
      const z = onX ? (Math.random() < 0.5 ? b.z0 : b.z1) : lerp(b.z0, b.z1, edge);
      particles.push({
        kind: "spark", x, z, y: b.y + 1,
        vx: (x - (b.x0 + b.x1) / 2) * 0.45, vz: (z - (b.z0 + b.z1) / 2) * 0.45,
        vy: rand(1, 3.2), life: rand(0.5, 1), max: 1, color, size: rand(2, 4.5),
      });
    }
  }
  function shatter(p) {
    for (let i = 0; i < 14; i++) {
      particles.push({
        kind: "shard", x: rand(p.x0, p.x1), z: rand(p.z0, p.z1), y: p.y + rand(0.2, 0.9),
        vx: rand(-3, 3) + (p.vside || 0) * (p.axis === "x" ? 1 : 0), vz: rand(-3, 3) + (p.vside || 0) * (p.axis === "z" ? 1 : 0),
        vy: rand(0, 3), life: rand(0.6, 1.1), max: 1.1, color: style.glass, size: rand(3, 6), rot: rand(0, 6),
      });
    }
  }
  function dust(b) {
    const corners = [[b.x0, b.z1], [b.x1, b.z1], [b.x1, b.z0], [(b.x0 + b.x1) / 2, b.z1], [b.x1, (b.z0 + b.z1) / 2]];
    for (const [x, z] of corners) {
      particles.push({ kind: "dust", x, z, y: b.y + 0.05, vx: rand(-0.6, 0.6), vz: rand(-0.6, 0.6), vy: 0.3, life: 0.5, max: 0.5, size: rand(4, 7) });
    }
  }

  function gameOver() {
    state = "over";
    overAt = performance.now();
    combo = 0;
    shake = 0.6;
    if (score > best) { best = score; newBest = true; save("skyriseBest", best); }
    if (meters() > bestMeters) {
      const before = STYLES.filter(isUnlocked).length;
      bestMeters = meters();
      save("skyriseBestMeters", bestMeters);
      const unlocked = STYLES.filter(isUnlocked);
      if (unlocked.length > before) {
        // Switch to the newest style right away so the next tower shows it off.
        unlockedNow = unlocked[unlocked.length - 1];
        styleIndex = STYLES.indexOf(unlockedNow);
        sound.unlock();
      }
    }
    ui.hud.hidden = true;
    ui.wind.hidden = true;
    sound.fail();
    vibrate([40, 40, 90]);
  }

  function vibrate(p) {
    try { if (navigator.vibrate) navigator.vibrate(p); } catch {}
  }

  // ---------- HUD and screens ----------
  function updateHud(bump) {
    ui.people.textContent = fmt(score);
    if (bump) { ui.people.classList.remove("bump"); void ui.people.offsetWidth; ui.people.classList.add("bump"); }
    const m = meters();
    ui.height.textContent = `${m} m`;
    const i = MILESTONES.findIndex(ms => ms.m >= m);
    if (i >= 0) {
      const prev = i > 0 ? MILESTONES[i - 1].m : 0;
      ui.next.textContent = `${shortName(MILESTONES[i].name)} · ${MILESTONES[i].m} m`;
      ui.bar.style.width = `${clamp((m - prev) / (MILESTONES[i].m - prev), 0, 1) * 100}%`;
    } else {
      ui.next.textContent = "Taller than every landmark";
      ui.bar.style.width = "100%";
    }
    ui.wind.hidden = windAt(stack.length) <= 0;
  }

  function showBanner(eyebrow, title) {
    ui.bannerEyebrow.textContent = eyebrow;
    ui.bannerTitle.textContent = title;
    ui.banner.hidden = false;
    ui.banner.classList.remove("show");
    void ui.banner.offsetWidth;
    ui.banner.classList.add("show");
    clearTimeout(showBanner.t);
    showBanner.t = setTimeout(() => { ui.banner.hidden = true; }, 2600);
  }

  function showOver() {
    ui.overEyebrow.textContent = newBest ? "New best!" : "Tower complete";
    ui.overEyebrow.classList.toggle("best", newBest);
    ui.overPeople.textContent = fmt(score);
    ui.overSub.textContent = `people live in your ${meters()} m tower`;
    ui.overLandmark.textContent = lastMilestone >= 0 ? `Taller than ${MILESTONES[lastMilestone].name}` : `Best: ${fmt(best)} people`;
    ui.statFloors.textContent = level();
    ui.statPerfect.textContent = perfects;
    ui.statStreak.textContent = bestStreak;
    ui.overUnlock.hidden = !unlockedNow;
    if (unlockedNow) ui.overUnlock.textContent = `New style unlocked: ${unlockedNow.name}`;
    renderStyle();
    ui.over.hidden = false;
  }

  function renderMenu() {
    ui.menuBest.hidden = !best;
    ui.menuBest.innerHTML = `Best tower: <b>${fmt(best)}</b> people`;
    renderStyle();
  }

  // ---------- Input ----------
  function start() {
    sound.ensure();
    if (!isUnlocked(STYLES[styleIndex])) {
      showToast(`Locked. Build taller than ${MILESTONES[STYLES[styleIndex].unlock].name} to unlock it.`);
      return;
    }
    ui.menu.hidden = true;
    ui.over.hidden = true;
    ui.hud.hidden = false;
    reset();
    updateHud(false);
    state = "playing";
  }
  function tap() {
    sound.ensure();
    if (state === "menu") start();
    else if (state === "playing") drop();
  }
  canvas.addEventListener("pointerdown", e => { e.preventDefault(); tap(); });
  ui.play.addEventListener("click", start);
  ui.again.addEventListener("click", start);
  window.addEventListener("keydown", e => {
    if (e.target instanceof HTMLButtonElement && (e.code === "Space" || e.code === "Enter")) return;
    if (e.code === "Space" || e.code === "Enter") {
      e.preventDefault();
      if (e.repeat) return;
      if (state === "over") { if (overReady) start(); } else tap();
    }
    if (state !== "playing" && e.code === "ArrowLeft") changeStyle(-1);
    if (state !== "playing" && e.code === "ArrowRight") changeStyle(1);
  });

  // ---------- Sharing ----------
  function shareText() {
    const ms = lastMilestone >= 0 ? `, taller than ${MILESTONES[lastMilestone].name}` : "";
    return `My Skyrise tower is ${meters()} m tall${ms}, with ${fmt(score)} people living in it. Can you build a bigger one?`;
  }
  // A portrait share card: the finished tower with the score laid over it.
  function makeShareImage() {
    const out = document.createElement("canvas");
    out.width = 1080; out.height = 1350;
    const o = out.getContext("2d");
    const sc = Math.max(1080 / canvas.width, 1350 / canvas.height);
    const dw = canvas.width * sc, dh = canvas.height * sc;
    // Crop around the tower, wherever the current layout put it on screen.
    const px = canvas.width / W * sc;
    const topY = project(0, level() + 4.8, 0)[1], botY = project(ISLAND, 0, ISLAND)[1];
    const dx = clamp(540 - view.cx * px, 1080 - dw, 0);
    const dy = clamp(1350 * 0.4 - (topY + botY) / 2 * px, 1350 - dh, 0);
    o.drawImage(canvas, dx, dy, dw, dh);
    const g = o.createLinearGradient(0, 760, 0, 1350);
    g.addColorStop(0, "rgba(8,10,30,0)");
    g.addColorStop(1, "rgba(8,10,30,0.92)");
    o.fillStyle = g;
    o.fillRect(0, 760, 1080, 590);
    const top = o.createLinearGradient(0, 0, 0, 220);
    top.addColorStop(0, "rgba(8,10,30,0.6)");
    top.addColorStop(1, "rgba(8,10,30,0)");
    o.fillStyle = top;
    o.fillRect(0, 0, 1080, 220);
    o.textAlign = "center";
    o.fillStyle = "#ffffff";
    o.shadowColor = "rgba(0,0,0,0.35)";
    o.shadowBlur = 16;
    o.font = `56px ${DISPLAY}`;
    o.fillText("SKYRISE", 540, 110);
    o.font = `190px ${NUMFONT}`;
    o.fillText(fmt(score), 540, 1110);
    o.font = `800 46px ${UIFONT}`;
    o.fillText(`people live in my ${meters()} m tower`, 540, 1180);
    if (lastMilestone >= 0) {
      o.fillStyle = GOLD;
      o.font = `800 40px ${UIFONT}`;
      o.fillText(`Taller than ${MILESTONES[lastMilestone].name}`, 540, 1245);
    }
    out.toBlob(b => { shareBlob = b; });
  }
  ui.share.addEventListener("click", async () => {
    const url = SHARE_URL || location.href.split("#")[0];
    const text = shareText();
    try {
      if (shareBlob && navigator.canShare) {
        const file = new File([shareBlob], "skyrise.png", { type: "image/png" });
        if (navigator.canShare({ files: [file] })) {
          await navigator.share({ files: [file], text: `${text} ${url}` });
          return;
        }
      }
      if (navigator.share) { await navigator.share({ title: "Skyrise", text, url }); return; }
    } catch (e) {
      if (e.name === "AbortError") return; // user closed the share sheet
    }
    try {
      await navigator.clipboard.writeText(`${text} ${url}`);
      showToast("Copied! Paste it to a friend");
    } catch {
      showToast(`${text} ${url}`);
    }
  });
  function showToast(msg) {
    ui.toast.textContent = msg;
    ui.toast.hidden = false;
    clearTimeout(showToast.t);
    showToast.t = setTimeout(() => { ui.toast.hidden = true; }, 2800);
  }

  // ---------- Update ----------
  function update(dt) {
    time += dt;
    if (state === "playing" && mover) {
      const a0 = mover.axis + "0", a1 = mover.axis + "1";
      const top = stack[stack.length - 1];
      // Gusts make the floor speed up and slow down unpredictably up high.
      const w = windAt(mover.y);
      const gust = 1 + w * 0.55 * Math.sin(time * 2.3 + mover.gustPhase) * Math.sin(time * 0.9 + mover.gustPhase * 2);
      const step = mover.dir * mover.speed * gust * dt;
      mover[a0] += step;
      mover[a1] += step;
      const offset = mover[a0] - top[a0];
      if (offset > RANGE) mover.dir = -1;
      if (offset < -RANGE) mover.dir = 1;
    }

    // Camera: follow the top while playing; at game over, frame the whole tower above the card.
    let tZoom = 1, tLevel = Math.max(0, level() - Math.floor(H * 0.2 / th)), tOrigin = H * 0.6, tCx = W / 2;
    if (state === "menu") { tZoom = 0.72; tOrigin = H * 0.56; }
    if (state === "over") {
      // Frame whichever reaches higher, the antenna or the island's back corner, down to the island's front.
      const above = Math.max((level() + 4.8) * th, ISLAND * s);
      const room = wide() ? H * 0.84 : H * 0.44;
      tZoom = Math.min(1, room / (above + ISLAND * s + 3 * th));
      tLevel = 0;
      tOrigin = H * 0.08 + above * tZoom;
      if (wide()) tCx = W * 0.27;
    }
    const k = Math.min(1, dt * (state === "over" ? 3 : 6));
    view.zoom = lerp(view.zoom, tZoom, k);
    view.level = lerp(view.level, tLevel, k);
    view.originY = lerp(view.originY, tOrigin, k);
    view.cx = lerp(view.cx, tCx, k);

    if (state === "over" && !overReady && performance.now() - overAt > 1100) {
      overReady = true;
      debris = []; // keep the fallen floor out of the share picture
      showOver();
      document.fonts.ready.then(() => requestAnimationFrame(makeShareImage));
    }

    bounce = Math.max(0, bounce - dt * 6);
    flash = Math.max(0, flash - dt * 2.2);
    shake = Math.max(0, shake - dt * 1.8);
    for (const d of debris) {
      d.vy += 26 * dt;
      d.y -= d.vy * dt;
      const side = (d.vside || 0) * dt;
      if (d.axis === "x") { d.x0 += side; d.x1 += side; } else { d.z0 += side; d.z1 += side; }
      d.life -= dt * 0.7;
    }
    debris = debris.filter(d => d.life > 0);
    for (const p of particles) {
      p.x += p.vx * dt; p.z += p.vz * dt; p.y += p.vy * dt;
      p.vy -= (p.kind === "shard" ? 9 : p.kind === "dust" ? 0 : 3) * dt;
      p.life -= dt;
      if (p.kind === "shard") p.rot += dt * 8;
    }
    particles = particles.filter(p => p.life > 0);
    for (const p of popups) { p.life -= dt; p.y += dt * 1.3; }
    popups = popups.filter(p => p.life > 0);
  }

  // ---------- Scenery ----------
  // A soft cloud sprite, drawn once and reused.
  const cloudSprite = (() => {
    const c = document.createElement("canvas");
    c.width = 380; c.height = 230;
    const g = c.getContext("2d");
    const puffs = [[105, 130, 58], [170, 102, 74], [242, 118, 62], [295, 138, 42], [72, 142, 40], [188, 142, 66]];
    for (const [x, y, r] of puffs) {
      const rg = g.createRadialGradient(x - r * 0.2, y - r * 0.35, r * 0.1, x, y, r);
      rg.addColorStop(0, "rgba(255,255,255,1)");
      rg.addColorStop(0.65, "rgba(250,252,255,0.92)");
      rg.addColorStop(1, "rgba(235,242,255,0)");
      g.fillStyle = rg;
      g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
    }
    return c;
  })();

  const stars = Array.from({ length: 120 }, () => ({ x: Math.random(), y: Math.random(), r: rand(0.4, 1.8), p: rand(0, 6) }));
  const bgClouds = Array.from({ length: 7 }, () => ({ x: Math.random(), y: Math.random() * 1.6, size: rand(0.5, 1.1), v: rand(0.004, 0.012) }));
  const bandClouds = Array.from({ length: 12 }, () => ({ level: rand(16, 46), x: rand(-1.1, 1.1), size: rand(0.9, 1.8), front: Math.random() < 0.4, v: rand(0.01, 0.03) }));
  const streaks = Array.from({ length: 16 }, () => ({ x: Math.random(), y: Math.random(), len: rand(0.08, 0.22), v: rand(0.6, 1.4) }));
  let shootingStar = null;

  // Island scenery in world units: neighbor buildings and trees.
  const NEIGHBORS = [
    { x0: -15.5, x1: -10, z0: 9, z1: 14.5, h: 4, color: hexRgb("#e8dcc8") },
    { x0: 9.5, x1: 15, z0: -15, z1: -9.5, h: 6, color: hexRgb("#c9d6e6") },
    { x0: -15, x1: -11, z0: -1, z1: 4, h: 2, color: hexRgb("#f0c9a8") },
  ];
  const TREES = [
    [-8, 9], [-6.5, 12.5], [-3, 14.5], [8.5, 8.5], [12, 4], [14.5, 1], [4, 12], [-13, -5.5], [-11, -8.5],
    [2.5, -13], [-1, -15], [12.5, 11.5], [15.5, 7], [-15, 6.5],
  ].map(([x, z], i) => ({ x, z, size: 0.8 + hash(i, 3, 7) * 0.5, hue: hash(i, 9, 1) }));

  function skyAt(n) {
    let i = 0;
    while (i < SKY.length - 2 && n > SKY[i + 1].at) i++;
    const a = SKY[i], b = SKY[i + 1];
    const t = clamp((n - a.at) / (b.at - a.at), 0, 1);
    return [mixRgb(hexRgb(a.top), hexRgb(b.top), t), mixRgb(hexRgb(a.bottom), hexRgb(b.bottom), t)];
  }
  const nightAt = n => clamp((n - 45) / 35, 0, 1);
  const env = { nf: 0, skyTop: [0, 0, 0], skyBot: [0, 0, 0], climb: 0 };

  // Full-screen gradients are expensive, so the sky and vignette are painted into small
  // offscreen canvases and scaled up. The sky only repaints when the tower height changes.
  const skyCache = document.createElement("canvas");
  const vignette = document.createElement("canvas");
  let skyKey = "";

  function paintSky(n) {
    skyCache.width = Math.max(1, Math.ceil(W / 4));
    skyCache.height = Math.max(1, Math.ceil(H / 4));
    const g = skyCache.getContext("2d");
    g.setTransform(skyCache.width / W, 0, 0, skyCache.height / H, 0, 0);
    const grad = g.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, rgb(env.skyTop));
    grad.addColorStop(1, rgb(env.skyBot));
    g.fillStyle = grad;
    g.fillRect(0, 0, W, H);
    // Sun sinks toward the horizon as the tower climbs.
    const sunT = clamp(n / 50, 0, 1);
    if (sunT < 1) {
      const sx = W * 0.8, sy = lerp(H * 0.16, H * 1.05, sunT * sunT);
      const sunCol = mixRgb([255, 247, 214], [255, 150, 90], sunT);
      const glow = g.createRadialGradient(sx, sy, 0, sx, sy, Math.min(W, H) * 0.45);
      glow.addColorStop(0, rgb(sunCol, 1, 0.55));
      glow.addColorStop(1, rgb(sunCol, 1, 0));
      g.fillStyle = glow;
      g.fillRect(0, 0, W, H);
    }
  }

  function paintVignette() {
    vignette.width = Math.max(1, Math.ceil(W / 4));
    vignette.height = Math.max(1, Math.ceil(H / 4));
    const g = vignette.getContext("2d");
    g.setTransform(vignette.width / W, 0, 0, vignette.height / H, 0, 0);
    const v = g.createRadialGradient(W / 2, H * 0.45, Math.min(W, H) * 0.35, W / 2, H * 0.5, Math.max(W, H) * 0.8);
    v.addColorStop(0, "rgba(5,8,30,0)");
    v.addColorStop(1, "rgba(5,8,30,0.35)");
    g.fillStyle = v;
    g.fillRect(0, 0, W, H);
  }

  function drawSky(dt) {
    const n = stack ? stack.length : 1;
    const key = `${n}:${W}:${H}`;
    if (key !== skyKey) { skyKey = key; paintSky(n); }
    ctx.drawImage(skyCache, 0, 0, W, H);

    const sunT = clamp(n / 50, 0, 1);
    if (sunT < 1) {
      const sx = W * 0.8, sy = lerp(H * 0.16, H * 1.05, sunT * sunT);
      ctx.fillStyle = rgb(mixRgb([255, 247, 214], [255, 150, 90], sunT));
      ctx.beginPath(); ctx.arc(sx, sy, Math.min(W, H) * 0.06, 0, Math.PI * 2); ctx.fill();
    }
    if (env.nf > 0) {
      for (const st of stars) {
        ctx.globalAlpha = env.nf * (0.45 + 0.55 * Math.sin(time * 1.6 + st.p));
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(st.x * W, st.y * H * 0.85, st.r, st.r);
      }
      const ma = clamp((n - 60) / 20, 0, 1);
      if (ma > 0) {
        const mx = W * 0.2, my = H * 0.17, mr = Math.min(W, H) * 0.045;
        ctx.globalAlpha = ma;
        const mg = ctx.createRadialGradient(mx, my, mr, mx, my, mr * 5);
        mg.addColorStop(0, "rgba(200,210,255,0.35)");
        mg.addColorStop(1, "rgba(200,210,255,0)");
        ctx.fillStyle = mg;
        ctx.fillRect(mx - mr * 5, my - mr * 5, mr * 10, mr * 10);
        ctx.fillStyle = "#f4f2ff";
        ctx.beginPath(); ctx.arc(mx, my, mr, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "rgba(170,170,210,0.45)";
        ctx.beginPath(); ctx.arc(mx - mr * 0.3, my - mr * 0.2, mr * 0.22, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(mx + mr * 0.35, my + mr * 0.3, mr * 0.15, 0, Math.PI * 2); ctx.fill();
      }
      if (!shootingStar && Math.random() < dt * 0.15 * env.nf) shootingStar = { x: rand(0.2, 0.9), y: rand(0.05, 0.35), life: 0.8 };
      if (shootingStar) {
        const ss = shootingStar, t = 1 - ss.life / 0.8;
        const x = (ss.x - t * 0.25) * W, y = (ss.y + t * 0.12) * H;
        const sg = ctx.createLinearGradient(x, y, x + 70, y - 34);
        sg.addColorStop(0, "rgba(255,255,255,0.9)");
        sg.addColorStop(1, "rgba(255,255,255,0)");
        ctx.globalAlpha = Math.sin(Math.PI * t);
        ctx.strokeStyle = sg;
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + 70, y - 34); ctx.stroke();
        ss.life -= dt;
        if (ss.life <= 0) shootingStar = null;
      }
      ctx.globalAlpha = 1;
    }

    // Distant clouds drift by, and slide down the screen as you climb.
    const tint = 1 - env.nf * 0.55;
    for (const c of bgClouds) {
      c.x += c.v * dt;
      if (c.x > 1.3) c.x = -0.4;
      const span = H * 1.6;
      const y = ((c.y * H + env.climb * 0.3) % span + span) % span - H * 0.3;
      const w = Math.min(W, 520) * 0.55 * c.size;
      ctx.globalAlpha = 0.5 * tint;
      ctx.drawImage(cloudSprite, c.x * W - w / 2, y - w * 0.3, w, w * 0.605);
    }
    ctx.globalAlpha = 1;
  }

  function drawWind(dt) {
    const wind = state === "playing" ? windAt(stack.length) : 0;
    if (wind <= 0) return;
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 2;
    ctx.lineCap = "round";
    for (const st of streaks) {
      st.x += st.v * dt * (0.6 + wind);
      if (st.x > 1.2) { st.x = -0.3; st.y = Math.random(); }
      ctx.globalAlpha = wind * 0.28;
      ctx.beginPath();
      ctx.moveTo(st.x * W, st.y * H);
      ctx.lineTo((st.x + st.len) * W, st.y * H);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  // Big soft clouds that live at a fixed altitude, so the tower climbs through them.
  function drawBandClouds(front, dt) {
    const tint = 1 - env.nf * 0.6;
    for (const c of bandClouds) {
      if (c.front !== front) continue;
      if (front) c.x += c.v * dt; else c.x -= c.v * dt * 0.5;
      if (c.x > 1.3) c.x = -1.3;
      if (c.x < -1.3) c.x = 1.3;
      const [, y] = project(0, c.level, 0);
      const w = BLOCK_SIZE * 2.4 * s * view.zoom * c.size;
      if (y < -w || y > H + w) continue;
      // Clouds in front stay see-through near the top floor so they never hide your aim.
      const nearTop = state === "playing" && Math.abs(c.level - stack.length) < 5;
      ctx.globalAlpha = (front ? (nearTop ? 0.22 : 0.6) : 0.85) * tint;
      ctx.drawImage(cloudSprite, view.cx + c.x * W * 0.6 - w / 2, y - w * 0.3, w, w * 0.605);
    }
    ctx.globalAlpha = 1;
  }

  function poly(points, fill) {
    ctx.fillStyle = fill;
    ctx.beginPath();
    ctx.moveTo(points[0][0], points[0][1]);
    for (let i = 1; i < points.length; i++) ctx.lineTo(points[i][0], points[i][1]);
    ctx.closePath();
    ctx.fill();
  }
  // A face shaded from top to bottom. Points are [top-left, top-right, bottom-right, bottom-left].
  function face(pts, c, fTop, fBot) {
    const g = ctx.createLinearGradient(pts[0][0], pts[0][1], pts[3][0], pts[3][1]);
    g.addColorStop(0, rgb(c, fTop));
    g.addColorStop(1, rgb(c, fBot));
    poly(pts, g);
  }

  function drawIsland() {
    const I = ISLAND, d = 1 - env.nf * 0.6;
    const P = (x, y, z) => project(x, y, z);
    // Rocky underside tapering to a point
    const apex = P(0, -17, 0);
    poly([P(I, -3, -I), P(I, -3, I), apex], rgb(hexRgb("#5a4334"), d));
    poly([P(-I, -3, I), P(I, -3, I), apex], rgb(hexRgb("#7a5b43"), d));
    // Dirt sides with a grass lip
    face([P(-I, 0, I), P(I, 0, I), P(I, -3, I), P(-I, -3, I)], hexRgb("#a07a52"), d, 0.75 * d);
    face([P(I, 0, -I), P(I, 0, I), P(I, -3, I), P(I, -3, -I)], hexRgb("#86643f"), d, 0.7 * d);
    poly([P(-I, 0, I), P(I, 0, I), P(I, -0.45, I), P(-I, -0.45, I)], rgb(hexRgb("#5fae4e"), d));
    poly([P(I, 0, -I), P(I, 0, I), P(I, -0.45, I), P(I, -0.45, -I)], rgb(hexRgb("#4e9640"), d));
    // Lawn
    poly([P(-I, 0, -I), P(I, 0, -I), P(I, 0, I), P(-I, 0, I)], rgb(hexRgb("#7fc76a"), d));
    // Roads leading off the island
    const road = rgb(hexRgb("#7d8597"), d), line = rgb(hexRgb("#f1f3f5"), d);
    poly([P(7, 0.01, -1.4), P(I, 0.01, -1.4), P(I, 0.01, 1.4), P(7, 0.01, 1.4)], road);
    poly([P(-1.4, 0.01, 7), P(1.4, 0.01, 7), P(1.4, 0.01, I), P(-1.4, 0.01, I)], road);
    poly([P(-I, 0.01, -1.4), P(-7, 0.01, -1.4), P(-7, 0.01, 1.4), P(-I, 0.01, 1.4)], road);
    for (let u = 8; u < I; u += 2.2) {
      poly([P(u, 0.02, -0.12), P(u + 1.1, 0.02, -0.12), P(u + 1.1, 0.02, 0.12), P(u, 0.02, 0.12)], line);
      poly([P(-0.12, 0.02, u), P(0.12, 0.02, u), P(0.12, 0.02, u + 1.1), P(-0.12, 0.02, u + 1.1)], line);
    }
    // Plaza around the tower
    poly([P(-7.4, 0.02, -7.4), P(7.4, 0.02, -7.4), P(7.4, 0.02, 7.4), P(-7.4, 0.02, 7.4)], rgb(hexRgb("#c9cfd8"), d));
    poly([P(-6.8, 0.03, -6.8), P(6.8, 0.03, -6.8), P(6.8, 0.03, 6.8), P(-6.8, 0.03, 6.8)], rgb(hexRgb("#e3e7ec"), d));
  }

  function drawTree(t) {
    const d = 1 - env.nf * 0.6;
    const [x, y] = project(t.x, 0, t.z);
    const r = 0.75 * s * view.zoom * t.size;
    ctx.fillStyle = `rgba(20,40,20,${0.22 * d})`;
    ctx.beginPath(); ctx.ellipse(x, y, r * 0.9, r * 0.45, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = rgb(hexRgb("#7a5536"), d);
    ctx.fillRect(x - r * 0.12, y - r * 1.1, r * 0.24, r * 1.1);
    const leaf = mixRgb(hexRgb("#3f9b4a"), hexRgb("#6bbf4e"), t.hue);
    ctx.fillStyle = rgb(leaf, 0.82 * d);
    ctx.beginPath(); ctx.arc(x, y - r * 1.55, r * 0.85, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = rgb(leaf, 1.12 * d);
    ctx.beginPath(); ctx.arc(x - r * 0.22, y - r * 1.75, r * 0.5, 0, Math.PI * 2); ctx.fill();
  }

  // ---------- Buildings ----------
  // Four corners of a rectangle on a wall. The wall runs along `axis` at the fixed coordinate `at`.
  function wallQuad(f, u0, u1, ya, yb) {
    const p = f.axis === "x" ? (u, y) => project(u, y, f.at) : (u, y) => project(f.at, y, u);
    return [p(u0, yb), p(u1, yb), p(u1, ya), p(u0, ya)];
  }

  function glassColor(look, sh) {
    const day = mixRgb(hexRgb(look.glass), env.skyBot, look.kind === "ribbon" ? 0.22 : 0.12);
    return rgb(mixRgb(day, [14, 20, 42], env.nf * 0.88), sh);
  }

  function glowQuad(q, color) {
    ctx.globalCompositeOperation = "lighter";
    ctx.globalAlpha *= 0.22;
    poly(q, color);
    ctx.globalAlpha /= 0.22;
    ctx.globalCompositeOperation = "source-over";
  }

  // One storey of facade on one wall: floor slab, windows, lights and reflections.
  function drawStorey(b, fy, top, look, f, alpha) {
    const nf = env.nf;
    const slabC = hexRgb(look.slab);
    if (look.neon) {
      const nc = look.lit[Math.abs(Math.round(fy)) % look.lit.length];
      const q = wallQuad(f, f.lo, f.hi, fy, fy + 0.07);
      poly(q, nc);
      if (view.zoom > 0.35) glowQuad(wallQuad(f, f.lo, f.hi, fy - 0.12, fy + 0.2), nc);
    } else {
      poly(wallQuad(f, f.lo, f.hi, fy, fy + look.slabH), rgb(slabC, f.sh * (1 - nf * 0.55)));
    }
    const ya = fy + 0.26, yb = Math.min(fy + 0.84, top - 0.07);
    if (yb <= ya + 0.08) return;
    const lit = r => look.alwaysLit || r < nf * 0.72;
    const glows = view.zoom > 0.4 && (nf > 0.25 || look.alwaysLit);

    if (look.kind === "ribbon") {
      const u0 = f.lo + 0.22, u1 = f.hi - 0.22;
      if (u1 <= u0) return;
      poly(wallQuad(f, u0, u1, ya, yb), glassColor(look, f.sh));
      const step = 1.3;
      for (let k = Math.floor(u0 / step); k * step < u1; k++) {
        const p0 = Math.max(u0, k * step) + 0.05, p1 = Math.min(u1, (k + 1) * step) - 0.05;
        if (p1 <= p0) continue;
        const r = hash(Math.round(fy), f.id, k);
        if (lit(r)) {
          const c = look.lit[Math.floor(r * 97) % look.lit.length];
          const q = wallQuad(f, p0, p1, ya, yb);
          poly(q, c);
          if (glows) glowQuad(wallQuad(f, p0 - 0.25, p1 + 0.25, ya - 0.2, yb + 0.2), c);
        } else if (((k + Math.round(fy)) % 5 + 5) % 5 === 0 && nf < 0.9) {
          // Diagonal sky reflections running across the glass
          ctx.globalAlpha = alpha * 0.28 * (1 - nf);
          poly(wallQuad(f, p0, p1, ya, yb), "#ffffff");
          ctx.globalAlpha = alpha;
        }
      }
      if (view.zoom > 0.3) {
        ctx.strokeStyle = rgb(hexRgb(look.frame), f.sh * (1 - nf * 0.6), 0.8);
        ctx.lineWidth = Math.max(0.8, 1.4 * view.zoom);
        ctx.beginPath();
        for (let k = Math.ceil(u0 / step); k * step < u1; k++) {
          const [q0, , , q3] = wallQuad(f, k * step, k * step, ya, yb);
          ctx.moveTo(q0[0], q0[1]);
          ctx.lineTo(q3[0], q3[1]);
        }
        ctx.stroke();
      }
    } else {
      const step = 1.6, half = 0.42;
      const frameC = rgb(hexRgb(look.frame), f.sh * (1 - nf * 0.6));
      for (let i = Math.ceil((f.lo + half + 0.2) / step - 0.5); (i + 0.5) * step + half + 0.2 <= f.hi; i++) {
        const c = (i + 0.5) * step;
        poly(wallQuad(f, c - half - 0.1, c + half + 0.1, ya - 0.1, yb + 0.05), frameC);
        const r = hash(Math.round(fy), f.id, i);
        const q = wallQuad(f, c - half, c + half, ya, yb);
        if (lit(r)) {
          const lc = look.lit[Math.floor(r * 97) % look.lit.length];
          poly(q, lc);
          if (glows) glowQuad(wallQuad(f, c - half - 0.3, c + half + 0.3, ya - 0.25, yb + 0.25), lc);
        } else {
          poly(q, glassColor(look, f.sh));
          if (((i + Math.round(fy)) % 4 + 4) % 4 === 0 && nf < 0.9) {
            ctx.globalAlpha = alpha * 0.3 * (1 - nf);
            poly(wallQuad(f, c - half, c, ya, yb), "#ffffff");
            ctx.globalAlpha = alpha;
          }
        }
      }
    }
  }

  // The lobby: tall glass with a front door and canopy.
  function drawLobby(b, look, f) {
    const u0 = f.lo + 0.3, u1 = f.hi - 0.3;
    poly(wallQuad(f, u0, u1, 0.1, 0.86), glassColor({ ...look, kind: "ribbon" }, f.sh));
    const lit = env.nf > 0.2;
    if (lit) {
      ctx.globalAlpha = env.nf * 0.7;
      poly(wallQuad(f, u0, u1, 0.1, 0.86), "#ffe7a1");
      ctx.globalAlpha = 1;
    }
    ctx.strokeStyle = rgb(hexRgb(look.frame), f.sh, 0.85);
    ctx.lineWidth = Math.max(0.8, 1.4 * view.zoom);
    ctx.beginPath();
    for (let u = Math.ceil(u0 / 1.3) * 1.3; u < u1; u += 1.3) {
      const [q0, , , q3] = wallQuad(f, u, u, 0.1, 0.86);
      ctx.moveTo(q0[0], q0[1]); ctx.lineTo(q3[0], q3[1]);
    }
    ctx.stroke();
    if (f.id === 1) {
      poly(wallQuad(f, -0.9, 0.9, 0.04, 0.62), rgb([30, 36, 52]));
      poly(wallQuad(f, -0.04, 0.04, 0.04, 0.62), rgb([120, 130, 150]));
      poly(wallQuad(f, -1.5, 1.5, 0.62, 0.7), rgb(hexRgb(look.frame), 0.9));
    }
  }

  // A building block: two visible walls with facade detail, a roof, and crisp edges.
  function drawBlock(b, y0, y1, opts = {}) {
    const look = opts.look || style;
    const alpha = opts.alpha ?? 1;
    const c = b.color, d = 1 - env.nf * (look.neon ? 0.15 : 0.55);
    const A = project(b.x0, y1, b.z0), B = project(b.x1, y1, b.z0);
    const C = project(b.x1, y1, b.z1), D = project(b.x0, y1, b.z1);
    const Bb = project(b.x1, y0, b.z0), Cb = project(b.x1, y0, b.z1), Db = project(b.x0, y0, b.z1);
    ctx.globalAlpha = alpha;
    face([D, C, Cb, Db], c, 1.0 * d, 0.88 * d);
    face([B, C, Cb, Bb], c, 0.78 * d, 0.66 * d);

    if (!opts.plain) {
      const walls = [
        { axis: "x", at: b.z1, lo: b.x0, hi: b.x1, sh: 1, id: 1 },
        { axis: "z", at: b.x1, lo: b.z0, hi: b.z1, sh: 0.8, id: 2 },
      ];
      if (b.lobby) walls.forEach(f => drawLobby(b, look, f));
      else for (let fy = y0; fy < y1 - 0.3; fy++) walls.forEach(f => drawStorey(b, fy, y1, look, f, alpha));
    }

    // Roof with a parapet rim
    poly([A, B, C, D], rgb(c, 1.14 * d));
    const ins = Math.min(0.45, (b.x1 - b.x0) / 6, (b.z1 - b.z0) / 6);
    poly([project(b.x0 + ins, y1, b.z0 + ins), project(b.x1 - ins, y1, b.z0 + ins),
          project(b.x1 - ins, y1, b.z1 - ins), project(b.x0 + ins, y1, b.z1 - ins)], rgb(c, 0.98 * d));
    if (b.golden) {
      // A shine that sweeps across penthouse floors
      const t = (performance.now() / 900) % 1.6 - 0.3;
      if (t > 0 && t < 1) {
        const x = lerp(b.x0, b.x1, t), x2 = Math.min(b.x1, x + 1.2);
        ctx.globalAlpha = alpha * 0.5;
        poly([project(x, y1, b.z0), project(x2, y1, b.z0), project(x2, y1, b.z1), project(x, y1, b.z1)], "#ffffff");
        ctx.globalAlpha = alpha;
      }
    }
    // Light catching the top edges and the front corner
    ctx.lineWidth = Math.max(0.8, 1.2 * view.zoom);
    ctx.strokeStyle = `rgba(255,255,255,${0.45 * d})`;
    ctx.beginPath(); ctx.moveTo(D[0], D[1]); ctx.lineTo(C[0], C[1]); ctx.lineTo(B[0], B[1]); ctx.stroke();
    ctx.strokeStyle = `rgba(255,255,255,${0.18 * d})`;
    ctx.beginPath(); ctx.moveTo(C[0], C[1]); ctx.lineTo(Cb[0], Cb[1]); ctx.stroke();
    ctx.globalAlpha = 1;
  }

  // A rooftop and blinking antenna, so the finished tower looks like a real skyscraper.
  function drawRoof(t) {
    const cx = (t.x0 + t.x1) / 2, cz = (t.z0 + t.z1) / 2;
    const hw = Math.min(1.8, (t.x1 - t.x0) / 3), hd = Math.min(1.8, (t.z1 - t.z0) / 3);
    drawBlock({ x0: cx - hw, x1: cx + hw, z0: cz - hd, z1: cz + hd, y: t.y + 1, color: [190, 198, 210] }, t.y + 1, t.y + 1.7, { plain: true });
    const [bx, by] = project(cx, t.y + 1.7, cz), [tx, ty] = project(cx, t.y + 4.6, cz);
    ctx.strokeStyle = "#e9ecef";
    ctx.lineWidth = Math.max(1.5, 3 * view.zoom);
    ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(tx, ty); ctx.stroke();
    const on = Math.floor(performance.now() / 600) % 2 === 0;
    const r = Math.max(2.5, 5 * view.zoom);
    if (on) {
      const g = ctx.createRadialGradient(tx, ty, 0, tx, ty, r * 5);
      g.addColorStop(0, "rgba(255,70,70,0.7)");
      g.addColorStop(1, "rgba(255,70,70,0)");
      ctx.fillStyle = g;
      ctx.fillRect(tx - r * 5, ty - r * 5, r * 10, r * 10);
    }
    ctx.fillStyle = on ? "#ff4646" : "#7a1f1f";
    ctx.beginPath(); ctx.arc(tx, ty, r, 0, Math.PI * 2); ctx.fill();
  }

  // Shows where the sliding floor will land, to help aim.
  function drawLandingShadow() {
    if (!mover || state !== "playing") return;
    const t = stack[stack.length - 1];
    const x0 = Math.max(mover.x0, t.x0), x1 = Math.min(mover.x1, t.x1);
    const z0 = Math.max(mover.z0, t.z0), z1 = Math.min(mover.z1, t.z1);
    if (x1 <= x0 || z1 <= z0) return;
    const y = t.y + 1 - bounce * 0.3;
    poly([project(x0, y, z0), project(x1, y, z0), project(x1, y, z1), project(x0, y, z1)], "rgba(10,20,50,0.22)");
  }

  function drawParticles() {
    for (const p of particles) {
      const [x, y] = project(p.x, p.y, p.z);
      const a = clamp(p.life / p.max * 1.6, 0, 1);
      if (p.kind === "spark") {
        ctx.globalAlpha = a;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        const r = p.size * view.zoom;
        ctx.moveTo(x, y - r * 1.6); ctx.lineTo(x + r * 0.5, y); ctx.lineTo(x, y + r * 1.6); ctx.lineTo(x - r * 0.5, y);
        ctx.closePath(); ctx.fill();
      } else if (p.kind === "shard") {
        ctx.globalAlpha = a;
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(p.rot);
        ctx.fillStyle = rgb(mixRgb(hexRgb(p.color), [255, 255, 255], 0.4));
        const r = p.size * view.zoom;
        ctx.beginPath(); ctx.moveTo(-r, -r * 0.4); ctx.lineTo(r, -r * 0.7); ctx.lineTo(0, r); ctx.closePath(); ctx.fill();
        ctx.restore();
      } else {
        const grow = 1 + (1 - p.life / p.max) * 2;
        ctx.globalAlpha = a * 0.45;
        ctx.fillStyle = "#ffffff";
        ctx.beginPath(); ctx.arc(x, y, p.size * grow * view.zoom, 0, Math.PI * 2); ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
  }

  function drawPopups() {
    ctx.textAlign = "center";
    for (const p of popups) {
      const t = stack[stack.length - 1];
      const [, y] = project((t.x0 + t.x1) / 2, p.y, (t.z0 + t.z1) / 2);
      const a = clamp(p.life * 2, 0, 1);
      const pop = 1 + Math.max(0, p.life - 0.9) * 2;
      ctx.globalAlpha = a;
      ctx.font = `${Math.round(28 * pop)}px ${NUMFONT}`;
      ctx.lineWidth = 5;
      ctx.lineJoin = "round";
      ctx.strokeStyle = "rgba(10,14,40,0.55)";
      ctx.strokeText(p.text, W / 2, y - 34);
      ctx.fillStyle = p.color;
      ctx.fillText(p.text, W / 2, y - 34);
      if (p.sub) {
        ctx.font = `800 18px ${UIFONT}`;
        ctx.strokeText(p.sub, W / 2, y - 10);
        ctx.fillText(p.sub, W / 2, y - 10);
      }
    }
    ctx.globalAlpha = 1;
  }

  function draw(dt) {
    const n = stack ? stack.length : 1;
    [env.skyTop, env.skyBot] = skyAt(n);
    env.nf = nightAt(n);
    env.climb = view.level * th * view.zoom;

    drawSky(dt);
    if (!stack) return;

    ctx.save();
    if (shake > 0) ctx.translate(rand(-1, 1) * 10 * shake, rand(-1, 1) * 10 * shake);

    // Scenery below and behind the tower
    const islandVisible = project(0, 0, 0)[1] - ISLAND * s * view.zoom < H + 40;
    if (islandVisible) {
      drawIsland();
      for (const t of TREES) if (t.x + t.z < 0) drawTree(t);
      for (const nb of NEIGHBORS) drawBlock(nb, 0, nb.h, { look: NEIGHBOR });
    }
    drawBandClouds(false, dt);

    for (const dbr of debris) if (dbr.back) drawBlock(dbr, dbr.y, dbr.y + 1, { alpha: clamp(dbr.life, 0, 1) });
    const reach = (BLOCK_SIZE * s + th * 2) * view.zoom;
    stack.forEach((b, i) => {
      const [, y] = project(0, b.y, 0);
      if (y - reach > H || y + reach < 0) return; // off screen
      const isTop = i === stack.length - 1 && i > 0;
      drawBlock(b, b.y, b.y + 1 - (isTop ? bounce * 0.3 : 0));
    });
    drawLandingShadow();
    if (state === "over" && stack.length > 1) drawRoof(stack[stack.length - 1]);
    if (islandVisible) for (const t of TREES) if (t.x + t.z >= 0) drawTree(t);
    if (mover && state === "playing") drawBlock(mover, mover.y, mover.y + 1);
    for (const dbr of debris) if (!dbr.back) drawBlock(dbr, dbr.y, dbr.y + 1, { alpha: clamp(dbr.life, 0, 1) });

    if (flash > 0) {
      const t = stack[stack.length - 1], g = (1 - flash) * 2;
      const pts = [[t.x0 - g, t.z0 - g], [t.x1 + g, t.z0 - g], [t.x1 + g, t.z1 + g], [t.x0 - g, t.z1 + g]]
        .map(([x, z]) => project(x, t.y + 1, z));
      ctx.strokeStyle = t.golden ? `rgba(255,210,63,${flash})` : `rgba(255,255,255,${flash})`;
      ctx.lineWidth = 4 * flash + 1;
      ctx.beginPath();
      pts.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)));
      ctx.closePath();
      ctx.stroke();
    }
    drawBandClouds(true, dt);
    drawParticles();
    ctx.restore();

    drawWind(dt);
    drawPopups();

    // Soft vignette to focus the eye on the tower
    ctx.drawImage(vignette, 0, 0, W, H);
  }

  // ---------- Loop ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    update(dt);
    draw(dt);
    requestAnimationFrame(frame);
  }

  resize();
  reset();
  renderMenu();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
