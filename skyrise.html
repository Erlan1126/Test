<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Skyrise</title>
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    background: #0b1030;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    color: #fff;
  }
  canvas { display: block; width: 100%; height: 100%; }
  button { font-family: inherit; cursor: pointer; }
  button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  #share {
    position: fixed;
    left: 50%;
    bottom: calc(7% + env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%);
    padding: 15px 30px;
    border: 0;
    border-radius: 999px;
    background: #fff;
    color: #141a3a;
    font-size: 18px;
    font-weight: 800;
    white-space: nowrap;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
  }
  #mute {
    position: fixed;
    top: calc(12px + env(safe-area-inset-top, 0px));
    right: calc(12px + env(safe-area-inset-right, 0px));
    width: 44px;
    height: 44px;
    display: grid;
    place-items: center;
    padding: 0;
    border: 0;
    border-radius: 50%;
    background: rgba(0, 0, 0, 0.25);
    color: #fff;
  }
  #mute svg { width: 22px; height: 22px; }
  #styles {
    position: fixed;
    left: 50%;
    bottom: calc(17% + env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 4px;
    border-radius: 999px;
    background: rgba(0, 0, 0, 0.35);
    white-space: nowrap;
  }
  #styles button {
    width: 40px;
    height: 40px;
    border: 0;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.15);
    color: #fff;
    font-size: 22px;
    line-height: 1;
  }
  #style-name {
    min-width: 170px;
    text-align: center;
    font-size: 15px;
    font-weight: 700;
  }
  #style-name small { display: block; font-size: 11px; font-weight: 600; opacity: 0.8; }
  #toast {
    position: fixed;
    left: 50%;
    top: 45%;
    transform: translateX(-50%);
    max-width: 80vw;
    padding: 10px 16px;
    border-radius: 10px;
    background: rgba(0, 0, 0, 0.7);
    font-size: 14px;
    text-align: center;
  }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<button id="mute" aria-label="Mute sound"></button>
<div id="styles">
  <button id="style-prev" aria-label="Previous building style">‹</button>
  <div id="style-name" aria-live="polite"></div>
  <button id="style-next" aria-label="Next building style">›</button>
</div>
<button id="share" hidden>Challenge a friend</button>
<div id="toast" hidden></div>
<script>
(() => {
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const shareBtn = document.getElementById("share");
  const muteBtn = document.getElementById("mute");
  const stylesBar = document.getElementById("styles");
  const styleName = document.getElementById("style-name");
  const toast = document.getElementById("toast");

  // Link included in shared scores. Empty means "use this page's address".
  const SHARE_URL = "";

  // Gameplay is measured in world units, not pixels, so it plays the same on every screen.
  const BLOCK_SIZE = 10;      // starting width and depth of a floor
  const RANGE = 13;           // how far the sliding floor travels from the tower's center
  const PERFECT = 0.35;       // forgiveness for a perfect drop
  const GROW = 0.6;           // how much a floor grows back during a perfect streak
  const METERS_PER_FLOOR = 5;
  const PEOPLE_PER_AREA = 0.2; // a full 10 x 10 floor holds 20 people
  const WIND_START = 25;      // floor where gusts begin
  const ISO_X = Math.cos(Math.PI / 6), ISO_Y = 0.5;

  const MILESTONES = [
    { m: 15, name: "a house" },
    { m: 51, name: "Niagara Falls" },
    { m: 93, name: "the Statue of Liberty" },
    { m: 139, name: "the Great Pyramid" },
    { m: 184, name: "the Space Needle" },
    { m: 227, name: "the Golden Gate Bridge" },
    { m: 330, name: "the Eiffel Tower" },
    { m: 443, name: "the Empire State Building" },
    { m: 828, name: "the Burj Khalifa" },
  ];

  // Building styles. Each unlocks once your best tower passes a landmark.
  const STYLES = [
    { name: "Glass Tower", unlock: -1, floors: ["#4dabf7", "#3bc9db", "#5c7cfa", "#22b8cf", "#74c0fc"],
      window: "#e7f5ff", lit: ["#ffe8a3"], frame: 0.55 },
    { name: "Brick Block", unlock: 0, floors: ["#c0504d", "#d9734e", "#b5463f", "#cc6649", "#a8483d"],
      window: "#f1f3f5", lit: ["#ffd8a8"], frame: 0.5 },
    { name: "Candy Tower", unlock: 2, floors: ["#f783ac", "#8ce99a", "#faa2c1", "#a5d8ff", "#d0bfff"],
      window: "#ffffff", lit: ["#fff3bf"], frame: 0.7 },
    { name: "Neon Nights", unlock: 6, floors: ["#2b2350", "#3a2d6b", "#241d45", "#33295c"],
      window: "#495057", lit: ["#ff4fd8", "#3bf0ff", "#b6ff3b"], frame: 0.6, alwaysLit: true },
  ];
  const GOLD = "#ffd23f"; // reserved for penthouse floors

  // Sky colors (top, bottom) by tower height in floors: day, sunset, dusk, night.
  const SKY = [
    { at: 0, top: "#4ea8de", bottom: "#c8ecfb" },
    { at: 25, top: "#5b7fd1", bottom: "#ffd2a1" },
    { at: 45, top: "#5b3f8c", bottom: "#ff9a6b" },
    { at: 70, top: "#1d1a4a", bottom: "#7a3e74" },
    { at: 100, top: "#060a1c", bottom: "#1a1f4a" },
  ];

  // ---------- Small helpers ----------
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const hexRgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  const mixRgb = (a, b, t) => a.map((v, i) => lerp(v, b[i], t));
  const shade = (c, f) => `rgb(${c.map(v => clamp(Math.round(v * f), 0, 255)).join(",")})`;
  const hash = (a, b, c) => { const v = Math.sin(a * 12.9898 + b * 78.233 + c * 37.719) * 43758.5453; return v - Math.floor(v); };
  const fmt = n => n.toLocaleString("en-US");

  function load(key) {
    try { return localStorage.getItem(key); } catch { return null; }
  }
  function save(key, value) {
    try { localStorage.setItem(key, String(value)); } catch {}
  }

  // ---------- Sound (synthesized, no files needed) ----------
  const sound = (() => {
    let ac = null;
    let muted = load("skyriseMuted") === "1";
    const SCALE = [0, 2, 4, 7, 9];

    function ensure() {
      if (!ac) {
        try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch { return; }
      }
      if (ac.state === "suspended") ac.resume();
    }
    function tone(freq, dur, type = "sine", vol = 0.2, delay = 0, slideTo = 0) {
      if (muted || !ac) return;
      const t = ac.currentTime + delay;
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type;
      o.frequency.setValueAtTime(freq, t);
      if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g).connect(ac.destination);
      o.start(t);
      o.stop(t + dur + 0.05);
    }
    // Notes climb a pentatonic scale, so a perfect streak plays a rising tune.
    const note = i => 261.63 * Math.pow(2, (SCALE[i % 5] + 12 * Math.floor(i / 5)) / 12);

    return {
      ensure,
      get muted() { return muted; },
      toggle() { muted = !muted; save("skyriseMuted", muted ? "1" : "0"); },
      click() { tone(900, 0.05, "triangle", 0.08); },
      cut() { tone(200, 0.1, "triangle", 0.3, 0, 80); tone(120, 0.18, "square", 0.04, 0.02, 50); },
      perfect(combo) {
        const f = note(Math.min(combo - 1, 11) + 3);
        tone(f, 0.3, "triangle", 0.22);
        tone(f * 2, 0.2, "sine", 0.06, 0.02);
      },
      golden() { [0, 4, 7, 12, 16].forEach((s, i) => tone(784 * Math.pow(2, s / 12), 0.2, "triangle", 0.12, i * 0.045)); },
      milestone() { [0, 4, 7, 12].forEach((s, i) => tone(523 * Math.pow(2, s / 12), 0.35, "triangle", 0.14, i * 0.09)); },
      wind() { tone(140, 1.2, "sawtooth", 0.025, 0, 320); },
      fail() { tone(260, 0.6, "sawtooth", 0.06, 0, 60); tone(130, 0.5, "triangle", 0.2, 0.05, 50); },
    };
  })();

  const ICON_ON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z" fill="currentColor"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
  const ICON_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z" fill="currentColor"/><path d="m16 9 6 6"/><path d="m22 9-6 6"/></svg>';
  function renderMute() {
    muteBtn.innerHTML = sound.muted ? ICON_OFF : ICON_ON;
    muteBtn.setAttribute("aria-label", sound.muted ? "Turn sound on" : "Mute sound");
  }
  muteBtn.addEventListener("click", () => { sound.toggle(); sound.ensure(); renderMute(); muteBtn.blur(); });
  renderMute();

  // ---------- Building styles ----------
  let bestMeters = Number(load("skyriseBestMeters")) || 0;
  let styleIndex = clamp(Number(load("skyriseStyle")) || 0, 0, STYLES.length - 1);
  const isUnlocked = st => st.unlock < 0 || bestMeters > MILESTONES[st.unlock].m;
  if (!isUnlocked(STYLES[styleIndex])) styleIndex = 0;
  let style = STYLES[styleIndex];

  function renderStyle() {
    const st = STYLES[styleIndex];
    styleName.innerHTML = isUnlocked(st)
      ? `${st.name}<small>Building style ${styleIndex + 1} of ${STYLES.length}</small>`
      : `Locked<small>Build taller than ${MILESTONES[st.unlock].name}</small>`;
    if (isUnlocked(st)) {
      style = st;
      save("skyriseStyle", styleIndex);
      // Repaint the tower on screen in the chosen style.
      if (stack && state !== "playing") stack.forEach(b => { if (!b.golden) b.color = colorAt(b.y); });
    }
  }
  function changeStyle(d) {
    sound.ensure();
    sound.click();
    styleIndex = (styleIndex + d + STYLES.length) % STYLES.length;
    renderStyle();
  }
  document.getElementById("style-prev").addEventListener("click", e => { changeStyle(-1); e.currentTarget.blur(); });
  document.getElementById("style-next").addEventListener("click", e => { changeStyle(1); e.currentTarget.blur(); });

  // ---------- Screen and camera ----------
  let W = 0, H = 0, s = 1, th = 1;
  const view = { zoom: 1, level: 0, originY: 0 };

  function resize() {
    const dpr = window.devicePixelRatio || 1;
    W = canvas.clientWidth;
    H = canvas.clientHeight;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    // A full floor is about 17.3 units wide on screen; size it to the smaller screen dimension.
    s = Math.min(W * 0.58, H * 0.38) / (BLOCK_SIZE * 2 * ISO_X);
    th = s * 1.3;
    if (!view.originY) view.originY = H * 0.62;
  }
  window.addEventListener("resize", resize);

  function project(x, y, z) {
    return [
      W / 2 + (x - z) * ISO_X * s * view.zoom,
      view.originY + ((x + z) * ISO_Y * s - (y - view.level) * th) * view.zoom,
    ];
  }

  // ---------- Game state ----------
  let state = "menu"; // menu | playing | over
  let stack, mover, debris, particles, popups, banner;
  let score, combo, best = Number(load("skyriseBest")) || 0, time;
  let bounce, flash, overAt, overReady, newBest, lastMilestone, shareBlob, unlockedNow, windWarned;

  const level = () => stack.length - 1;
  const meters = () => level() * METERS_PER_FLOOR;
  const windAt = n => clamp((n - WIND_START) / 30, 0, 1);
  const people = b => Math.round((b.x1 - b.x0) * (b.z1 - b.z0) * PEOPLE_PER_AREA);

  function colorAt(n) {
    const f = style.floors, i = Math.floor(n / 5), t = (n % 5) / 5;
    return mixRgb(hexRgb(f[i % f.length]), hexRgb(f[(i + 1) % f.length]), t);
  }

  function reset() {
    const h = BLOCK_SIZE / 2;
    stack = [{ x0: -h, x1: h, z0: -h, z1: h, y: 0, color: colorAt(0) }];
    debris = []; particles = []; popups = []; banner = null;
    score = 0; combo = 0; bounce = 0; flash = 0; time = 0;
    overReady = false; newBest = false; lastMilestone = -1; shareBlob = null;
    unlockedNow = null; windWarned = false;
    newMover();
  }

  function newMover() {
    const top = stack[stack.length - 1];
    const n = stack.length;
    const axis = n % 2 ? "x" : "z";
    const golden = n >= 6 && !top.golden && Math.random() < 0.14;
    mover = {
      x0: top.x0, x1: top.x1, z0: top.z0, z1: top.z1, y: n,
      axis, dir: 1, golden,
      speed: Math.min(20, 8 + n * 0.28) * (golden ? 1.35 : 1),
      gustPhase: Math.random() * Math.PI * 2,
      color: golden ? hexRgb(GOLD) : colorAt(n),
    };
    mover[axis + "0"] -= RANGE;
    mover[axis + "1"] -= RANGE;
    if (!windWarned && windAt(n) > 0) {
      windWarned = true;
      banner = { text: "Windy up here! Watch the gusts", life: 2.6 };
      sound.wind();
    }
  }

  function drop() {
    const top = stack[stack.length - 1];
    const m = mover;
    const a0 = m.axis + "0", a1 = m.axis + "1";
    const lo = Math.max(m[a0], top[a0]);
    const hi = Math.min(m[a1], top[a1]);

    if (hi <= lo) {
      debris.push({ ...m, vy: 0, life: 1, back: m[a0] < top[a0] });
      mover = null;
      gameOver();
      return;
    }

    const placed = { x0: m.x0, x1: m.x1, z0: m.z0, z1: m.z1, y: m.y, color: m.color, golden: m.golden };
    let points;

    if (Math.abs(m[a0] - top[a0]) <= PERFECT) {
      combo++;
      placed[a0] = top[a0];
      placed[a1] = top[a1];
      if (combo >= 3) {
        const grow = Math.min(GROW, BLOCK_SIZE - (top[a1] - top[a0]));
        placed[a0] -= grow / 2;
        placed[a1] += grow / 2;
      }
      // Perfect floors attract more people; penthouses even more.
      points = Math.round(people(placed) * (m.golden ? 5 : 1.5));
      flash = 1;
      sparkle(placed, m.golden ? 40 : 18, m.golden ? GOLD : "#ffffff");
      popups.push({
        text: m.golden ? `PENTHOUSE! +${points}` : combo > 1 ? `PERFECT x${combo} +${points}` : `PERFECT +${points}`,
        y: m.y + 1, life: 1.1, color: m.golden ? GOLD : "#ffffff",
      });
      if (m.golden) sound.golden(); else sound.perfect(combo);
      vibrate(m.golden ? [20, 30, 20] : 20);
    } else {
      combo = 0;
      placed[a0] = lo;
      placed[a1] = hi;
      points = people(placed);
      popups.push({ text: `+${points}`, y: m.y + 1, life: 0.8, color: "#ffffff" });
      // The part hanging over the edge breaks off and falls.
      const piece = { ...m, vy: 0, life: 1 };
      if (m[a0] < top[a0]) { piece[a1] = top[a0]; piece.back = true; }
      else { piece[a0] = top[a1]; piece.back = false; }
      debris.push(piece);
      sound.cut();
      vibrate(8);
    }

    stack.push(placed);
    score += points;
    bounce = 1;
    checkMilestone();
    newMover();
  }

  function checkMilestone() {
    let reached = -1;
    MILESTONES.forEach((ms, i) => { if (meters() > ms.m) reached = i; });
    if (reached > lastMilestone) {
      lastMilestone = reached;
      banner = { text: `Taller than ${MILESTONES[reached].name}!`, life: 2.6 };
      setTimeout(() => sound.milestone(), 120);
    }
  }

  function sparkle(b, n, color) {
    for (let i = 0; i < n; i++) {
      const edge = Math.random();
      const onX = Math.random() < 0.5;
      const x = onX ? lerp(b.x0, b.x1, edge) : (Math.random() < 0.5 ? b.x0 : b.x1);
      const z = onX ? (Math.random() < 0.5 ? b.z0 : b.z1) : lerp(b.z0, b.z1, edge);
      particles.push({
        x, z, y: b.y + 1,
        vx: (x - (b.x0 + b.x1) / 2) * 0.4, vz: (z - (b.z0 + b.z1) / 2) * 0.4,
        vy: 1 + Math.random() * 2, life: 0.5 + Math.random() * 0.5, color,
      });
    }
  }

  function gameOver() {
    state = "over";
    overAt = performance.now();
    combo = 0;
    if (score > best) { best = score; newBest = true; save("skyriseBest", best); }
    if (meters() > bestMeters) {
      const before = STYLES.filter(isUnlocked).length;
      bestMeters = meters();
      save("skyriseBestMeters", bestMeters);
      const unlocked = STYLES.filter(isUnlocked);
      if (unlocked.length > before) {
        // Switch to the newest style right away so the next tower shows it off.
        unlockedNow = unlocked[unlocked.length - 1];
        styleIndex = STYLES.indexOf(unlockedNow);
      }
    }
    sound.fail();
    vibrate([40, 40, 90]);
  }

  function vibrate(p) {
    try { if (navigator.vibrate) navigator.vibrate(p); } catch {}
  }

  // ---------- Input: one tap does everything ----------
  function start() {
    if (!isUnlocked(STYLES[styleIndex])) {
      showToast(`Locked. Build taller than ${MILESTONES[STYLES[styleIndex].unlock].name} to unlock it.`);
      return;
    }
    shareBtn.hidden = true;
    stylesBar.hidden = true;
    reset();
    state = "playing";
  }
  function tap() {
    sound.ensure();
    if (state === "menu") start();
    else if (state === "playing") drop();
    else if (state === "over" && overReady) start();
  }
  canvas.addEventListener("pointerdown", e => { e.preventDefault(); tap(); });
  window.addEventListener("keydown", e => {
    if (e.target instanceof HTMLButtonElement) return;
    if (e.code === "Space" || e.code === "Enter") { e.preventDefault(); if (!e.repeat) tap(); }
    if (state !== "playing" && e.code === "ArrowLeft") changeStyle(-1);
    if (state !== "playing" && e.code === "ArrowRight") changeStyle(1);
  });

  // ---------- Sharing ----------
  function shareText() {
    const ms = lastMilestone >= 0 ? `, taller than ${MILESTONES[lastMilestone].name}` : "";
    return `My Skyrise tower is ${meters()} m tall${ms}, with ${fmt(score)} people living in it 🏙️ Can you build a bigger one?`;
  }
  shareBtn.addEventListener("click", async () => {
    const url = SHARE_URL || location.href.split("#")[0];
    const text = shareText();
    try {
      if (shareBlob && navigator.canShare) {
        const file = new File([shareBlob], "skyrise.png", { type: "image/png" });
        if (navigator.canShare({ files: [file] })) {
          await navigator.share({ files: [file], text: `${text} ${url}` });
          return;
        }
      }
      if (navigator.share) { await navigator.share({ title: "Skyrise", text, url }); return; }
    } catch (e) {
      if (e.name === "AbortError") return; // user closed the share sheet
    }
    try {
      await navigator.clipboard.writeText(`${text} ${url}`);
      showToast("Copied! Paste it to a friend");
    } catch {
      showToast(`${text} ${url}`);
    }
  });
  function showToast(msg) {
    toast.textContent = msg;
    toast.hidden = false;
    clearTimeout(showToast.t);
    showToast.t = setTimeout(() => { toast.hidden = true; }, 2600);
  }

  // ---------- Update ----------
  function update(dt) {
    time += dt;
    if (state === "playing" && mover) {
      const a0 = mover.axis + "0", a1 = mover.axis + "1";
      const top = stack[stack.length - 1];
      // Gusts make the floor speed up and slow down unpredictably up high.
      const w = windAt(mover.y);
      const gust = 1 + w * 0.55 * Math.sin(time * 2.3 + mover.gustPhase) * Math.sin(time * 0.9 + mover.gustPhase * 2);
      const step = mover.dir * mover.speed * gust * dt;
      mover[a0] += step;
      mover[a1] += step;
      const offset = mover[a0] - top[a0];
      if (offset > RANGE) mover.dir = -1;
      if (offset < -RANGE) mover.dir = 1;
    }

    // Camera: follow the top while playing, zoom out to show the whole tower at game over.
    let tZoom = 1, tLevel = Math.max(0, level() - Math.floor(H * 0.2 / th)), tOrigin = H * 0.62;
    if (state === "over") {
      const towerPx = (level() + 5) * th + BLOCK_SIZE * 2 * ISO_Y * s;
      tZoom = Math.min(1, H * 0.4 / towerPx);
      tLevel = 0;
      tOrigin = H * 0.8;
    }
    const k = Math.min(1, dt * (state === "over" ? 3 : 6));
    view.zoom = lerp(view.zoom, tZoom, k);
    view.level = lerp(view.level, tLevel, k);
    view.originY = lerp(view.originY, tOrigin, k);

    if (state === "over" && !overReady && performance.now() - overAt > 900) {
      overReady = true;
      shareBtn.hidden = false;
      stylesBar.hidden = false;
      renderStyle();
      // Snapshot the next frame (which shows "Tap to play again") for the share picture.
      requestAnimationFrame(() => canvas.toBlob(b => { shareBlob = b; }));
    }

    bounce = Math.max(0, bounce - dt * 6);
    flash = Math.max(0, flash - dt * 2.5);
    for (const d of debris) { d.vy += 30 * dt; d.y -= d.vy * dt; d.life -= dt * 0.8; }
    debris = debris.filter(d => d.life > 0);
    for (const p of particles) {
      p.x += p.vx * dt; p.z += p.vz * dt; p.y += p.vy * dt;
      p.vy -= 3 * dt; p.life -= dt;
    }
    particles = particles.filter(p => p.life > 0);
    for (const p of popups) { p.life -= dt; p.y += dt * 1.2; }
    popups = popups.filter(p => p.life > 0);
    if (banner) { banner.life -= dt; if (banner.life <= 0) banner = null; }
  }

  // ---------- Draw ----------
  const stars = Array.from({ length: 90 }, () => ({ x: Math.random(), y: Math.random(), r: Math.random() * 1.4 + 0.3 }));
  const clouds = Array.from({ length: 5 }, (_, i) => ({ x: Math.random(), y: 0.1 + i * 0.13, w: 0.25 + Math.random() * 0.2, v: 0.006 + Math.random() * 0.01 }));
  const streaks = Array.from({ length: 14 }, () => ({ x: Math.random(), y: Math.random(), len: 0.08 + Math.random() * 0.15, v: 0.6 + Math.random() * 0.8 }));

  function skyAt(n) {
    let i = 0;
    while (i < SKY.length - 2 && n > SKY[i + 1].at) i++;
    const a = SKY[i], b = SKY[i + 1];
    const t = clamp((n - a.at) / (b.at - a.at), 0, 1);
    return [mixRgb(hexRgb(a.top), hexRgb(b.top), t), mixRgb(hexRgb(a.bottom), hexRgb(b.bottom), t)];
  }
  const nightAt = n => clamp((n - 50) / 40, 0, 1);

  function drawSky(dt) {
    const n = stack ? stack.length : 0;
    const [top, bottom] = skyAt(n);
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, shade(top, 1));
    g.addColorStop(1, shade(bottom, 1));
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    const night = nightAt(n);
    if (night > 0) {
      ctx.fillStyle = "#ffffff";
      for (const st of stars) {
        ctx.globalAlpha = night * (0.5 + 0.5 * Math.sin(performance.now() / 600 + st.x * 40));
        ctx.fillRect(st.x * W, st.y * H * 0.8, st.r, st.r);
      }
    }
    const day = clamp(1 - n / 45, 0, 1);
    if (day > 0) {
      ctx.fillStyle = "#ffffff";
      for (const c of clouds) {
        c.x += c.v * dt;
        if (c.x > 1.3) c.x = -0.4;
        ctx.globalAlpha = day * 0.55;
        const cx = c.x * W, cy = c.y * H, cw = c.w * Math.min(W, 520);
        ctx.beginPath();
        ctx.ellipse(cx, cy, cw * 0.5, cw * 0.12, 0, 0, Math.PI * 2);
        ctx.ellipse(cx - cw * 0.15, cy - cw * 0.08, cw * 0.22, cw * 0.13, 0, 0, Math.PI * 2);
        ctx.ellipse(cx + cw * 0.12, cy - cw * 0.06, cw * 0.18, cw * 0.11, 0, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    const wind = state === "playing" ? windAt(n) : 0;
    if (wind > 0) {
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 2;
      ctx.lineCap = "round";
      for (const st of streaks) {
        st.x += st.v * dt * (0.6 + wind);
        if (st.x > 1.2) { st.x = -0.3; st.y = Math.random(); }
        ctx.globalAlpha = wind * 0.3;
        ctx.beginPath();
        ctx.moveTo(st.x * W, st.y * H);
        ctx.lineTo((st.x + st.len) * W, st.y * H);
        ctx.stroke();
      }
    }
    ctx.globalAlpha = 1;
  }

  function poly(points, fill) {
    ctx.fillStyle = fill;
    ctx.beginPath();
    points.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)));
    ctx.closePath();
    ctx.fill();
  }

  // Windows along one visible face of a floor. The face runs along `axis` at the fixed
  // coordinate `at`; windows stay put in the world so cutting a floor keeps them aligned.
  function drawWindows(b, axis, at, y, top, night, faceShade, faceId) {
    const lo = axis === "x" ? b.x0 : b.z0, hi = axis === "x" ? b.x1 : b.z1;
    const ya = y + 0.3, yb = Math.min(y + 0.78, top - 0.08);
    if (yb <= ya) return;
    const first = Math.ceil((lo + 0.45) / 1.6 - 0.5);
    for (let i = first; (i + 0.5) * 1.6 + 0.45 <= hi; i++) {
      const c = (i + 0.5) * 1.6;
      const p = (u, yy) => axis === "x" ? project(u, yy, at) : project(at, yy, u);
      const r = hash(y, faceId, i);
      let color;
      if (style.alwaysLit || r < night * 0.8) {
        color = style.lit[Math.floor(r * 97) % style.lit.length];
      } else {
        color = shade(mixRgb(hexRgb(style.window), [20, 30, 60], night * 0.85), faceShade);
      }
      poly([p(c - 0.45, yb), p(c + 0.45, yb), p(c + 0.45, ya), p(c - 0.45, ya)], color);
    }
  }

  // An isometric floor: the top face plus the two faces turned toward the viewer, with windows.
  function drawFloor(b, y0, y1, alpha = 1, withWindows = true) {
    const c = b.color;
    const A = project(b.x0, y1, b.z0), B = project(b.x1, y1, b.z0);
    const C = project(b.x1, y1, b.z1), D = project(b.x0, y1, b.z1);
    const Bb = project(b.x1, y0, b.z0), Cb = project(b.x1, y0, b.z1), Db = project(b.x0, y0, b.z1);
    ctx.globalAlpha = alpha;
    poly([D, C, Cb, Db], shade(c, 0.86));
    poly([B, C, Cb, Bb], shade(c, 0.7));
    poly([A, B, C, D], shade(c, 1.1));

    if (withWindows) {
      const night = nightAt(stack.length);
      // Skip floors far below the camera; they are off screen.
      const from = Math.max(Math.ceil(y0), Math.floor(view.level) - 14);
      for (let fy = from; fy < y1; fy++) {
        drawWindows(b, "x", b.z1, fy, y1, night, 0.95, 1);
        drawWindows(b, "z", b.x1, fy, y1, night, 0.8, 2);
        // A thin slab between floors
        poly([project(b.x0, fy + 0.1, b.z1), project(b.x1, fy + 0.1, b.z1), project(b.x1, fy + 0.1, b.z0),
              project(b.x1, fy, b.z0), project(b.x1, fy, b.z1), project(b.x0, fy, b.z1)], shade(c, style.frame));
      }
    }
    if (b.golden) {
      // A shine that sweeps across penthouse floors
      const t = (performance.now() / 900) % 1.6 - 0.3;
      if (t > 0 && t < 1) {
        const x = lerp(b.x0, b.x1, t), x2 = Math.min(b.x1, x + 1.2);
        poly([project(x, y1, b.z0), project(x2, y1, b.z0), project(x2, y1, b.z1), project(x, y1, b.z1)], "rgba(255,255,255,0.45)");
      }
    }
    ctx.globalAlpha = 1;
  }

  // A rooftop and blinking antenna, so the finished tower looks like a real skyscraper.
  function drawRoof(t) {
    const cx = (t.x0 + t.x1) / 2, cz = (t.z0 + t.z1) / 2;
    const hw = Math.min(1.6, (t.x1 - t.x0) / 3), hd = Math.min(1.6, (t.z1 - t.z0) / 3);
    drawFloor({ x0: cx - hw, x1: cx + hw, z0: cz - hd, z1: cz + hd, y: t.y + 1, color: [173, 181, 189] }, t.y + 1, t.y + 1.6, 1, false);
    const [bx, by] = project(cx, t.y + 1.6, cz), [tx, ty] = project(cx, t.y + 4, cz);
    ctx.strokeStyle = "#dee2e6";
    ctx.lineWidth = Math.max(1.5, 3 * view.zoom);
    ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(tx, ty); ctx.stroke();
    const on = Math.floor(performance.now() / 500) % 2 === 0;
    ctx.fillStyle = on ? "#ff3b3b" : "#7a1f1f";
    ctx.beginPath(); ctx.arc(tx, ty, Math.max(2.5, 5 * view.zoom), 0, Math.PI * 2); ctx.fill();
  }

  function text(str, x, y, size, weight = 800, color = "#fff", alpha = 1) {
    const font = px => `${weight} ${px}px system-ui, -apple-system, "Segoe UI", sans-serif`;
    ctx.globalAlpha = alpha;
    ctx.font = font(size);
    // Shrink long lines so they always fit on narrow phones.
    const fit = (W - 32) / ctx.measureText(str).width;
    if (fit < 1) ctx.font = font(Math.floor(size * fit));
    ctx.textAlign = "center";
    ctx.shadowColor = "rgba(0,0,0,0.4)";
    ctx.shadowBlur = 8;
    ctx.fillStyle = color;
    ctx.fillText(str, x, y);
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
  }

  function nextMilestone() {
    return MILESTONES.find(ms => ms.m >= meters());
  }

  function draw(dt) {
    drawSky(dt);
    if (!stack) return;

    for (const d of debris) if (d.back) drawFloor(d, d.y, d.y + 1, d.life);
    stack.forEach((b, i) => {
      const isTop = i === stack.length - 1 && i > 0;
      const squish = isTop ? bounce * 0.3 : 0;
      drawFloor(b, i === 0 ? -60 : b.y, b.y + 1 - squish);
    });
    if (state === "over" && stack.length > 1) drawRoof(stack[stack.length - 1]);
    if (mover && state === "playing") drawFloor(mover, mover.y, mover.y + 1);
    for (const d of debris) if (!d.back) drawFloor(d, d.y, d.y + 1, d.life);

    if (flash > 0) {
      const t = stack[stack.length - 1], g = (1 - flash) * 1.6;
      const pts = [[t.x0 - g, t.z0 - g], [t.x1 + g, t.z0 - g], [t.x1 + g, t.z1 + g], [t.x0 - g, t.z1 + g]]
        .map(([x, z]) => project(x, t.y + 1, z));
      ctx.strokeStyle = `rgba(255,255,255,${flash})`;
      ctx.lineWidth = 3;
      ctx.beginPath();
      pts.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)));
      ctx.closePath();
      ctx.stroke();
    }
    for (const p of particles) {
      const [x, y] = project(p.x, p.y, p.z);
      ctx.globalAlpha = clamp(p.life * 2, 0, 1);
      ctx.fillStyle = p.color;
      ctx.fillRect(x - 2, y - 2, 4, 4);
    }
    ctx.globalAlpha = 1;
    for (const p of popups) {
      const t = stack[stack.length - 1];
      const [, y] = project((t.x0 + t.x1) / 2, p.y, (t.z0 + t.z1) / 2);
      text(p.text, W / 2, y - 30, 20, 900, p.color, clamp(p.life * 2, 0, 1));
    }

    const top = Math.max(16, H * 0.04);
    if (state === "playing") {
      text(fmt(score), W / 2, top + 56, 60, 900);
      text(`people · ${meters()} m`, W / 2, top + 86, 18, 700, "#fff", 0.9);
      const next = nextMilestone();
      if (next) text(`Next: ${next.name}, ${next.m} m`, W / 2, top + 110, 14, 600, "#fff", 0.8);
      if (banner) {
        const a = clamp(banner.life, 0, 1) * clamp((2.6 - banner.life) * 4, 0, 1);
        text(banner.text, W / 2, top + 150, 26, 900, GOLD, a);
      }
    } else if (state === "menu") {
      const y = top + H * 0.12;
      text("SKYRISE", W / 2, y, Math.min(72, W / 5), 900);
      text("Build the tallest skyscraper in the world", W / 2, y + 40, 18, 700, "#fff", 0.95);
      text("Tap to drop each floor.", W / 2, y + 72, 15, 500, "#fff", 0.92);
      text("Wider floors fit more people. Perfect drops keep them wide.", W / 2, y + 94, 15, 500, "#fff", 0.92);
      text("Gold penthouses are fast, but worth 5x the people.", W / 2, y + 116, 15, 500, "#fff", 0.92);
      if (best) text(`Best: ${fmt(best)} people`, W / 2, y + 148, 16, 700, GOLD);
      const pulse = 0.55 + Math.sin(performance.now() / 300) * 0.45;
      text("TAP TO START", W / 2, H * 0.92, 20, 800, "#fff", pulse);
    } else if (state === "over") {
      text(fmt(score), W / 2, top + 64, 64, 900);
      text(`people live in your ${meters()} m tower`, W / 2, top + 94, 17, 700);
      if (lastMilestone >= 0) text(`Taller than ${MILESTONES[lastMilestone].name}`, W / 2, top + 118, 15, 600, "#fff", 0.9);
      text(newBest ? "NEW BEST!" : `Best: ${fmt(best)}`, W / 2, top + 146, 18, 800, GOLD);
      if (unlockedNow) text(`New style unlocked: ${unlockedNow.name}!`, W / 2, top + 172, 16, 800, "#8ce99a");
      if (overReady) text("Tap to play again", W / 2, top + (unlockedNow ? 198 : 174), 16, 600, "#fff", 0.85);
    }
  }

  // ---------- Loop ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    update(dt);
    draw(dt);
    requestAnimationFrame(frame);
  }

  resize();
  renderStyle();
  reset();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
