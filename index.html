<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Star Defender</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #05060f;
    overflow: hidden;
    touch-action: none;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    color: #e8ecff;
  }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
(() => {
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");

  let W = 0, H = 0, DPR = 1;
  function resize() {
    DPR = window.devicePixelRatio || 1;
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    if (player) player.y = H - 70;
  }
  window.addEventListener("resize", resize);

  // ---------- Persistence ----------
  function loadBest() {
    try { return Number(localStorage.getItem("starDefenderBest")) || 0; } catch { return 0; }
  }
  function saveBest(v) {
    try { localStorage.setItem("starDefenderBest", String(v)); } catch {}
  }

  // ---------- Input ----------
  const keys = {};
  let pointerX = null;
  window.addEventListener("keydown", e => {
    keys[e.code] = true;
    if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", "Space"].includes(e.code)) e.preventDefault();
    if (e.code === "Enter" || e.code === "Space") startOrResume();
    if (e.code === "KeyP" || e.code === "Escape") togglePause();
  });
  window.addEventListener("keyup", e => { keys[e.code] = false; });
  canvas.addEventListener("pointerdown", e => { pointerX = e.clientX; startOrResume(); });
  canvas.addEventListener("pointermove", e => { if (e.buttons || e.pointerType === "touch") pointerX = e.clientX; });
  canvas.addEventListener("pointerup", () => { pointerX = null; });
  canvas.addEventListener("pointercancel", () => { pointerX = null; });

  // ---------- State ----------
  let state = "menu"; // menu | playing | paused | over
  let player, bullets, enemies, enemyBullets, particles, powerups, stars;
  let score, best = loadBest(), lives, level, time, spawnTimer, shake;

  function makeStars() {
    stars = [];
    for (let i = 0; i < 140; i++) {
      stars.push({ x: Math.random() * W, y: Math.random() * H, z: Math.random() * 0.8 + 0.2 });
    }
  }

  function reset() {
    player = { x: W / 2, y: H - 70, r: 16, cooldown: 0, invuln: 2, spread: 0, rapid: 0, shield: 0 };
    bullets = []; enemies = []; enemyBullets = []; particles = []; powerups = [];
    score = 0; lives = 3; level = 1; time = 0; spawnTimer = 1; shake = 0;
  }

  function startOrResume() {
    if (state === "menu" || state === "over") { reset(); state = "playing"; }
    else if (state === "paused") state = "playing";
  }
  function togglePause() {
    if (state === "playing") state = "paused";
    else if (state === "paused") state = "playing";
  }
  window.addEventListener("blur", () => { if (state === "playing") state = "paused"; });

  // ---------- Spawning ----------
  const ENEMY_TYPES = {
    rock:    { r: 18, hp: 2, speed: 90,  score: 10, color: "#9aa3b8" },
    fighter: { r: 15, hp: 1, speed: 150, score: 25, color: "#ff5d73" },
    tank:    { r: 26, hp: 6, speed: 55,  score: 60, color: "#ffb347" },
  };

  function spawnEnemy() {
    const roll = Math.random();
    let type = "rock";
    if (level >= 2 && roll < 0.35) type = "fighter";
    if (level >= 3 && roll < 0.12) type = "tank";
    const t = ENEMY_TYPES[type];
    enemies.push({
      type, x: t.r + Math.random() * (W - t.r * 2), y: -t.r,
      r: t.r, hp: t.hp + Math.floor(level / 4), maxHp: t.hp + Math.floor(level / 4),
      speed: t.speed * (1 + level * 0.06), phase: Math.random() * Math.PI * 2,
      fire: 1 + Math.random() * 2, spin: (Math.random() - 0.5) * 2, angle: 0,
    });
  }

  function burst(x, y, color, n = 14, speed = 180) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, s = Math.random() * speed;
      particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.4 + Math.random() * 0.4, color });
    }
  }

  // ---------- Update ----------
  function hurtPlayer() {
    if (player.invuln > 0) return;
    if (player.shield > 0) { player.shield = 0; player.invuln = 1; burst(player.x, player.y, "#6ee7ff", 20); return; }
    lives--;
    shake = 0.4;
    burst(player.x, player.y, "#7cf", 40, 260);
    player.invuln = 2; player.spread = 0; player.rapid = 0;
    if (lives <= 0) {
      state = "over";
      if (score > best) { best = score; saveBest(best); }
    }
  }

  function update(dt) {
    for (const s of stars) {
      s.y += s.z * (state === "playing" ? 120 : 40) * dt;
      if (s.y > H) { s.y = 0; s.x = Math.random() * W; }
    }
    for (const p of particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.96; p.vy *= 0.96; p.life -= dt; }
    particles = particles.filter(p => p.life > 0);
    if (state !== "playing") return;

    time += dt;
    level = 1 + Math.floor(time / 25);
    shake = Math.max(0, shake - dt);

    // Player movement
    const speed = 380;
    let dx = 0;
    if (keys.ArrowLeft || keys.KeyA) dx -= 1;
    if (keys.ArrowRight || keys.KeyD) dx += 1;
    if (dx) player.x += dx * speed * dt;
    else if (pointerX !== null) player.x += Math.max(-speed * 1.6 * dt, Math.min(speed * 1.6 * dt, pointerX - player.x));
    player.x = Math.max(player.r, Math.min(W - player.r, player.x));
    player.invuln = Math.max(0, player.invuln - dt);
    player.spread = Math.max(0, player.spread - dt);
    player.rapid = Math.max(0, player.rapid - dt);
    player.shield = Math.max(0, player.shield - dt);

    // Auto-fire
    player.cooldown -= dt;
    if (player.cooldown <= 0) {
      player.cooldown = player.rapid > 0 ? 0.09 : 0.2;
      const angles = player.spread > 0 ? [-0.25, 0, 0.25] : [0];
      for (const a of angles) bullets.push({ x: player.x, y: player.y - 18, vx: Math.sin(a) * 600, vy: -Math.cos(a) * 600 });
    }
    for (const b of bullets) { b.x += b.vx * dt; b.y += b.vy * dt; }
    bullets = bullets.filter(b => b.y > -10 && b.x > -10 && b.x < W + 10);

    // Enemies
    spawnTimer -= dt;
    if (spawnTimer <= 0) { spawnEnemy(); spawnTimer = Math.max(0.25, 1.1 - level * 0.08) * (0.6 + Math.random() * 0.8); }
    for (const e of enemies) {
      e.y += e.speed * dt;
      e.angle += e.spin * dt;
      if (e.type === "fighter") {
        e.phase += dt * 3;
        e.x += Math.sin(e.phase) * 120 * dt;
      }
      if (e.type !== "rock") {
        e.fire -= dt;
        if (e.fire <= 0 && e.y > 0 && e.y < H * 0.7) {
          e.fire = e.type === "tank" ? 1.4 : 2.2;
          const a = Math.atan2(player.y - e.y, player.x - e.x);
          enemyBullets.push({ x: e.x, y: e.y, vx: Math.cos(a) * 220, vy: Math.sin(a) * 220 });
        }
      }
    }

    // Bullet vs enemy
    for (const b of bullets) {
      for (const e of enemies) {
        if (e.hp > 0 && Math.hypot(b.x - e.x, b.y - e.y) < e.r + 3) {
          b.y = -100; e.hp--;
          burst(b.x, b.y + 100, "#fff6a0", 3, 80);
          if (e.hp <= 0) {
            score += ENEMY_TYPES[e.type].score * level;
            burst(e.x, e.y, ENEMY_TYPES[e.type].color, 22);
            if (Math.random() < 0.12) {
              const kinds = ["spread", "rapid", "shield", "life"];
              powerups.push({ x: e.x, y: e.y, kind: kinds[Math.floor(Math.random() * kinds.length)], t: 0 });
            }
          }
          break;
        }
      }
    }
    bullets = bullets.filter(b => b.y > -10);

    // Enemy vs player / off-screen
    for (const e of enemies) {
      if (e.hp > 0 && Math.hypot(e.x - player.x, e.y - player.y) < e.r + player.r - 4) {
        e.hp = 0; burst(e.x, e.y, ENEMY_TYPES[e.type].color, 22); hurtPlayer();
      }
    }
    enemies = enemies.filter(e => e.hp > 0 && e.y < H + e.r);

    for (const b of enemyBullets) {
      b.x += b.vx * dt; b.y += b.vy * dt;
      if (Math.hypot(b.x - player.x, b.y - player.y) < player.r - 4) { b.y = H + 100; hurtPlayer(); }
    }
    enemyBullets = enemyBullets.filter(b => b.y < H + 10 && b.y > -10 && b.x > -10 && b.x < W + 10);

    // Power-ups
    for (const p of powerups) {
      p.y += 110 * dt; p.t += dt;
      if (Math.hypot(p.x - player.x, p.y - player.y) < player.r + 14) {
        if (p.kind === "spread") player.spread = 10;
        if (p.kind === "rapid") player.rapid = 10;
        if (p.kind === "shield") player.shield = 15;
        if (p.kind === "life") lives = Math.min(5, lives + 1);
        burst(p.x, p.y, POWER_COLORS[p.kind], 16);
        p.y = H + 100;
      }
    }
    powerups = powerups.filter(p => p.y < H + 20);
  }

  // ---------- Draw ----------
  const POWER_COLORS = { spread: "#b48cff", rapid: "#ffe066", shield: "#6ee7ff", life: "#7dffa1" };
  const POWER_LABELS = { spread: "S", rapid: "R", shield: "O", life: "+" };

  function drawShip(x, y) {
    ctx.save();
    ctx.translate(x, y);
    ctx.fillStyle = "#ff8a3d";
    ctx.beginPath(); ctx.moveTo(-6, 14); ctx.lineTo(0, 22 + Math.random() * 8); ctx.lineTo(6, 14); ctx.fill();
    ctx.fillStyle = "#7cc4ff";
    ctx.beginPath();
    ctx.moveTo(0, -20); ctx.lineTo(16, 14); ctx.lineTo(6, 10); ctx.lineTo(-6, 10); ctx.lineTo(-16, 14);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#e8f4ff";
    ctx.beginPath(); ctx.ellipse(0, -2, 4, 7, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  function drawEnemy(e) {
    const c = ENEMY_TYPES[e.type].color;
    ctx.save();
    ctx.translate(e.x, e.y);
    if (e.type === "rock") {
      ctx.rotate(e.angle);
      ctx.fillStyle = c;
      ctx.beginPath();
      for (let i = 0; i < 8; i++) {
        const a = i / 8 * Math.PI * 2, rr = e.r * (0.8 + ((i * 37) % 5) / 20);
        ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
      }
      ctx.closePath(); ctx.fill();
    } else if (e.type === "fighter") {
      ctx.fillStyle = c;
      ctx.beginPath(); ctx.moveTo(0, e.r); ctx.lineTo(e.r, -e.r * 0.6); ctx.lineTo(0, -e.r * 0.2); ctx.lineTo(-e.r, -e.r * 0.6);
      ctx.closePath(); ctx.fill();
    } else {
      ctx.fillStyle = c;
      ctx.beginPath(); ctx.arc(0, 0, e.r, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#5a3a10";
      ctx.beginPath(); ctx.arc(0, 0, e.r * 0.45, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
    if (e.maxHp > 1 && e.hp < e.maxHp) {
      ctx.fillStyle = "#333a"; ctx.fillRect(e.x - e.r, e.y - e.r - 8, e.r * 2, 4);
      ctx.fillStyle = "#7dffa1"; ctx.fillRect(e.x - e.r, e.y - e.r - 8, e.r * 2 * e.hp / e.maxHp, 4);
    }
  }

  function centerText(text, y, size, color = "#e8ecff", weight = 700) {
    ctx.font = `${weight} ${size}px system-ui, sans-serif`;
    ctx.fillStyle = color;
    ctx.textAlign = "center";
    ctx.fillText(text, W / 2, y);
  }

  function draw() {
    ctx.save();
    ctx.fillStyle = "#05060f";
    ctx.fillRect(0, 0, W, H);
    if (shake > 0) ctx.translate((Math.random() - 0.5) * 12 * shake, (Math.random() - 0.5) * 12 * shake);

    for (const s of stars) {
      ctx.fillStyle = `rgba(200,210,255,${s.z})`;
      ctx.fillRect(s.x, s.y, s.z * 2, s.z * 2);
    }

    if (state !== "menu") {
      for (const p of powerups) {
        const c = POWER_COLORS[p.kind];
        ctx.strokeStyle = c; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(p.x, p.y, 12 + Math.sin(p.t * 6) * 2, 0, Math.PI * 2); ctx.stroke();
        ctx.font = "700 13px system-ui, sans-serif"; ctx.fillStyle = c; ctx.textAlign = "center";
        ctx.fillText(POWER_LABELS[p.kind], p.x, p.y + 5);
      }
      for (const e of enemies) drawEnemy(e);
      ctx.fillStyle = "#fff6a0";
      for (const b of bullets) ctx.fillRect(b.x - 2, b.y - 7, 4, 12);
      ctx.fillStyle = "#ff6b9a";
      for (const b of enemyBullets) { ctx.beginPath(); ctx.arc(b.x, b.y, 4, 0, Math.PI * 2); ctx.fill(); }

      if (state !== "over" && (player.invuln <= 0 || Math.floor(player.invuln * 10) % 2 === 0)) {
        drawShip(player.x, player.y);
        if (player.shield > 0) {
          ctx.strokeStyle = `rgba(110,231,255,${0.4 + Math.sin(time * 8) * 0.2})`;
          ctx.lineWidth = 3;
          ctx.beginPath(); ctx.arc(player.x, player.y, 28, 0, Math.PI * 2); ctx.stroke();
        }
      }
    }

    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life * 1.5);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
    }
    ctx.globalAlpha = 1;
    ctx.restore();

    // HUD
    if (state !== "menu") {
      ctx.font = "700 18px system-ui, sans-serif"; ctx.textAlign = "left"; ctx.fillStyle = "#e8ecff";
      ctx.fillText(`Score ${score}`, 16, 30);
      ctx.font = "500 14px system-ui, sans-serif"; ctx.fillStyle = "#9aa3c8";
      ctx.fillText(`Level ${level}   Best ${Math.max(best, score)}`, 16, 52);
      ctx.textAlign = "right"; ctx.fillStyle = "#ff6b9a"; ctx.font = "700 18px system-ui, sans-serif";
      ctx.fillText("♥".repeat(Math.max(0, lives)), W - 16, 30);
      const active = ["spread", "rapid", "shield"].filter(k => player[k] > 0);
      ctx.font = "600 13px system-ui, sans-serif";
      active.forEach((k, i) => {
        ctx.fillStyle = POWER_COLORS[k];
        ctx.fillText(`${k} ${Math.ceil(player[k])}s`, W - 16, 52 + i * 18);
      });
    }

    if (state === "menu") {
      centerText("STAR DEFENDER", H * 0.36, Math.min(56, W / 9), "#7cc4ff", 800);
      centerText("Move: ← → / A D, or drag on touch screens", H * 0.36 + 50, 16, "#c8d0f0", 500);
      centerText("Your ship fires automatically. P to pause.", H * 0.36 + 74, 16, "#c8d0f0", 500);
      centerText("Power-ups:  S spread · R rapid fire · O shield · + extra life", H * 0.36 + 98, 14, "#9aa3c8", 500);
      centerText("Press Enter or tap to start", H * 0.36 + 150, 20, "#ffe066");
      if (best) centerText(`Best: ${best}`, H * 0.36 + 182, 16, "#9aa3c8", 500);
    } else if (state === "paused") {
      centerText("PAUSED", H / 2, 40);
      centerText("Press P, Enter, or tap to resume", H / 2 + 36, 16, "#c8d0f0", 500);
    } else if (state === "over") {
      centerText("GAME OVER", H * 0.4, 48, "#ff6b9a", 800);
      centerText(`Score: ${score}`, H * 0.4 + 46, 22);
      centerText(score >= best && score > 0 ? "New best!" : `Best: ${best}`, H * 0.4 + 76, 16, "#ffe066", 600);
      centerText("Press Enter or tap to play again", H * 0.4 + 120, 18, "#c8d0f0", 500);
    }
  }

  // ---------- Loop ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }

  resize();
  makeStars();
  reset();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
