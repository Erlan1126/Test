<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="To do">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>[hidden]{display:none!important} body{margin:0}</style>
<title>To do</title>
</head>
<body>
<style>
  /* Layout: iOS-style grouped lists on a grey ground. Frosted sticky header with a list picker,
     floating + button, full-screen task sheet with a frosted toolbar. */
  :root {
    --bg: #f2f2f7;
    --card: #ffffff;
    --fg: #111214;
    --muted: #6c6c70;
    --line: #d8d8dc;
    --soft: #e9e9ee;
    --glass: rgb(248 248 250 / 0.78);
    --fab: #007aff;
    --on-fab: #ffffff;
    --grip: #c7c7cc;
    --accent: #007aff;
    --star: #ffb800;
    --danger: #ff3b30;
    --toast-bg: #1c1c1e;
    --toast-fg: #ffffff;
    --toast-link: #5eb3ff;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #000000; --card: #1c1c1e; --fg: #f2f2f7; --muted: #a1a1a8; --line: #38383a; --soft: #2c2c2e;
      --glass: rgb(28 28 30 / 0.72); --fab: #0a84ff; --on-fab: #ffffff; --grip: #545458; --accent: #0a84ff; --star: #ffcc00; --danger: #ff453a;
      --toast-bg: #f2f2f7; --toast-fg: #000000; --toast-link: #007aff;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #000000; --card: #1c1c1e; --fg: #f2f2f7; --muted: #a1a1a8; --line: #38383a; --soft: #2c2c2e;
    --glass: rgb(28 28 30 / 0.72); --fab: #0a84ff; --on-fab: #ffffff; --grip: #545458; --accent: #0a84ff; --star: #ffcc00; --danger: #ff453a;
    --toast-bg: #f2f2f7; --toast-fg: #000000; --toast-link: #007aff;
    color-scheme: dark;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", Roboto, sans-serif;
    font-size: 17px;
  }
  /* The header and the status-bar band match the page at rest and turn frosted once the list
     scrolls under them, like iOS large titles. */
  body::before {
    content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10;
    background: var(--bg); transition: background 0.2s;
  }
  .scrolled body::before, .scrolled header {
    background: var(--glass); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px);
  }
  .scrolled header { box-shadow: 0 0.5px 0 var(--line); }
  button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; padding: 0; }
  button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  svg { display: block; }
  .glass { background: var(--glass); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px); }

  /* Header */
  header {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
    background: var(--bg); transition: background 0.2s, box-shadow 0.2s;
    padding-block: 12px;
    padding-left: max(20px, env(safe-area-inset-left, 0px));
    padding-right: max(20px, env(safe-area-inset-right, 0px));
  }
  .header-row { max-width: 560px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; position: relative; }
  .list-picker { display: flex; align-items: center; gap: 6px; min-width: 0; text-align: left; }
  h1 { margin: 0; font-size: 2.1rem; font-weight: 800; letter-spacing: -0.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .list-picker svg { flex: none; margin-top: 6px; transition: transform 0.2s; }
  .list-picker[aria-expanded="true"] svg { transform: rotate(180deg); }
  .tools { display: flex; align-items: center; gap: 2px; background: var(--card); border-radius: 999px; padding: 4px; flex: none; }
  .icon-btn { width: 40px; height: 40px; border-radius: 999px; display: grid; place-items: center; }
  .icon-btn:hover { background: var(--soft); }
  .search-wrap { max-width: 560px; margin: 10px auto 0; }
  #search { width: 100%; padding: 9px 14px; border-radius: 10px; border: none; background: var(--soft); color: var(--fg); font: inherit; }

  .menu {
    position: absolute; top: calc(100% + 8px); z-index: 6; min-width: 230px; max-width: calc(100vw - 40px);
    background: var(--card); border-radius: 14px; padding: 6px; box-shadow: 0 12px 40px rgb(0 0 0 / 0.18);
  }
  #menu { right: 0; }
  #lists-menu { left: 0; }
  .menu-item { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 11px 12px; border-radius: 10px; font-size: 1rem; }
  .menu-item:hover { background: var(--soft); }
  .menu-item .tick { width: 18px; color: var(--accent); flex: none; }
  .menu-item .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .menu-item .count { color: var(--muted); font-variant-numeric: tabular-nums; }
  .menu-item.danger { color: var(--danger); }
  .mini-badge { flex: none; width: 24px; height: 24px; border-radius: 6px; display: grid; place-items: center; color: #fff; }
  .mini-badge.blue { background: var(--accent); }
  .mini-badge.red { background: var(--danger); }
  .menu-note { padding: 8px 12px 6px; color: var(--muted); font-size: 0.8rem; line-height: 1.35; }
  .menu-note.ok::before { content: "✓ "; color: var(--accent); }
  .menu hr { border: none; border-top: 1px solid var(--line); margin: 6px 4px; }
  .new-list { display: flex; gap: 6px; padding: 6px; }
  #new-list-name, #rename-name { flex: 1; min-width: 0; padding: 8px 10px; border-radius: 8px; border: none; background: var(--soft); color: var(--fg); font: inherit; font-size: 1rem; }
  #new-list-add, #rename-save { padding: 0 12px; border-radius: 8px; background: var(--accent); color: #fff; font-size: 0.95rem; font-weight: 600; }

  /* Grouped list */
  main {
    max-width: 560px; margin: 0 auto;
    padding-block: 4px 120px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .group { list-style: none; margin: 0; padding: 0; background: var(--card); border-radius: 12px; overflow: hidden; }
  .group:empty { display: none; }
  .row-wrap { position: relative; overflow: hidden; }
  .swipe-delete {
    position: absolute; inset: 0 0 0 auto; width: 88px; background: var(--danger); color: #fff;
    display: grid; place-items: center; font-size: 0.95rem; font-weight: 600;
  }
  .row-wrap:not(.swiping) .swipe-delete { visibility: hidden; }
  .task {
    position: relative; display: flex; align-items: flex-start; gap: 14px;
    padding: 13px 16px; background: var(--card);
    touch-action: pan-y; transition: transform 0.25s ease;
  }
  .task::after { content: ""; position: absolute; left: 54px; right: 0; bottom: 0; border-bottom: 0.5px solid var(--line); }
  .row-wrap:last-child .task::after { display: none; }
  .check {
    flex: none; width: 24px; height: 24px; margin-top: 1px; border-radius: 999px;
    border: 2px solid var(--line); display: grid; place-items: center; color: #fff;
    transition: background 0.15s, border-color 0.15s;
  }
  .done .check { background: var(--accent); border-color: var(--accent); }
  .check svg { opacity: 0; }
  .done .check svg { opacity: 1; }
  .body { flex: 1; min-width: 0; text-align: left; display: grid; gap: 3px; }
  .title { overflow-wrap: anywhere; line-height: 1.35; }
  .done .title { color: var(--muted); }
  .meta { display: flex; flex-wrap: wrap; gap: 10px; color: var(--muted); font-size: 0.85rem; }
  .meta span { display: inline-flex; align-items: center; gap: 4px; min-width: 0; }
  .note-preview { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
  .due { color: var(--muted); font-variant-numeric: tabular-nums; }
  .due.today { color: var(--accent); }
  .due.overdue { color: var(--danger); }
  .done .due { color: var(--muted); }
  .flag { flex: none; color: var(--star); margin-top: 2px; }
  .col { flex: 1; min-width: 0; display: grid; gap: 6px; }
  .subs { list-style: none; margin: 0; padding: 0; display: grid; }
  .sub-item { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; font-size: 0.92rem; padding: 5px 0; }
  .sub-item span { min-width: 0; overflow-wrap: anywhere; }
  .mini-check {
    flex: none; width: 18px; height: 18px; border-radius: 999px; border: 1.5px solid var(--line);
    display: grid; place-items: center; color: #fff; transition: background 0.15s, border-color 0.15s;
  }
  .mini-check svg { opacity: 0; }
  .sub-item.done .mini-check { background: var(--accent); border-color: var(--accent); }
  .sub-item.done .mini-check svg { opacity: 1; }
  .sub-item.done span:last-child { color: var(--muted); }
  .grip {
    flex: none; width: 30px; height: 30px; margin: -3px -8px -3px 0; display: grid; place-items: center;
    color: var(--grip); touch-action: none; cursor: grab;
  }
  .row-wrap.shift { transition: transform 0.2s ease; }
  .row-wrap.dragging { z-index: 3; transition: none; box-shadow: 0 10px 30px rgb(0 0 0 / 0.2); }
  .row-wrap.dragging .task { background: var(--card); }
  .row-wrap.leaving { animation: leave 0.25s ease forwards; }
  @keyframes leave { to { opacity: 0; transform: translateX(12px); } }
  .filters { display: flex; margin: 0 0 12px; }
  .filter-chip {
    display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 999px;
    background: var(--card); font-size: 0.9rem; font-weight: 500;
  }
  .filter-chip .star { color: var(--star); }
  .filter-chip .x { color: var(--muted); margin-left: 2px; }
  .section-toggle {
    margin: 26px 16px 8px; color: var(--muted); font-size: 0.8rem; font-weight: 500;
    text-transform: uppercase; letter-spacing: 0.04em; display: flex; align-items: center; gap: 6px;
  }
  .section-toggle svg { transition: transform 0.2s; }
  .section-toggle.open svg { transform: rotate(90deg); }
  .day-head {
    margin: 22px 16px 8px; color: var(--muted); font-size: 0.8rem; font-weight: 500;
    text-transform: uppercase; letter-spacing: 0.04em;
  }
  #upcoming > .day-head:first-child { margin-top: 8px; }
  #upcoming { display: grid; }
  .list-tag { font-weight: 500; }
  .toast {
    position: fixed; z-index: 15; left: 50%; transform: translateX(-50%);
    bottom: calc(104px + env(safe-area-inset-bottom, 0px));
    width: max-content; max-width: calc(100vw - 32px);
    display: flex; align-items: center; gap: 18px;
    padding: 12px 16px 12px 18px; border-radius: 14px;
    background: var(--toast-bg); color: var(--toast-fg);
    box-shadow: 0 10px 30px rgb(0 0 0 / 0.25); font-size: 0.95rem;
    animation: toast-in 0.2s ease-out;
  }
  @keyframes toast-in { from { opacity: 0; transform: translate(-50%, 10px); } }
  #toast-undo { color: var(--toast-link); font-weight: 600; }
  .empty { position: fixed; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 1.15rem; pointer-events: none; }

  .fab {
    position: fixed; z-index: 4;
    right: calc(24px + env(safe-area-inset-right, 0px));
    bottom: calc(28px + env(safe-area-inset-bottom, 0px));
    width: 60px; height: 60px; border-radius: 999px;
    background: var(--fab); color: var(--on-fab);
    display: grid; place-items: center;
    box-shadow: 0 8px 24px rgb(0 122 255 / 0.35);
    transition: transform 0.15s;
  }
  .fab:active { transform: scale(0.94); }

  /* Task sheet */
  .sheet {
    position: fixed; inset: 0; z-index: 20; background: var(--bg);
    display: flex; flex-direction: column;
    padding-top: env(safe-area-inset-top, 0px);
    animation: up 0.25s ease-out;
  }
  @keyframes up { from { transform: translateY(30px); opacity: 0; } }
  .sheet-top {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px max(16px, env(safe-area-inset-right, 0px)) 4px max(16px, env(safe-area-inset-left, 0px));
  }
  .text-btn { color: var(--accent); font-size: 1.05rem; padding: 8px 4px; }
  .sheet-heading { font-weight: 600; }
  .sheet-body {
    flex: 1; overflow-y: auto; width: 100%; max-width: 560px; margin: 0 auto;
    display: grid; align-content: start; gap: 20px;
    padding-block: 8px 110px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .field { position: relative; display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 16px; }
  .chips-row { display: block; min-height: 0; }
  .chips-row::before { display: none; }
  .field + .field::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; border-top: 0.5px solid var(--line); }
  #task-title { width: 100%; border: none; background: none; color: var(--fg); font: inherit; font-size: 1.2rem; font-weight: 500; padding: 14px 0; }
  #task-title:focus, #task-note:focus, .sub-input:focus { outline: none; }
  ::placeholder { color: var(--muted); }
  .row-btn { width: 100%; display: flex; align-items: center; gap: 12px; color: var(--accent); min-height: 48px; text-align: left; }
  #task-note { width: 100%; border: none; background: none; color: var(--fg); font: inherit; font-size: 1rem; resize: none; padding: 13px 0; min-height: 48px; field-sizing: content; }
  .sub-check { flex: none; width: 20px; height: 20px; border: 2px solid var(--line); border-radius: 999px; display: grid; place-items: center; color: #fff; }
  .sub.done .sub-check { background: var(--accent); border-color: var(--accent); }
  .sub-check svg { opacity: 0; }
  .sub.done .sub-check svg { opacity: 1; }
  .sub-input { flex: 1; min-width: 0; border: none; background: none; color: var(--fg); font: inherit; font-size: 1rem; padding: 12px 0; }
  .sub.done .sub-input { color: var(--muted); }
  .sub-remove { color: var(--muted); width: 32px; height: 32px; display: grid; place-items: center; }
  .field label { flex: 1; }
  .badge { flex: none; width: 28px; height: 28px; border-radius: 7px; display: grid; place-items: center; color: #fff; }
  .badge.red { background: var(--danger); }
  .badge.blue { background: var(--accent); }
  .badge.gray { background: #8e8e93; }
  #task-date, #task-time {
    border: none; background: var(--soft); color: var(--fg); font: inherit; font-size: 1rem;
    padding: 6px 10px; border-radius: 8px; min-width: 120px; min-height: 34px; text-align: right;
  }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 4px 0 12px 40px; }
  .chip { padding: 6px 12px; border-radius: 999px; background: var(--soft); font-size: 0.9rem; }
  .chip:hover { background: var(--line); }
  .row-btn.danger { color: var(--danger); }
  #task-list, #task-repeat {
    border: none; background: none; color: var(--muted); font: inherit; font-size: 1rem;
    text-align: right; max-width: 60%; cursor: pointer;
  }

  .toolbar {
    position: absolute; left: 0; right: 0; bottom: 0;
    border-top: 0.5px solid var(--line);
    display: flex; align-items: center; gap: 4px;
    padding-block: 8px calc(8px + env(safe-area-inset-bottom, 0px));
    padding-left: max(12px, env(safe-area-inset-left, 0px));
    padding-right: max(12px, env(safe-area-inset-right, 0px));
  }
  .toolbar .icon-btn { width: 48px; height: 44px; border-radius: 12px; color: var(--fg); }
  .toolbar .icon-btn[aria-pressed="true"] { color: var(--star); }
  .toolbar .delete { color: var(--danger); }
  .spacer { flex: 1; }
  .save { height: 44px; min-width: 88px; padding: 0 20px; border-radius: 12px; background: var(--accent); color: #fff; display: grid; place-items: center; }
  .save:disabled { opacity: 0.4; cursor: default; }

  .confirm {
    position: absolute; inset: 0; z-index: 30; background: rgb(0 0 0 / 0.35);
    display: flex; align-items: flex-end; justify-content: center;
    padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  }
  .confirm-card { width: 100%; max-width: 420px; display: grid; gap: 8px; animation: up 0.2s ease-out; }
  .confirm-group { background: var(--card); border-radius: 14px; overflow: hidden; display: grid; }
  .confirm-group p { margin: 0; padding: 14px 16px; text-align: center; color: var(--muted); font-size: 0.85rem; border-bottom: 0.5px solid var(--line); }
  .confirm-btn { width: 100%; padding: 16px; font-size: 1.1rem; color: var(--accent); text-align: center; }
  .confirm-btn.danger { color: var(--danger); }
  .confirm-btn.bold { font-weight: 600; }

  @media (prefers-reduced-motion: reduce) {
    .sheet, .toast, .confirm-card, .row-wrap.leaving { animation: none; }
    * { transition: none !important; }
  }
</style>

<header>
  <div class="header-row">
    <button class="list-picker" id="list-picker" type="button" aria-haspopup="true" aria-expanded="false">
      <h1 id="list-title">To do</h1>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
    </button>
    <div class="menu" id="lists-menu" hidden></div>
    <div class="tools">
      <button class="icon-btn" id="search-btn" type="button" aria-label="Search tasks">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      </button>
      <button class="icon-btn" id="menu-btn" type="button" aria-label="More options" aria-expanded="false">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>
      </button>
    </div>
    <div class="menu" id="menu" hidden>
      <button class="menu-item" type="button" id="menu-starred">Show starred only</button>
      <button class="menu-item" type="button" id="menu-autosort" hidden>Sort automatically</button>
      <button class="menu-item danger" type="button" id="menu-clear">Delete completed tasks</button>
      <hr>
      <div class="menu-note" id="sync-note">Saved on this device only</div>
    </div>
  </div>
  <div class="search-wrap" id="search-wrap" hidden>
    <input id="search" type="search" placeholder="Search" autocomplete="off">
  </div>
</header>

<main>
  <div class="filters" id="filters" hidden>
    <button class="filter-chip" id="filter-chip" type="button" aria-label="Stop showing starred only">
      <span class="star">★</span> Starred only <span class="x">✕</span>
    </button>
  </div>
  <ul class="group" id="open-list"></ul>
  <div id="upcoming" hidden></div>
  <button class="section-toggle" id="done-toggle" type="button" hidden>
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="m9 6 6 6-6 6"/></svg>
    <span id="done-label"></span>
  </button>
  <ul class="group" id="done-list" hidden></ul>
</main>

<div class="empty" id="empty" hidden>Tap + to add</div>

<div class="toast" id="toast" role="status" hidden>
  <span id="toast-text"></span>
  <button id="toast-undo" type="button">Undo</button>
</div>

<button class="fab" id="fab" type="button" aria-label="Add task">
  <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
</button>

<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheet-heading">
  <div class="sheet-top">
    <button class="text-btn" id="sheet-close" type="button">Cancel</button>
    <span class="sheet-heading" id="sheet-heading">New Task</span>
    <span style="width: 56px"></span>
  </div>
  <div class="sheet-body">
    <div class="group">
      <div class="field"><input id="task-title" type="text" placeholder="I want to ..." autocomplete="off" enterkeyhint="done"></div>
      <div class="field">
        <button class="row-btn" id="note-btn" type="button">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M6 3h8l4 4v14H6z"/><path d="M9 12h6M9 16h6"/></svg>
          Add note
        </button>
        <textarea id="task-note" rows="1" placeholder="Note" hidden></textarea>
      </div>
    </div>
    <div class="group">
      <div id="subtasks"></div>
      <div class="field">
        <button class="row-btn" id="sub-add" type="button">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>
          Add subtask
        </button>
      </div>
    </div>
    <div class="group">
      <div class="field">
        <span class="badge red"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg></span>

          <button class="chip" type="button" data-days="0">Today</button>
          <button class="chip" type="button" data-days="1">Tomorrow</button>

        <span class="badge blue"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg></span>
        <label for="task-time">Time</label>
        <input id="task-time" type="time">

      <div class="field" id="repeat-row" hidden>
        <span class="badge gray"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l3 3-3 3"/><path d="M4 11V9a4 4 0 0 1 4-4h12"/><path d="M7 22l-3-3 3-3"/><path d="M20 13v2a4 4 0 0 1-4 4H4"/></svg></span>
        <label for="task-repeat">Repeat</label>
        <select id="task-repeat">
          <option value="">Never</option>
          <option value="daily">Every day</option>
          <option value="weekdays">Weekdays</option>
          <option value="weekly">Every week</option>
          <option value="monthly">Every month</option>
          <option value="yearly">Every year</option>
        </select>
      </div>
      <div class="field" id="due-clear-row" hidden>
        <button class="row-btn danger" id="due-clear" type="button">Remove deadline</button>
      </div>

      <div class="field">
        <label for="task-list">List</label>

    </div>
  </div>
  <div class="toolbar glass">
    <button class="icon-btn" id="star-btn" type="button" aria-label="Star this task" aria-pressed="false">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg>
    </button>
    <button class="icon-btn delete" id="delete-btn" type="button" aria-label="Delete task" hidden>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>
    </button>
    <div class="spacer"></div>
    <button class="save" id="save-btn" type="button" aria-label="Save task">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>
    </button>
  </div>
  <div class="confirm" id="discard" hidden role="alertdialog" aria-labelledby="discard-text">
    <div class="confirm-card">
      <div class="confirm-group">
        <p id="discard-text">You have changes that aren't saved.</p>
        <button class="confirm-btn danger" id="discard-yes" type="button">Discard changes</button>
      </div>
      <div class="confirm-group">
        <button class="confirm-btn bold" id="discard-no" type="button">Keep editing</button>
      </div>
    </div>
  </div>
</div>

<script>
  const STORAGE_KEY = "todos-v3";
  const CHECK_SVG = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>';
  const STAR_SVG = '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg>';
  const SWIPE_W = 88;
  const $ = id => document.getElementById(id);

  let state = load();      // { lists, current, todos }
  let query = "";
  let starredOnly = false;
  let showDone = false;
  let editing = null;      // the task open in the sheet, or null for a new one
  let draft = null;        // working copy while the sheet is open
  let openRow = null;      // the row currently swiped open
  let confirmDelete = false;
  let undoSnapshot = null; // lists and tasks as they were before the last undoable action
  let toastTimer = null;
  let renaming = false;
  let sheetStart = "";     // the sheet's fields when it opened, to spot unsaved changes
  const completing = new Map(); // task id -> timer while the check animation plays
  const REPEAT_LABELS = { daily: "Daily", weekdays: "Weekdays", weekly: "Weekly", monthly: "Monthly", yearly: "Yearly" };
  const REPEAT_SVG = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l3 3-3 3"/><path d="M4 11V9a4 4 0 0 1 4-4h12"/><path d="M7 22l-3-3 3-3"/><path d="M20 13v2a4 4 0 0 1-4 4H4"/></svg>';
  const GRIP_SVG = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 9h14M5 15h14"/></svg>';

  // Smart views gather tasks from every list by deadline, like Reminders.
  const SMART = [{ id: "@today", name: "Today" }, { id: "@upcoming", name: "Upcoming" }];
  const CAL_SVG = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>';
  const CLOCK_SVG = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>';

  // Cloud sync: when this page runs on claude.ai, lists and tasks are also kept in the
  // viewer's private space in the artifact's database, so they follow them across devices.
  let docRef = null;
  let writeTimer = null;
  let writing = false;
  let writeAgain = false;
  let lastSynced = "";
  let pendingRemote = null;

  // Everything is saved in this browser so it survives a reload.
  function load() {
    try {
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
      if (saved && Array.isArray(saved.lists) && saved.lists.length) return saved;
    } catch {}
    const lists = [{ id: "todo", name: "To do" }, { id: "work", name: "Work" }, { id: "home", name: "Home" }];
    let todos = null;
    try {
      // Bring over tasks from the previous version of the app.
      const old = JSON.parse(localStorage.getItem("todos-v2"));
      if (Array.isArray(old)) todos = old.map(t => ({ ...t, list: "todo" }));
    } catch {}
    todos ??= [
      { id: 1, list: "todo", text: "Example: tap a task to open it", note: "Notes show up under the title.", important: true, done: false,
        subtasks: [{ id: 11, text: "Add a subtask", done: true }, { id: 12, text: "Tick it off", done: false }] },
      { id: 4, list: "todo", text: "Example: give a task a deadline", note: "", important: false, done: false, subtasks: [],
        due: dateStr(0), dueTime: "" },
      { id: 2, list: "todo", text: "Example: swipe left to delete", note: "", important: false, done: false, subtasks: [] },
      { id: 3, list: "todo", text: "Example: tap the title to switch lists", note: "", important: false, done: false, subtasks: [] },
    ];
    return { lists, current: "todo", todos };
  }

  // The part of the state that syncs; the open list stays per device.
  const cloudBody = () => JSON.stringify({ lists: state.lists, todos: state.todos });

  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch {}
    if (docRef) {
      clearTimeout(writeTimer);
      writeTimer = setTimeout(() => { writeTimer = null; pushToCloud(); }, 400);
    }
  }

  async function pushToCloud() {
    if (writing) { writeAgain = true; return; }
    writing = true;
    const body = cloudBody();
    try {
      if (body !== lastSynced) { await docRef.set(JSON.parse(body)); lastSynced = body; }
      setSync("ok");
    } catch (e) {
      setSync(e && e.code === "quota_exceeded" ? "full" : "error");
    }
    writing = false;
    if (writeAgain) { writeAgain = false; pushToCloud(); }
  }

  function setSync(status) {
    const note = $("sync-note");
    note.className = "menu-note" + (status === "ok" ? " ok" : "");
    note.textContent = {
      ok: "Saved to your Claude account. Open this link on any device to see your tasks.",
      error: "Couldn't reach your Claude account. Your tasks are saved on this device.",
      full: "Your storage is full. Delete some tasks to keep saving to your account.",
    }[status] || "Saved on this device only";
  }

  function adopt(data) {
    if (!data || !Array.isArray(data.lists) || !data.lists.length || !Array.isArray(data.todos)) return;
    state.lists = JSON.parse(JSON.stringify(data.lists));
    state.todos = JSON.parse(JSON.stringify(data.todos));
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch {}
    render();
  }

  async function connectCloud() {
    if (!window.claude?.use) return;
    try {
      const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
      const uid = user && await user.id();
      if (!db || !uid) return;
      docRef = db.doc("data/users/" + uid + "/state");
      const snap = await docRef.get();
      if (snap.exists && Array.isArray(snap.data()?.lists)) {
        lastSynced = JSON.stringify(snap.data());
        adopt(snap.data());
        setSync("ok");
      } else {
        await pushToCloud();   // first visit: upload what this device already has
      }
      // Live updates from your other devices.
      docRef.onSnapshot(s => {
        if (!s.exists || s.metadata.hasPendingWrites) return;
        const body = JSON.stringify(s.data());
        if (body === lastSynced || writeTimer || writing) return;
        lastSynced = body;
        if (!$("sheet").hidden) { pendingRemote = s.data(); return; }
        adopt(s.data());
      }, () => setSync("error"));
    } catch {
      docRef = null;
      setSync("error");
    }
  }

  // ---------- Undo ----------
  function withUndo(message, change) {
    const before = JSON.stringify({ body: cloudBody(), current: state.current });
    change();
    save();
    render();
    undoSnapshot = before;
    $("toast-text").textContent = message;
    $("toast").hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(hideToast, 5000);
  }

  function hideToast() {
    $("toast").hidden = true;
    undoSnapshot = null;
  }

  function undo() {
    if (!undoSnapshot) return;
    const before = JSON.parse(undoSnapshot);
    const body = JSON.parse(before.body);
    state.lists = body.lists;
    state.todos = body.todos;
    state.current = before.current;
    hideToast();
    save();
    render();
  }

  // ---------- Deadlines ----------
  // Dates are stored as "YYYY-MM-DD" in local time, times as "HH:MM".
  function toKey(d) {
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  }

  function dateStr(daysFromToday) {
    const d = new Date();
    d.setDate(d.getDate() + daysFromToday);
    return toKey(d);
  }

  // The next deadline of a repeating task, skipping any dates already in the past.
  function nextDue(t) {
    const [y, m, d] = t.due.split("-").map(Number);
    const daysIn = (yr, mo) => new Date(yr, mo + 1, 0).getDate();
    let date = new Date(y, m - 1, d);
    const today = new Date(); today.setHours(0, 0, 0, 0);
    do {
      if (t.repeat === "daily") date.setDate(date.getDate() + 1);
      else if (t.repeat === "weekdays") { do date.setDate(date.getDate() + 1); while (date.getDay() === 0 || date.getDay() === 6); }
      else if (t.repeat === "weekly") date.setDate(date.getDate() + 7);
      else if (t.repeat === "monthly") { const yr = date.getFullYear(), mo = date.getMonth() + 1; date = new Date(yr, mo, Math.min(d, daysIn(yr, mo))); }
      else { const yr = date.getFullYear() + 1; date = new Date(yr, m - 1, Math.min(d, daysIn(yr, m - 1))); }
    } while (date < today);
    return toKey(date);
  }

  function dueDate(t) {
    const [y, m, d] = t.due.split("-").map(Number);
    const [hh, mm] = (t.dueTime || "23:59").split(":").map(Number);
    return new Date(y, m - 1, d, hh, mm);
  }

  function dueInfo(t) {
    const [y, m, d] = t.due.split("-").map(Number);
    const day = new Date(y, m - 1, d);
    const today = new Date(); today.setHours(0, 0, 0, 0);
    const diff = Math.round((day - today) / 864e5);
    let label;
    if (diff === 0) label = "Today";
    else if (diff === 1) label = "Tomorrow";
    else if (diff === -1) label = "Yesterday";
    else if (diff > 1 && diff < 7) label = day.toLocaleDateString(undefined, { weekday: "long" });
    else label = day.toLocaleDateString(undefined, { month: "short", day: "numeric", year: y === today.getFullYear() ? undefined : "numeric" });
    if (t.dueTime) {
      const [hh, mm] = t.dueTime.split(":").map(Number);
      label += ", " + new Date(2000, 0, 1, hh, mm).toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
    }
    const overdue = !t.done && dueDate(t) < new Date();
    return { label, overdue, today: diff === 0 && !overdue };
  }

  const dueSort = (a, b) => (a.due ? dueDate(a).getTime() : Infinity) - (b.due ? dueDate(b).getTime() : Infinity);

  function dayDiff(t) {
    const [y, m, d] = t.due.split("-").map(Number);
    const today = new Date(); today.setHours(0, 0, 0, 0);
    return Math.round((new Date(y, m - 1, d) - today) / 864e5);
  }

  function inView(t, viewId) {
    if (viewId === "@today") return !!t.due && (t.done ? dayDiff(t) === 0 : dayDiff(t) <= 0);
    if (viewId === "@upcoming") return !!t.due && dayDiff(t) >= 1;
    return t.list === viewId;
  }

  const isSmart = id => id.startsWith("@");
  const isExample = t => t.text.startsWith("Example: ");
  const realListFor = () => state.lists.find(l => l.id === state.lastList) || state.lists[0];

  const currentList = () =>
    SMART.find(l => l.id === state.current) || state.lists.find(l => l.id === state.current) || state.lists[0];

  // ---------- List ----------
  function matches(t) {
    if (!inView(t, state.current)) return false;
    if (starredOnly && !t.important) return false;
    if (!query) return true;
    const q = query.toLowerCase();
    return t.text.toLowerCase().includes(q) || (t.note || "").toLowerCase().includes(q) ||
      t.subtasks.some(s => s.text.toLowerCase().includes(q));
  }

  // Show the check for a moment before the task leaves, like Reminders. Tapping again cancels.
  function complete(t, wrap, row) {
    if (completing.has(t.id)) {
      clearTimeout(completing.get(t.id));
      completing.delete(t.id);
      row.classList.remove("done");
      return;
    }
    row.classList.add("done");
    completing.set(t.id, setTimeout(() => {
      wrap.classList.add("leaving");
      setTimeout(() => {
        completing.delete(t.id);
        const live = state.todos.find(x => x.id === t.id);
        if (!live) return render();
        if (live.repeat && live.due) {
          const next = nextDue(live);
          withUndo("Next: " + dueInfo({ ...live, due: next, done: true }).label, () => {
            live.due = next;
            live.subtasks.forEach(s => { s.done = false; });
          });
        } else {
          withUndo("Completed", () => { live.done = true; });
        }
      }, 250);
    }, 700));
  }

  function toggleSubtask(t, s) {
    const live = state.todos.find(x => x.id === t.id);
    const sub = live && live.subtasks.find(x => x.id === s.id);
    if (!sub) return;
    sub.done = !sub.done;
    save();
    render();
  }

  // Reorder by dragging the handle; the list then keeps its own order.
  function enableDrag(wrap, grip) {
    grip.addEventListener("pointerdown", e => {
      if (e.pointerType === "mouse" && e.button !== 0) return;
      e.preventDefault();
      e.stopPropagation();
      closeOpenRow();
      const items = [...wrap.parentElement.children];
      const from = items.indexOf(wrap);
      const rects = items.map(el => el.getBoundingClientRect());
      const h = rects[from].height;
      const startY = e.clientY;
      let to = from;
      grip.setPointerCapture(e.pointerId);
      wrap.classList.add("dragging");
      items.forEach(el => { if (el !== wrap) el.classList.add("shift"); });

      const move = ev => {
        const dy = ev.clientY - startY;
        wrap.style.transform = `translateY(${dy}px)`;
        const mid = rects[from].top + h / 2 + dy;
        to = from;
        for (let i = 0; i < from; i++) if (mid < rects[i].top + rects[i].height / 2) { to = i; break; }
        if (to === from) for (let i = items.length - 1; i > from; i--) if (mid > rects[i].top + rects[i].height / 2) { to = i; break; }
        items.forEach((el, i) => {
          if (el === wrap) return;
          const shift = from < to && i > from && i <= to ? -h : from > to && i >= to && i < from ? h : 0;
          el.style.transform = shift ? `translateY(${shift}px)` : "";
        });
      };
      const up = () => {
        grip.removeEventListener("pointermove", move);
        grip.removeEventListener("pointerup", up);
        grip.removeEventListener("pointercancel", up);
        const ids = items.map(el => el.dataset.id);
        ids.splice(to, 0, ids.splice(from, 1)[0]);
        if (to !== from) {
          currentList().manual = true;
          ids.forEach((id, i) => { const x = state.todos.find(t => String(t.id) === id); if (x) x.order = i; });
          save();
        }
        render();
      };
      grip.addEventListener("pointermove", move);
      grip.addEventListener("pointerup", up);
      grip.addEventListener("pointercancel", up);
    });
  }

  function deleteTask(t) {
    withUndo("Task deleted", () => { state.todos = state.todos.filter(x => x !== t); });
  }

  function taskItem(t, reorder) {
    const wrap = document.createElement("li");
    wrap.className = "row-wrap";
    wrap.dataset.id = t.id;

    const action = document.createElement("button");
    action.className = "swipe-delete";
    action.type = "button";
    action.textContent = "Delete";
    action.tabIndex = -1;
    action.addEventListener("click", () => deleteTask(t));

    const row = document.createElement("div");
    row.className = "task" + (t.done || completing.has(t.id) ? " done" : "");

    const check = document.createElement("button");
    check.className = "check";
    check.type = "button";
    check.innerHTML = CHECK_SVG;
    check.setAttribute("aria-label", t.done ? "Mark as not done" : "Mark as done");
    check.addEventListener("click", () => {
      if (t.done) { t.done = false; save(); render(); }
      else complete(t, wrap, row);
    });

    const body = document.createElement("button");
    body.className = "body";
    body.type = "button";
    const title = document.createElement("span");
    title.className = "title";
    title.textContent = t.text;
    body.appendChild(title);

    const meta = document.createElement("span");
    meta.className = "meta";
    if (isSmart(state.current)) {
      const l = document.createElement("span");
      l.className = "list-tag";
      l.textContent = state.lists.find(x => x.id === t.list)?.name || "";
      meta.appendChild(l);
    }
    if (t.due) {
      const info = dueInfo(t);
      const s = document.createElement("span");
      s.className = "due" + (info.overdue ? " overdue" : info.today ? " today" : "");
      s.innerHTML = CLOCK_SVG.replace(/14/g, "13");
      s.append(info.overdue ? "Overdue · " + info.label : info.label);
      meta.appendChild(s);
      if (t.repeat) {
        const r = document.createElement("span");
        r.innerHTML = REPEAT_SVG;
        r.append(REPEAT_LABELS[t.repeat] || "");
        meta.appendChild(r);
      }
    }
    if (t.subtasks.length && t.done) {   // open tasks list their subtasks below instead
      const s = document.createElement("span");
      s.textContent = `☐ ${t.subtasks.filter(x => x.done).length}/${t.subtasks.length}`;
      meta.appendChild(s);
    }
    if (t.note) {
      const n = document.createElement("span");
      n.className = "note-preview";
      n.textContent = t.note;
      meta.appendChild(n);
    }
    if (meta.childNodes.length) body.appendChild(meta);
    body.addEventListener("click", () => openSheet(t));

    // Subtasks of open tasks show under the title and can be ticked right here.
    const col = document.createElement("div");
    col.className = "col";
    col.appendChild(body);
    if (!t.done && t.subtasks.length) {
      const subs = document.createElement("ul");
      subs.className = "subs";
      for (const s of t.subtasks) {
        const li = document.createElement("li");
        const b = document.createElement("button");
        b.type = "button";
        b.className = "sub-item" + (s.done ? " done" : "");
        b.setAttribute("aria-label", (s.done ? "Mark not done: " : "Mark done: ") + s.text);
        b.innerHTML = `<span class="mini-check">${CHECK_SVG.replace(/14/g, "11")}</span><span></span>`;
        b.lastChild.textContent = s.text;
        b.addEventListener("click", () => toggleSubtask(t, s));
        li.appendChild(b);
        subs.appendChild(li);
      }
      col.appendChild(subs);
    }

    row.append(check, col);
    if (t.important) {
      const flag = document.createElement("span");
      flag.className = "flag";
      flag.setAttribute("aria-label", "Starred");
      flag.innerHTML = STAR_SVG;
      row.appendChild(flag);
    }
    if (reorder) {
      const grip = document.createElement("span");
      grip.className = "grip";
      grip.setAttribute("aria-hidden", "true");
      grip.innerHTML = GRIP_SVG;
      row.appendChild(grip);
      enableDrag(wrap, grip);
    }

    wrap.append(action, row);
    enableSwipe(wrap, row, () => deleteTask(t));
    return wrap;
  }

  // Swipe left on a row to show Delete; swipe far to delete straight away, like Mail.
  function enableSwipe(wrap, row, onDelete) {
    let startX, startY, base, dx = 0, tracking = false, dragging = false, decided = false, swiped = false;

    const setX = (x, animate) => {
      row.style.transition = animate ? "" : "none";
      row.style.transform = x ? `translateX(${x}px)` : "";
      // Keep the red button hidden at rest so it can't show at the rounded corners.
      if (x) wrap.classList.add("swiping");
      else if (!animate) wrap.classList.remove("swiping");
      else row.addEventListener("transitionend", () => { if (!row.style.transform) wrap.classList.remove("swiping"); }, { once: true });
    };

    row.addEventListener("pointerdown", e => {
      if (e.pointerType === "mouse" && e.button !== 0) return;
      if (openRow && openRow.wrap !== wrap) closeOpenRow();
      startX = e.clientX; startY = e.clientY;
      base = openRow && openRow.wrap === wrap ? -SWIPE_W : 0;
      dx = base; tracking = true; dragging = decided = false;
    });

    row.addEventListener("pointermove", e => {
      if (!tracking) return;
      const mx = e.clientX - startX, my = e.clientY - startY;
      if (!decided) {
        if (Math.abs(mx) < 8 && Math.abs(my) < 8) return;
        decided = true;
        dragging = Math.abs(mx) > Math.abs(my);
        if (!dragging) { tracking = false; return; }
        row.setPointerCapture(e.pointerId);
      }
      dx = Math.min(0, base + mx);
      setX(dx, false);
    });

    const end = () => {
      if (!tracking) return;
      tracking = false;
      if (!dragging) return;
      swiped = true;
      if (dx < -wrap.offsetWidth * 0.6) {
        setX(-wrap.offsetWidth, true);
        setTimeout(onDelete, 200);
      } else if (dx < -SWIPE_W / 2) {
        setX(-SWIPE_W, true);
        openRow = { wrap, close: () => setX(0, true) };
      } else {
        setX(0, true);
        if (openRow && openRow.wrap === wrap) openRow = null;
      }
    };
    row.addEventListener("pointerup", end);
    row.addEventListener("pointercancel", () => { if (tracking) { tracking = false; setX(base, true); } });

    // A swipe, or a tap on an open row, should not also tap the button under the finger.
    row.addEventListener("click", e => {
      if (swiped) { swiped = false; e.stopPropagation(); e.preventDefault(); return; }
      if (openRow && openRow.wrap === wrap) { e.stopPropagation(); e.preventDefault(); closeOpenRow(); }
    }, true);
  }

  function closeOpenRow() {
    if (openRow) { openRow.close(); openRow = null; }
  }

  function render() {
    const list = currentList();
    state.current = list.id;
    $("list-title").textContent = list.name;

    const visible = state.todos.filter(matches);
    const smart = isSmart(list.id);
    // In a list: your own order once you've dragged, otherwise starred first, then the soonest
    // deadline, then newest. In smart views: by deadline.
    const open = visible.filter(t => !t.done).sort((a, b) => smart
      ? dueSort(a, b) || (b.important - a.important)
      : list.manual ? (a.order ?? 0) - (b.order ?? 0) || (b.id - a.id)
      : (b.important - a.important) || dueSort(a, b) || (b.id - a.id));
    const reorder = !smart && !query && !starredOnly && open.length > 1;
    const done = visible.filter(t => t.done).sort((a, b) => b.id - a.id);

    openRow = null;
    if (list.id === "@upcoming") {
      // One section per day, like Reminders' Scheduled view.
      const days = [];
      for (const t of open) {
        if (!days.length || days[days.length - 1].due !== t.due) days.push({ due: t.due, tasks: [] });
        days[days.length - 1].tasks.push(t);
      }
      $("upcoming").replaceChildren(...days.flatMap(d => {
        const head = document.createElement("h2");
        head.className = "day-head";
        head.textContent = dueInfo({ due: d.due, dueTime: "", done: true }).label;
        const ul = document.createElement("ul");
        ul.className = "group";
        ul.append(...d.tasks.map(t => taskItem(t, false)));
        return [head, ul];
      }));
      $("open-list").replaceChildren();
    } else {
      $("upcoming").replaceChildren();
      $("open-list").replaceChildren(...open.map(t => taskItem(t, reorder)));
    }
    $("upcoming").hidden = list.id !== "@upcoming";
    $("done-list").replaceChildren(...done.map(t => taskItem(t, false)));
    $("done-toggle").hidden = done.length === 0;
    $("done-toggle").classList.toggle("open", showDone);
    $("done-label").textContent = `Completed (${done.length})`;
    $("done-list").hidden = !showDone || done.length === 0;

    const inList = state.todos.some(t => inView(t, list.id));
    $("empty").hidden = visible.length > 0;
    $("empty").textContent = inList ? "No matching tasks"
      : list.id === "@today" ? "Nothing due today"
      : list.id === "@upcoming" ? "No upcoming deadlines"
      : "Tap + to add";
    $("menu-starred").textContent = starredOnly ? "Show all tasks" : "Show starred only";
    $("menu-autosort").hidden = smart || !list.manual;
    $("filters").hidden = !starredOnly;
  }

  // ---------- Lists menu ----------
  function renderListsMenu() {
    const menu = $("lists-menu");
    menu.replaceChildren();
    for (const l of SMART) {
      const b = document.createElement("button");
      b.className = "menu-item";
      b.type = "button";
      const left = state.todos.filter(t => !t.done && inView(t, l.id)).length;
      const badge = l.id === "@today" ? `<span class="mini-badge blue">${CLOCK_SVG}</span>` : `<span class="mini-badge red">${CAL_SVG}</span>`;
      b.innerHTML = `<span class="tick">${l.id === state.current ? CHECK_SVG : ""}</span>${badge}<span class="name">${l.name}</span><span class="count">${left}</span>`;
      b.addEventListener("click", () => { state.current = l.id; save(); closeMenus(); render(); });
      menu.appendChild(b);
    }
    menu.appendChild(document.createElement("hr"));
    for (const l of state.lists) {
      const b = document.createElement("button");
      b.className = "menu-item";
      b.type = "button";
      const left = state.todos.filter(t => t.list === l.id && !t.done).length;
      b.innerHTML = `<span class="tick">${l.id === state.current ? CHECK_SVG : ""}</span><span class="name"></span><span class="count">${left}</span>`;
      b.querySelector(".name").textContent = l.name;
      b.addEventListener("click", () => { state.current = state.lastList = l.id; save(); closeMenus(); render(); });
      menu.appendChild(b);
    }
    menu.appendChild(document.createElement("hr"));

    const form = document.createElement("div");
    form.className = "new-list";
    form.innerHTML = '<input id="new-list-name" type="text" placeholder="New list" autocomplete="off" enterkeyhint="done" aria-label="New list name"><button id="new-list-add" type="button">Add</button>';
    menu.appendChild(form);
    const addList = () => {
      const name = $("new-list-name").value.trim();
      if (!name) { $("new-list-name").focus(); return; }
      const l = { id: "l" + Date.now(), name };
      state.lists.push(l);
      state.current = state.lastList = l.id;
      save(); closeMenus(); render();
    };
    $("new-list-add").addEventListener("click", addList);
    $("new-list-name").addEventListener("keydown", e => { if (e.key === "Enter") addList(); });

    if (!isSmart(state.current)) {
      const list = currentList();
      if (renaming) {
        const f = document.createElement("div");
        f.className = "new-list";
        f.innerHTML = '<input id="rename-name" type="text" autocomplete="off" enterkeyhint="done" aria-label="List name"><button id="rename-save" type="button">Save</button>';
        menu.appendChild(f);
        $("rename-name").value = list.name;
        const saveName = e => {
          e?.stopPropagation();
          const name = $("rename-name").value.trim();
          if (!name) { $("rename-name").focus(); return; }
          list.name = name;
          save(); closeMenus(); render();
        };
        $("rename-save").addEventListener("click", saveName);
        $("rename-name").addEventListener("keydown", e => { if (e.key === "Enter") saveName(e); });
        $("rename-name").focus();
        $("rename-name").select();
      } else {
        const ren = document.createElement("button");
        ren.className = "menu-item";
        ren.type = "button";
        ren.textContent = `Rename “${list.name}”`;
        ren.addEventListener("click", e => { e.stopPropagation(); renaming = true; confirmDelete = false; renderListsMenu(); });
        menu.appendChild(ren);
      }
    }

    if (state.lists.length > 1 && !isSmart(state.current)) {
      const del = document.createElement("button");
      del.className = "menu-item danger";
      del.type = "button";
      const n = state.todos.filter(t => t.list === state.current).length;
      del.textContent = confirmDelete
        ? `Tap again to delete ${n ? n + (n === 1 ? " task" : " tasks") : "this list"}`
        : `Delete “${currentList().name}”`;
      del.addEventListener("click", e => {
        e.stopPropagation();
        if (!confirmDelete) { confirmDelete = true; renderListsMenu(); return; }
        const gone = state.current;
        closeMenus();
        withUndo("List deleted", () => {
          state.todos = state.todos.filter(t => t.list !== gone);
          state.lists = state.lists.filter(l => l.id !== gone);
          state.current = state.lists[0].id;
        });
      });
      menu.appendChild(del);
    }
  }

  function closeMenus() {
    $("menu").hidden = $("lists-menu").hidden = true;
    $("menu-btn").setAttribute("aria-expanded", "false");
    $("list-picker").setAttribute("aria-expanded", "false");
    confirmDelete = false;
    renaming = false;
  }

  // ---------- Sheet ----------
  function openSheet(task) {
    closeMenus();
    closeOpenRow();
    editing = task || null;
    draft = task
      ? JSON.parse(JSON.stringify(task))
      : { id: Date.now(), list: isSmart(state.current) ? realListFor().id : state.current, text: "", note: "", important: false,
          done: false, subtasks: [], due: state.current === "@today" ? dateStr(0) : state.current === "@upcoming" ? dateStr(1) : "", dueTime: "" };

    $("sheet-heading").textContent = editing ? "Task" : "New Task";
    $("task-title").value = draft.text;
    $("task-note").value = draft.note;
    $("task-note").hidden = !draft.note;
    $("note-btn").hidden = !!draft.note;
    $("delete-btn").hidden = !editing;
    $("task-date").value = draft.due || "";
    $("task-time").value = draft.dueTime || "";
    $("task-repeat").value = draft.repeat || "";
    updateDueRows();
    $("task-list").replaceChildren(...state.lists.map(l => new Option(l.name, l.id, false, l.id === draft.list)));
    renderStar();
    renderSubtasks();
    updateSave();
    sheetStart = formState();
    $("discard").hidden = true;
    $("sheet").hidden = false;
    $("fab").hidden = true;
    $("task-title").focus();
  }

  const formState = () => JSON.stringify([
    $("task-title").value.trim(), $("task-note").value.trim(), $("task-date").value, $("task-time").value,
    $("task-repeat").value, $("task-list").value, draft.important,
    draft.subtasks.filter(s => s.text.trim()).map(s => [s.text.trim(), s.done]),
  ]);

  // Cancel asks first when something was typed or changed.
  function requestClose() {
    if (formState() !== sheetStart) $("discard").hidden = false;
    else closeSheet();
  }

  function closeSheet() {
    $("discard").hidden = true;
    $("sheet").hidden = true;
    $("fab").hidden = false;
    editing = draft = null;
    // Apply changes that arrived from another device while the sheet was open.
    if (pendingRemote) { adopt(pendingRemote); pendingRemote = null; }
  }

  function commit() {
    draft.text = $("task-title").value.trim();
    draft.note = $("task-note").value.trim();
    draft.list = $("task-list").value;
    draft.due = $("task-date").value;
    draft.dueTime = draft.due ? $("task-time").value : "";
    draft.repeat = draft.due ? $("task-repeat").value : "";
    draft.subtasks = draft.subtasks.filter(s => s.text.trim());
    if (!draft.text) return;
    pendingRemote = null;   // this edit is newer; it wins
    // A task arriving in a list you've put in your own order goes to the top.
    const target = state.lists.find(l => l.id === draft.list);
    if (target?.manual && (!editing || editing.list !== draft.list)) {
      draft.order = Math.min(0, ...state.todos.filter(t => t.list === draft.list).map(t => t.order ?? 0)) - 1;
    }
    if (editing) Object.assign(editing, draft);
    else {
      // The first real task clears out the examples.
      if (!isExample(draft)) state.todos = state.todos.filter(t => !isExample(t));
      state.todos.push(draft);
    }
    save();
    closeSheet();
    render();
  }

  function updateDueRows() {
    const has = !!$("task-date").value;
    $("time-row").hidden = !has;
    $("repeat-row").hidden = !has;
    $("due-clear-row").hidden = !has;
  }

  function renderStar() {
    $("star-btn").setAttribute("aria-pressed", String(draft.important));
    $("star-btn").querySelector("path").setAttribute("fill", draft.important ? "currentColor" : "none");
  }

  function updateSave() {
    $("save-btn").disabled = !$("task-title").value.trim();
  }

  function renderSubtasks(focusId) {
    $("subtasks").replaceChildren(...draft.subtasks.map(s => {
      const row = document.createElement("div");
      row.className = "field sub" + (s.done ? " done" : "");

      const box = document.createElement("button");
      box.className = "sub-check";
      box.type = "button";
      box.innerHTML = CHECK_SVG.replace(/14/g, "12");
      box.setAttribute("aria-label", "Mark subtask done");
      box.addEventListener("click", () => { s.done = !s.done; renderSubtasks(); });

      const input = document.createElement("input");
      input.className = "sub-input";
      input.id = "sub-" + s.id;
      input.value = s.text;
      input.placeholder = "Subtask";
      input.setAttribute("enterkeyhint", "next");
      input.addEventListener("input", () => { s.text = input.value; });
      input.addEventListener("keydown", e => {
        if (e.key === "Enter") { e.preventDefault(); addSubtask(); }
        if (e.key === "Backspace" && !input.value) { e.preventDefault(); removeSubtask(s); }
      });

      const remove = document.createElement("button");
      remove.className = "sub-remove";
      remove.type = "button";
      remove.setAttribute("aria-label", "Remove subtask");
      remove.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>';
      remove.addEventListener("click", () => removeSubtask(s));

      row.append(box, input, remove);
      return row;
    }));
    if (focusId) $("sub-" + focusId)?.focus();
  }

  function addSubtask() {
    const s = { id: Date.now(), text: "", done: false };
    draft.subtasks.push(s);
    renderSubtasks(s.id);
  }

  function removeSubtask(s) {
    const i = draft.subtasks.indexOf(s);
    draft.subtasks.splice(i, 1);
    const prev = draft.subtasks[i - 1];
    renderSubtasks(prev && prev.id);
  }

  // ---------- Events ----------
  $("fab").addEventListener("click", () => openSheet(null));
  $("sheet-close").addEventListener("click", requestClose);
  $("discard-yes").addEventListener("click", closeSheet);
  $("discard-no").addEventListener("click", () => { $("discard").hidden = true; });
  $("discard").addEventListener("click", e => { if (e.target === $("discard")) $("discard").hidden = true; });
  $("save-btn").addEventListener("click", commit);
  $("task-title").addEventListener("input", updateSave);
  $("task-title").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); commit(); } });
  $("note-btn").addEventListener("click", () => {
    $("note-btn").hidden = true;
    $("task-note").hidden = false;
    $("task-note").focus();
  });
  $("sub-add").addEventListener("click", addSubtask);
  $("task-date").addEventListener("input", updateDueRows);
  $("task-date").addEventListener("change", updateDueRows);
  document.querySelectorAll(".chip").forEach(chip => chip.addEventListener("click", () => {
    $("task-date").value = dateStr(Number(chip.dataset.days));
    updateDueRows();
  }));
  $("due-clear").addEventListener("click", () => {
    $("task-date").value = $("task-time").value = $("task-repeat").value = "";
    updateDueRows();
  });
  $("star-btn").addEventListener("click", () => { draft.important = !draft.important; renderStar(); });
  $("delete-btn").addEventListener("click", () => { const t = editing; closeSheet(); deleteTask(t); });
  document.addEventListener("keydown", e => {
    if (e.key !== "Escape") return;
    if (!$("discard").hidden) $("discard").hidden = true;
    else if (!$("sheet").hidden) requestClose();
    else closeMenus();
  });

  $("search-btn").addEventListener("click", () => {
    const wrap = $("search-wrap");
    wrap.hidden = !wrap.hidden;
    if (wrap.hidden) { $("search").value = ""; query = ""; render(); } else $("search").focus();
  });
  $("search").addEventListener("input", e => { query = e.target.value.trim(); render(); });

  $("list-picker").addEventListener("click", e => {
    e.stopPropagation();
    const opening = $("lists-menu").hidden;
    closeMenus();
    if (opening) {
      renderListsMenu();
      $("lists-menu").hidden = false;
      $("list-picker").setAttribute("aria-expanded", "true");
    }
  });
  $("menu-btn").addEventListener("click", e => {
    e.stopPropagation();
    const opening = $("menu").hidden;
    closeMenus();
    if (opening) { $("menu").hidden = false; $("menu-btn").setAttribute("aria-expanded", "true"); }
  });
  document.addEventListener("click", e => {
    if (!$("menu").contains(e.target) && !$("lists-menu").contains(e.target)) closeMenus();
  });
  document.addEventListener("pointerdown", e => {
    if (openRow && !openRow.wrap.contains(e.target)) closeOpenRow();
  });
  $("menu-starred").addEventListener("click", () => { starredOnly = !starredOnly; closeMenus(); render(); });
  $("filter-chip").addEventListener("click", () => { starredOnly = false; render(); });
  $("menu-autosort").addEventListener("click", () => { currentList().manual = false; closeMenus(); save(); render(); });
  $("menu-clear").addEventListener("click", () => {
    const n = state.todos.filter(t => t.done && inView(t, state.current)).length;
    closeMenus();
    if (!n) return;
    withUndo(`${n} ${n === 1 ? "task" : "tasks"} deleted`, () => {
      state.todos = state.todos.filter(t => !(t.done && inView(t, state.current)));
    });
  });
  $("toast-undo").addEventListener("click", undo);

  $("done-toggle").addEventListener("click", () => { showDone = !showDone; render(); });

  // Keep the toolbar right above the phone keyboard, like a native app.
  if (window.visualViewport) {
    const lift = () => {
      const vv = window.visualViewport;
      $("sheet").style.bottom = Math.max(0, window.innerHeight - vv.height - vv.offsetTop) + "px";
    };
    visualViewport.addEventListener("resize", lift);
    visualViewport.addEventListener("scroll", lift);
  }

  const markScrolled = () => document.documentElement.classList.toggle("scrolled", window.scrollY > 4);
  window.addEventListener("scroll", markScrolled, { passive: true });
  markScrolled();

  // Refresh "Today" and "Overdue" labels as time passes.
  setInterval(() => { if ($("sheet").hidden && !openRow && !completing.size) render(); }, 60000);

  render();
  connectCloud();
</script>
<script>
  // Lets the app open offline once it has been loaded.
  if ("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js");
</script>
</body>
</html>
