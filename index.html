<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important} body{margin:0}</style>
<title>Daily To-Do List</title>
</head>
<body>
<style>
  /* Layout: a single phone-style column. Big title, task list, floating + button, full-screen task sheet. */
  :root {
    --bg: #ffffff;
    --fg: #111214;
    --muted: #9a9ca3;
    --line: #ececef;
    --soft: #f4f4f6;
    --fab: #111214;
    --on-fab: #ffffff;
    --accent: #3478f6;
    --star: #f5b400;
    --danger: #e5484d;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1012; --fg: #f2f2f4; --muted: #7c7f87; --line: #232428; --soft: #1b1c20;
      --fab: #f2f2f4; --on-fab: #0f1012; --accent: #4b8bff; --star: #ffc933; --danger: #ff6b6f;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1012; --fg: #f2f2f4; --muted: #7c7f87; --line: #232428; --soft: #1b1c20;
    --fab: #f2f2f4; --on-fab: #0f1012; --accent: #4b8bff; --star: #ffc933; --danger: #ff6b6f;
    color-scheme: dark;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
    font-size: 17px;
  }
  button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; padding: 0; }
  button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  svg { display: block; }

  .app {
    max-width: 560px;
    margin: 0 auto;
    min-height: 100%;
    padding-block: 20px 120px;
    padding-left: max(20px, env(safe-area-inset-left, 0px));
    padding-right: max(20px, env(safe-area-inset-right, 0px));
  }

  /* Header */
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 48px; }
  h1 { margin: 0; font-size: 2rem; font-weight: 800; letter-spacing: -0.02em; }
  .tools { display: flex; align-items: center; gap: 4px; background: var(--soft); border-radius: 999px; padding: 4px; position: relative; }
  .icon-btn { width: 40px; height: 40px; border-radius: 999px; display: grid; place-items: center; }
  .icon-btn:hover { background: var(--line); }
  #search {
    width: 100%; margin-top: 12px; padding: 10px 14px; border-radius: 12px; border: none;
    background: var(--soft); color: var(--fg); font: inherit;
  }
  .menu {
    position: absolute; right: 0; top: 52px; z-index: 5; min-width: 200px;
    background: var(--bg); border: 1px solid var(--line); border-radius: 14px; padding: 6px;
    box-shadow: 0 10px 30px rgb(0 0 0 / 0.12);
  }
  .menu button { display: block; width: 100%; text-align: left; padding: 10px 12px; border-radius: 10px; font-size: 0.95rem; }
  .menu button:hover { background: var(--soft); }

  /* List */
  ul { list-style: none; margin: 16px 0 0; padding: 0; }
  .task { display: flex; align-items: flex-start; gap: 14px; padding: 14px 0; border-bottom: 1px solid var(--line); }
  .check {
    flex: none; width: 24px; height: 24px; margin-top: 1px; border-radius: 999px;
    border: 2px solid var(--muted); display: grid; place-items: center; color: var(--on-fab);
    transition: background 0.15s, border-color 0.15s;
  }
  .done .check { background: var(--fg); border-color: var(--fg); }
  .check svg { opacity: 0; }
  .done .check svg { opacity: 1; }
  .body { flex: 1; min-width: 0; text-align: left; display: grid; gap: 4px; }
  .title { overflow-wrap: anywhere; line-height: 1.35; }
  .done .title { color: var(--muted); text-decoration: line-through; }
  .meta { display: flex; flex-wrap: wrap; gap: 10px; color: var(--muted); font-size: 0.85rem; }
  .meta span { display: inline-flex; align-items: center; gap: 4px; }
  .note-preview { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
  .flag { flex: none; color: var(--star); margin-top: 2px; }
  .section-toggle { margin-top: 24px; color: var(--muted); font-size: 0.9rem; font-weight: 600; display: flex; align-items: center; gap: 6px; }
  .section-toggle svg { transition: transform 0.2s; }
  .section-toggle.open svg { transform: rotate(90deg); }
  .empty { position: fixed; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 1.15rem; pointer-events: none; }

  .fab {
    position: fixed; z-index: 4;
    right: calc(24px + env(safe-area-inset-right, 0px));
    bottom: calc(28px + env(safe-area-inset-bottom, 0px));
    width: 60px; height: 60px; border-radius: 999px;
    background: var(--fab); color: var(--on-fab);
    display: grid; place-items: center;
    box-shadow: 0 8px 24px rgb(0 0 0 / 0.25);
    transition: transform 0.15s;
  }
  .fab:active { transform: scale(0.94); }

  /* Task sheet */
  .sheet {
    position: fixed; inset: 0; z-index: 10; background: var(--bg);
    display: flex; flex-direction: column;
    padding-top: env(safe-area-inset-top, 0px);
    animation: up 0.22s ease-out;
  }
  @keyframes up { from { transform: translateY(24px); opacity: 0; } }
  .sheet-top {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px max(12px, env(safe-area-inset-right, 0px)) 0 max(12px, env(safe-area-inset-left, 0px));
  }
  .sheet-top .icon-btn { color: var(--muted); }
  .sheet-body {
    flex: 1; overflow-y: auto; width: 100%; max-width: 560px; margin: 0 auto;
    padding-block: 4px 24px;
    padding-left: max(20px, env(safe-area-inset-left, 0px));
    padding-right: max(20px, env(safe-area-inset-right, 0px));
  }
  .row { display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--line); min-height: 52px; }
  #task-title {
    width: 100%; border: none; background: none; color: var(--fg);
    font: inherit; font-size: 1.3rem; padding: 14px 0;
  }
  #task-title:focus, #task-note:focus, .sub-input:focus { outline: none; }
  ::placeholder { color: var(--muted); }
  .row-btn { width: 100%; display: flex; align-items: center; gap: 12px; color: var(--muted); min-height: 52px; text-align: left; }
  #task-note {
    width: 100%; border: none; background: none; color: var(--fg); font: inherit; font-size: 1rem;
    resize: none; padding: 14px 0; min-height: 52px; field-sizing: content;
  }
  .sub { display: flex; align-items: center; gap: 12px; min-height: 44px; }
  .sub-check { flex: none; width: 18px; height: 18px; border: 2px solid var(--muted); border-radius: 4px; display: grid; place-items: center; color: var(--on-fab); }
  .sub.done .sub-check { background: var(--fg); border-color: var(--fg); }
  .sub-check svg { opacity: 0; }
  .sub.done .sub-check svg { opacity: 1; }
  .sub-input { flex: 1; min-width: 0; border: none; background: none; color: var(--fg); font: inherit; font-size: 1rem; padding: 8px 0; }
  .sub.done .sub-input { color: var(--muted); text-decoration: line-through; }
  .sub-remove { color: var(--muted); width: 32px; height: 32px; display: grid; place-items: center; }

  .toolbar {
    border-top: 1px solid var(--line); background: var(--bg);
    display: flex; align-items: center; gap: 4px;
    padding-block: 8px calc(8px + env(safe-area-inset-bottom, 0px));
    padding-left: max(12px, env(safe-area-inset-left, 0px));
    padding-right: max(12px, env(safe-area-inset-right, 0px));
  }
  .toolbar .icon-btn { width: 48px; height: 44px; border-radius: 12px; color: var(--fg); }
  .toolbar .icon-btn[aria-pressed="true"] { color: var(--star); }
  .toolbar .delete { color: var(--danger); }
  .spacer { flex: 1; }
  .save {
    height: 44px; min-width: 88px; padding: 0 20px; border-radius: 12px;
    background: var(--accent); color: #fff; display: grid; place-items: center;
  }
  .save:disabled { opacity: 0.4; cursor: default; }

  @media (prefers-reduced-motion: reduce) {
    .sheet { animation: none; }
    * { transition: none !important; }
  }
</style>

<div class="app">
  <header>
    <h1>To do</h1>
    <div class="tools">
      <button class="icon-btn" id="search-btn" type="button" aria-label="Search tasks">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      </button>
      <button class="icon-btn" id="menu-btn" type="button" aria-label="More options" aria-expanded="false">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>
      </button>
      <div class="menu" id="menu" hidden>
        <button type="button" id="menu-starred">Show starred only</button>
        <button type="button" id="menu-clear">Delete completed tasks</button>
      </div>
    </div>
  </header>
  <input id="search" type="search" placeholder="Search" autocomplete="off" hidden>

  <ul id="open-list"></ul>
  <button class="section-toggle" id="done-toggle" type="button" hidden>
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="m9 6 6 6-6 6"/></svg>
    <span id="done-label"></span>
  </button>
  <ul id="done-list" hidden></ul>
</div>

<div class="empty" id="empty" hidden>Tap + to add</div>

<button class="fab" id="fab" type="button" aria-label="Add task">
  <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
</button>

<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-label="Task">
  <div class="sheet-top">
    <button class="icon-btn" id="sheet-close" type="button" aria-label="Close without saving">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
  </div>
  <div class="sheet-body">
    <div class="row"><input id="task-title" type="text" placeholder="I want to ..." autocomplete="off" enterkeyhint="done"></div>
    <div class="row" id="note-row">
      <button class="row-btn" id="note-btn" type="button">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M6 3h8l4 4v14H6z"/><path d="M9 12h6M9 16h6"/></svg>
        Add note
      </button>
      <textarea id="task-note" rows="1" placeholder="Note" hidden></textarea>
    </div>
    <div id="subtasks"></div>
    <div class="row">
      <button class="row-btn" id="sub-add" type="button">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="16" height="16" rx="3"/></svg>
        Add subtask
      </button>
    </div>
  </div>
  <div class="toolbar" id="toolbar">
    <button class="icon-btn" id="star-btn" type="button" aria-label="Star this task" aria-pressed="false">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg>
    </button>
    <button class="icon-btn delete" id="delete-btn" type="button" aria-label="Delete task" hidden>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>
    </button>
    <div class="spacer"></div>
    <button class="save" id="save-btn" type="button" aria-label="Save task">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>
    </button>
  </div>
</div>

<script>
  const STORAGE_KEY = "todos-v2";
  const CHECK_SVG = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>';
  const $ = id => document.getElementById(id);

  let todos = load();
  let query = "";
  let starredOnly = false;
  let showDone = false;
  let editing = null;   // the task open in the sheet, or null for a new one
  let draft = null;     // working copy while the sheet is open

  // Tasks are saved in this browser so they survive a reload.
  function load() {
    try {
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
      if (Array.isArray(saved)) return saved;
    } catch {}
    return [
      { id: 1, text: "Example: tap a task to open it", note: "Notes show up under the title.", important: true, done: false,
        subtasks: [{ id: 11, text: "Add a subtask", done: true }, { id: 12, text: "Tick it off", done: false }] },
      { id: 2, text: "Example: tap the circle to finish a task", note: "", important: false, done: false, subtasks: [] },
    ];
  }

  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(todos)); } catch {}
  }

  // ---------- List ----------
  function matches(t) {
    if (starredOnly && !t.important) return false;
    if (!query) return true;
    const q = query.toLowerCase();
    return t.text.toLowerCase().includes(q) || (t.note || "").toLowerCase().includes(q) ||
      t.subtasks.some(s => s.text.toLowerCase().includes(q));
  }

  function taskItem(t) {
    const li = document.createElement("li");
    li.className = "task" + (t.done ? " done" : "");

    const check = document.createElement("button");
    check.className = "check";
    check.type = "button";
    check.innerHTML = CHECK_SVG;
    check.setAttribute("aria-label", t.done ? "Mark as not done" : "Mark as done");
    check.addEventListener("click", () => { t.done = !t.done; save(); render(); });

    const body = document.createElement("button");
    body.className = "body";
    body.type = "button";
    const title = document.createElement("span");
    title.className = "title";
    title.textContent = t.text;
    body.appendChild(title);

    const meta = document.createElement("span");
    meta.className = "meta";
    if (t.subtasks.length) {
      const s = document.createElement("span");
      s.textContent = `☐ ${t.subtasks.filter(x => x.done).length}/${t.subtasks.length}`;
      meta.appendChild(s);
    }
    if (t.note) {
      const n = document.createElement("span");
      n.className = "note-preview";
      n.textContent = t.note;
      meta.appendChild(n);
    }
    if (meta.childNodes.length) body.appendChild(meta);
    body.addEventListener("click", () => openSheet(t));

    li.append(check, body);
    if (t.important) {
      const flag = document.createElement("span");
      flag.className = "flag";
      flag.setAttribute("aria-label", "Starred");
      flag.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg>';
      li.appendChild(flag);
    }
    return li;
  }

  function render() {
    const visible = todos.filter(matches);
    // Starred tasks first, then newest first.
    const open = visible.filter(t => !t.done).sort((a, b) => (b.important - a.important) || (b.id - a.id));
    const done = visible.filter(t => t.done).sort((a, b) => b.id - a.id);

    $("open-list").replaceChildren(...open.map(taskItem));
    $("done-list").replaceChildren(...done.map(taskItem));
    $("done-toggle").hidden = done.length === 0;
    $("done-toggle").classList.toggle("open", showDone);
    $("done-label").textContent = `Completed (${done.length})`;
    $("done-list").hidden = !showDone || done.length === 0;

    const empty = $("empty");
    empty.hidden = visible.length > 0;
    empty.textContent = todos.length === 0 ? "Tap + to add" : "No matching tasks";
    $("menu-starred").textContent = starredOnly ? "Show all tasks" : "Show starred only";
  }

  // ---------- Sheet ----------
  function openSheet(task) {
    editing = task || null;
    draft = task
      ? JSON.parse(JSON.stringify(task))
      : { id: Date.now(), text: "", note: "", important: false, done: false, subtasks: [] };

    $("task-title").value = draft.text;
    $("task-note").value = draft.note;
    $("task-note").hidden = !draft.note;
    $("note-btn").hidden = !!draft.note;
    $("delete-btn").hidden = !editing;
    renderStar();
    renderSubtasks();
    updateSave();
    $("menu").hidden = true;
    $("sheet").hidden = false;
    $("fab").hidden = true;
    $("task-title").focus();
  }

  function closeSheet() {
    $("sheet").hidden = true;
    $("fab").hidden = false;
    editing = draft = null;
  }

  function commit() {
    draft.text = $("task-title").value.trim();
    draft.note = $("task-note").value.trim();
    draft.subtasks = draft.subtasks.filter(s => s.text.trim());
    if (!draft.text) return;
    if (editing) Object.assign(editing, draft);
    else todos.push(draft);
    save();
    closeSheet();
    render();
  }

  function renderStar() {
    $("star-btn").setAttribute("aria-pressed", String(draft.important));
    $("star-btn").querySelector("path").setAttribute("fill", draft.important ? "currentColor" : "none");
  }

  function updateSave() {
    $("save-btn").disabled = !$("task-title").value.trim();
  }

  function renderSubtasks(focusId) {
    const wrap = $("subtasks");
    wrap.replaceChildren(...draft.subtasks.map(s => {
      const row = document.createElement("div");
      row.className = "sub" + (s.done ? " done" : "");

      const box = document.createElement("button");
      box.className = "sub-check";
      box.type = "button";
      box.innerHTML = CHECK_SVG.replace(/14/g, "12");
      box.setAttribute("aria-label", "Mark subtask done");
      box.addEventListener("click", () => { s.done = !s.done; renderSubtasks(); });

      const input = document.createElement("input");
      input.className = "sub-input";
      input.id = "sub-" + s.id;
      input.value = s.text;
      input.placeholder = "Subtask";
      input.setAttribute("enterkeyhint", "next");
      input.addEventListener("input", () => { s.text = input.value; });
      input.addEventListener("keydown", e => {
        if (e.key === "Enter") { e.preventDefault(); addSubtask(); }
        if (e.key === "Backspace" && !input.value) { e.preventDefault(); removeSubtask(s); }
      });

      const remove = document.createElement("button");
      remove.className = "sub-remove";
      remove.type = "button";
      remove.setAttribute("aria-label", "Remove subtask");
      remove.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>';
      remove.addEventListener("click", () => removeSubtask(s));

      row.append(box, input, remove);
      return row;
    }));
    if (focusId) $("sub-" + focusId)?.focus();
  }

  function addSubtask() {
    const s = { id: Date.now(), text: "", done: false };
    draft.subtasks.push(s);
    renderSubtasks(s.id);
  }

  function removeSubtask(s) {
    const i = draft.subtasks.indexOf(s);
    draft.subtasks.splice(i, 1);
    const prev = draft.subtasks[i - 1];
    renderSubtasks(prev && prev.id);
  }

  // ---------- Events ----------
  $("fab").addEventListener("click", () => openSheet(null));
  $("sheet-close").addEventListener("click", closeSheet);
  $("save-btn").addEventListener("click", commit);
  $("task-title").addEventListener("input", updateSave);
  $("task-title").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); commit(); } });
  $("note-btn").addEventListener("click", () => {
    $("note-btn").hidden = true;
    $("task-note").hidden = false;
    $("task-note").focus();
  });
  $("sub-add").addEventListener("click", addSubtask);
  $("star-btn").addEventListener("click", () => { draft.important = !draft.important; renderStar(); });
  $("delete-btn").addEventListener("click", () => {
    todos = todos.filter(t => t !== editing);
    save();
    closeSheet();
    render();
  });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("sheet").hidden) closeSheet(); });

  $("search-btn").addEventListener("click", () => {
    const box = $("search");
    box.hidden = !box.hidden;
    if (box.hidden) { box.value = ""; query = ""; render(); } else box.focus();
  });
  $("search").addEventListener("input", e => { query = e.target.value.trim(); render(); });

  $("menu-btn").addEventListener("click", e => {
    e.stopPropagation();
    $("menu").hidden = !$("menu").hidden;
    $("menu-btn").setAttribute("aria-expanded", String(!$("menu").hidden));
  });
  document.addEventListener("click", e => { if (!$("menu").contains(e.target)) $("menu").hidden = true; });
  $("menu-starred").addEventListener("click", () => { starredOnly = !starredOnly; $("menu").hidden = true; render(); });
  $("menu-clear").addEventListener("click", () => { todos = todos.filter(t => !t.done); $("menu").hidden = true; save(); render(); });

  $("done-toggle").addEventListener("click", () => { showDone = !showDone; render(); });

  // Keep the toolbar right above the phone keyboard, like a native app.
  if (window.visualViewport) {
    const lift = () => {
      const vv = window.visualViewport;
      const hidden = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
      $("sheet").style.bottom = hidden + "px";
    };
    visualViewport.addEventListener("resize", lift);
    visualViewport.addEventListener("scroll", lift);
  }

  render();
</script>
</body>
</html>
