# Prints a summary of the anonymous crash and frame-rate reports from players' phones.
# Run it from Actions > Diagnostics > Run workflow; the summary is in the run's page.
name: Diagnostics

on:
  workflow_dispatch:
  # Run buttons only appear for workflows on the default branch, so a change to this file
  # on the working branch also runs it.
  push:
    branches: [claude/new-session-klw8t6]
    paths: [".github/workflows/diag.yml"]

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Read the reports
        working-directory: server
        run: |
          CLOUDFLARE_API_TOKEN=$(printf '%s' "$CLOUDFLARE_API_TOKEN" | grep -oE '[A-Za-z0-9_-]{35,}' | head -1)
          CLOUDFLARE_ACCOUNT_ID=$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | grep -oiE '[0-9a-f]{32}' | head -1)
          export CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID
          W="npx --yes wrangler@4"
          ID=$($W d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const l=JSON.parse(s);const d=l.find(x=>x.name==="skyrise");process.stdout.write(d?d.uuid:"")})')
          sed -i "s/PASTE_YOUR_D1_DATABASE_ID/$ID/" wrangler.toml
          SINCE=$(( ($(date +%s) - 14*86400) * 1000 ))
          q() { echo "### $1"; $W d1 execute skyrise --remote --json --command "$2" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const r=JSON.parse(s)[0]?.results??[];console.table(r)})'; }
          {
            q "Errors in the last 14 days (most common first)" "SELECT COUNT(*) AS n, msg, MAX(v) AS version, MAX(dev) AS device FROM diag WHERE kind='error' AND at > $SINCE GROUP BY msg ORDER BY n DESC LIMIT 30"
            q "Frame rate by device (last 14 days)" "SELECT dev AS device, COUNT(*) AS towers, ROUND(AVG(json_extract(data,'$.fps')),1) AS avg_fps, ROUND(AVG(json_extract(data,'$.slow')),1) AS slow_frames, ROUND(AVG(json_extract(data,'$.worst')),0) AS worst_ms, MAX(json_extract(data,'$.gfx')) AS graphics FROM diag WHERE kind='perf' AND at > $SINCE GROUP BY dev ORDER BY towers DESC LIMIT 30"
            echo; echo "## How people play (anonymous stats, last 14 days)"
            q "Players and towers per day" "SELECT date(at/1000,'unixepoch') AS day, COUNT(DISTINCT install) AS players, SUM(kind='tower') AS towers FROM stats WHERE at > $SINCE GROUP BY day ORDER BY day DESC LIMIT 14"
            q "How tall towers get (Classic)" "SELECT CASE WHEN f < 10 THEN 'a: under 10 floors' WHEN f < 25 THEN 'b: 10-24' WHEN f < 50 THEN 'c: 25-49' WHEN f < 100 THEN 'd: 50-99' WHEN f < 200 THEN 'e: 100-199' ELSE 'f: 200+' END AS floors, COUNT(*) AS towers FROM (SELECT json_extract(data,'$.floors') AS f FROM stats WHERE kind='tower' AND json_extract(data,'$.mode')='classic' AND at > $SINCE) GROUP BY floors ORDER BY floors"
            q "Average tower by experience (Classic)" "SELECT CASE WHEN towers <= 1 THEN 'a: 1st tower' WHEN towers <= 5 THEN 'b: towers 2-5' WHEN towers <= 20 THEN 'c: towers 6-20' WHEN towers <= 100 THEN 'd: towers 21-100' ELSE 'e: 100+' END AS experience, COUNT(*) AS n, ROUND(AVG(json_extract(data,'$.floors')),1) AS avg_floors, ROUND(AVG(json_extract(data,'$.perfects')),1) AS avg_perfects, MAX(json_extract(data,'$.floors')) AS best FROM stats WHERE kind='tower' AND json_extract(data,'$.mode')='classic' AND at > $SINCE GROUP BY experience ORDER BY experience"
            q "How far new players get (installs that started in the last 14 days)" "SELECT COUNT(*) AS installs, SUM(m >= 1) AS built_1, SUM(m >= 5) AS built_5, SUM(m >= 10) AS built_10, SUM(m >= 25) AS built_25, SUM(m >= 100) AS built_100 FROM (SELECT install, MAX(towers) AS m FROM stats WHERE install IN (SELECT install FROM stats WHERE day = 0 AND at > $SINCE) GROUP BY install)"
            q "Do players come back? (installs at least 7 days old)" "SELECT COUNT(*) AS installs, SUM(d >= 1) AS came_back_day1_or_later, SUM(d >= 7) AS still_playing_after_7_days FROM (SELECT install, MAX(day) AS d FROM stats GROUP BY install HAVING MIN(at) < ($(date +%s) - 7*86400) * 1000)"
            q "Levels reached" "SELECT json_extract(data,'$.level') AS level, COUNT(DISTINCT install) AS players FROM stats WHERE kind='tower' AND at > $SINCE GROUP BY level ORDER BY level"
            q "Modes played" "SELECT json_extract(data,'$.mode') AS mode, COUNT(*) AS towers, ROUND(AVG(json_extract(data,'$.floors')),1) AS avg_floors FROM stats WHERE kind='tower' AND at > $SINCE GROUP BY mode ORDER BY towers DESC"
            q "Latest 15 errors with details" "SELECT datetime(at/1000,'unixepoch') AS time, v, dev, msg, substr(data,1,400) AS details FROM diag WHERE kind='error' ORDER BY id DESC LIMIT 15"
          } 2>&1 | tee report.txt
          { echo '```'; cat report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
